name: Split standard SSAO and Visibility Bitmask

on:
  push:
    branches:
      - "opt/renderer-depth-meshblend"
    paths:
      - "misc/scripts/apply_ssao_standard_vb_split.py"
      - ".github/workflows/apply_ssao_standard_vb_split.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ssao-split-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-depth-meshblend
          fetch-depth: 0

      - name: Apply guarded source transformations
        run: python3 misc/scripts/apply_ssao_standard_vb_split.py

      - name: Validate patch
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import urllib.request

          expected_minimum = {
              "servers/rendering/renderer_rd/effects/ss_effects.cpp",
              "servers/rendering/renderer_rd/effects/ss_effects.h",
              "servers/rendering/renderer_rd/shaders/effects/ssao.glsl",
              "servers/rendering/renderer_rd/shaders/effects/ssao_vb.glsl",
          }
          actual = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          changed_paths = {line[3:] for line in actual}
          if not expected_minimum.issubset(changed_paths):
              raise SystemExit(f"Missing expected SSAO changes: actual={sorted(changed_paths)}")

          official = urllib.request.urlopen(
              "https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/servers/rendering/renderer_rd/shaders/effects/ssao.glsl",
              timeout=30,
          ).read()
          if Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl").read_bytes() != official:
              raise SystemExit("STANDARD SSAO is not byte-identical to Godot 4.7.2")
          PY

      - name: Commit separated SSAO pipelines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            servers/rendering/renderer_rd/effects/ss_effects.cpp \
            servers/rendering/renderer_rd/effects/ss_effects.h \
            servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
            servers/rendering/renderer_rd/shaders/effects/ssao_vb.glsl \
            servers/rendering/renderer_rd/shaders/effects/SCsub \
            servers/rendering/renderer_rd/shaders/SCsub
          git diff --cached --quiet && { echo "No SSAO changes staged"; exit 1; }
          git commit -m "Restore official standard SSAO and isolate Visibility Bitmask gather [ssao-split-applied]"
          git push origin HEAD:opt/renderer-depth-meshblend
