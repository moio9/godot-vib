name: 📱 Termux Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "4.7"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/workflows/termux_build.yml"
  push:
    branches:
      - "4.7"
      - "sync/4.7.2"
      - "opt/renderer-batch2"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/workflows/termux_build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}|${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-termux-aarch64:
    name: Termux aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Select the exact fork commit
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            SOURCE_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            SOURCE_COMMIT="${GITHUB_SHA}"
          fi
          test -n "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}/archive/${SOURCE_COMMIT}.tar.gz" >> "$GITHUB_ENV"

      - name: Checkout fork head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify repaired Mesh Blend output contract
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shader = Path("servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl").read_text(encoding="utf-8")
          shader_header = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.h").read_text(encoding="utf-8")
          shader_cpp = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp").read_text(encoding="utf-8")
          renderer = Path("servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp").read_text(encoding="utf-8")

          assert shader.count("layout(location = 3) out uint frag_mesh_blend_aux;") == 1
          assert "#ifdef MESH_BLEND_MAIN_PASS_OUTPUT\nlayout(location = 3) out uint frag_mesh_blend_aux;\n#endif" in shader
          assert "layout(location = 0) out vec4 frag_color;\n#define MESH_BLEND_MAIN_PASS_OUTPUT" not in shader
          assert "SHADER_COLOR_PASS_FLAG_MESH_BLEND = 1 << 5" in shader_header
          assert "PIPELINE_COLOR_PASS_FLAG_MESH_BLEND = 1 << 5" in shader_header
          assert '"\\n#define MESH_BLEND_MAIN_PASS_OUTPUT\\n"' in shader_cpp
          assert "color_attachment_count = (p_pipeline_key.color_pass_flags & PIPELINE_COLOR_PASS_FLAG_MESH_BLEND) ? 4 : 3" in shader_cpp
          assert renderer.count("VALID_FLAG_COMBINATION(COLOR_PASS_FLAG_MESH_BLEND") == 8
          assert "transparent_color_pass_flags &= ~uint32_t(COLOR_PASS_FLAG_MESH_BLEND);" in renderer
          PY
          git diff --check

      - name: Clone Termux package builder
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/termux/termux-packages.git "$RUNNER_TEMP/termux-packages"

      - name: Point the Termux Godot recipe at this fork commit
        shell: bash
        run: |
          set -euxo pipefail
          RECIPE="$RUNNER_TEMP/termux-packages/x11-packages/godot/build.sh"

          curl -L --fail --retry 3 "$SOURCE_URL" -o "$RUNNER_TEMP/godot-vib.tar.gz"
          SOURCE_SHA256="$(sha256sum "$RUNNER_TEMP/godot-vib.tar.gz" | awk '{print $1}')"
          tar -tzf "$RUNNER_TEMP/godot-vib.tar.gz" | grep -E '/LICENSE\.txt$'

          VERSION="$(python3 - <<'PY'
          ns = {}
          with open('version.py', 'r', encoding='utf-8') as f:
              exec(f.read(), ns)
          print(f"{ns['major']}.{ns['minor']}.{ns['patch']}")
          PY
          )"

          sed -i -E "s/^TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=\"${VERSION}\"/" "$RECIPE"
          sed -i -E "s|^TERMUX_PKG_SRCURL=.*|TERMUX_PKG_SRCURL=\"${SOURCE_URL}\"|" "$RECIPE"
          sed -i -E "s/^TERMUX_PKG_SHA256=.*/TERMUX_PKG_SHA256=${SOURCE_SHA256}/" "$RECIPE"
          sed -i -E 's/^TERMUX_PKG_AUTO_UPDATE=.*/TERMUX_PKG_AUTO_UPDATE=false/' "$RECIPE"
          sed -i '/^TERMUX_PKG_REVISION=/d' "$RECIPE"
          sed -i "/^TERMUX_PKG_VERSION=/a TERMUX_PKG_REVISION=100" "$RECIPE"
          sed -i '/^TERMUX_PKG_LICENSE_FILE=/d' "$RECIPE"
          sed -i '/^TERMUX_PKG_LICENSE=/a TERMUX_PKG_LICENSE_FILE="LICENSE.txt"' "$RECIPE"

          echo "Building Godot ${VERSION} fork commit ${SOURCE_COMMIT} for Termux/aarch64"
          grep -E '^TERMUX_PKG_(LICENSE|LICENSE_FILE|VERSION|REVISION|SRCURL|SHA256|DEPENDS|BUILD_DEPENDS)=' "$RECIPE"

      - name: Free disk space
        working-directory: ${{ runner.temp }}/termux-packages
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/free-space.sh

      - name: Build Godot package for Termux
        working-directory: ${{ runner.temp }}/termux-packages
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-docker.sh -d \
            ./build-package.sh -I -C -f -a aarch64 godot \
            2>&1 | tee "$GITHUB_WORKSPACE/termux-build.log"

      - name: Collect package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/termux-artifacts"
          find "$RUNNER_TEMP/termux-packages/output" -maxdepth 1 -type f -name 'godot*.deb' \
            -exec cp -v {} "$GITHUB_WORKSPACE/termux-artifacts/" \;
          test -n "$(find "$GITHUB_WORKSPACE/termux-artifacts" -maxdepth 1 -type f -name 'godot*.deb' -print -quit)"
          ls -lah "$GITHUB_WORKSPACE/termux-artifacts"

      - name: Upload Termux package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-termux-aarch64-${{ env.SOURCE_COMMIT }}
          path: termux-artifacts/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Termux build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-termux-build-log-${{ env.SOURCE_COMMIT }}
          path: termux-build.log
          if-no-files-found: warn
          retention-days: 14

