name: 📱 Termux Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "4.7"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/workflows/termux_build.yml"
  push:
    branches:
      - "4.7"
      - "sync/4.7.2"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/workflows/termux_build.yml"

permissions:
  contents: read

# Keep only the newest package build for each PR or branch.
concurrency:
  group: ${{ github.workflow }}|${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-renderer-batch:
    name: Linux renderer batch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout renderer optimization branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1
          submodules: recursive

      - name: Repair malformed Visibility allocator for compilation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h")
          text = header.read_text(encoding="utf-8")
          bad = "bool ensure_visibility_textures(true, bool p_need_aux = true, bool p_need_depth = true);"
          good = "bool ensure_visibility_textures(bool p_need_full_visibility = true, bool p_need_aux = true, bool p_need_depth = true);"
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good not in text:
              raise RuntimeError("Unknown ensure_visibility_textures declaration")
          text = text.replace(
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // RG16F',
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // R16_UINT: packed group and strength',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R32G32_UINT: edge coords',
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R16G16_UINT: edge coords',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R32G32_UINT: ping/pong',
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R16G16_UINT: ping/pong',
              1,
          )
          header.write_text(text, encoding="utf-8")

          source = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp")
          text = source.read_text(encoding="utf-8")
          bad_return = "\treturn has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_VIS) && (p_need_depth ? has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH) : true);"
          good_return = """\tconst bool visibility_ready = has_texture(RB_SCOPE_BUFFERS, p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT);
\tconst bool aux_ready = !p_need_aux || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_AUX);
\tconst bool depth_ready = !p_need_depth || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH);
\treturn visibility_ready && aux_ready && depth_ready;"""
          if bad_return in text:
              text = text.replace(bad_return, good_return, 1)
          elif good_return not in text:
              raise RuntimeError("Unknown ensure_visibility_textures result")
          source.write_text(text, encoding="utf-8")
          PY

          ! grep -R -n 'ensure_visibility_textures(true,' servers/rendering
          grep -q 'bool ensure_visibility_textures(bool p_need_full_visibility = true' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h
          grep -q 'p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          git diff --check

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compile Linux Forward+ editor
        shell: bash
        run: |
          set -o pipefail
          scons -j2 \
            platform=linuxbsd \
            target=editor \
            arch=x86_64 \
            dev_mode=yes \
            module_text_server_fb_enabled=yes \
            tests=no \
            2>&1 | tee renderer-batch2-build.log

      - name: Smoke-test and package Linux editor
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.x86_64*' -perm -111 | head -n 1)"
          test -n "$BIN"
          "$BIN" --headless --version | tee renderer-batch2-version.txt
          mkdir -p renderer-batch2-artifact
          cp "$BIN" renderer-batch2-artifact/godot-vib-4.7.2-renderer-batch2.x86_64
          cp renderer-batch2-version.txt renderer-batch2-artifact/
          tar -C renderer-batch2-artifact -cJf godot-vib-4.7.2-renderer-batch2-linux-x86_64.tar.xz .

      - name: Upload Linux editor
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-4.7.2-renderer-batch2-linux-x86_64
          path: godot-vib-4.7.2-renderer-batch2-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-batch2-linux-build-log
          path: renderer-batch2-build.log
          if-no-files-found: ignore
          retention-days: 14

  build-termux-aarch64:
    name: Termux aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Clone Termux package builder
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/termux/termux-packages.git "$RUNNER_TEMP/termux-packages"

      - name: Point Termux Godot recipe at this fork commit
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
        run: |
          set -euxo pipefail
          RECIPE="$RUNNER_TEMP/termux-packages/x11-packages/godot/build.sh"

          # Use the exact fork commit being tested rather than stock Godot sources.
          curl -L --fail --retry 3 "$SOURCE_URL" -o "$RUNNER_TEMP/godot-vib.tar.gz"
          SOURCE_SHA256="$(sha256sum "$RUNNER_TEMP/godot-vib.tar.gz" | awk '{print $1}')"

          VERSION="$(python3 - <<'PY'
          ns = {}
          with open('version.py', 'r', encoding='utf-8') as f:
              exec(f.read(), ns)
          print(f"{ns['major']}.{ns['minor']}.{ns['patch']}")
          PY
          )"

          sed -i -E "s/^TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=\"${VERSION}\"/" "$RECIPE"
          sed -i -E "s|^TERMUX_PKG_SRCURL=.*|TERMUX_PKG_SRCURL=\"${SOURCE_URL}\"|" "$RECIPE"
          sed -i -E "s/^TERMUX_PKG_SHA256=.*/TERMUX_PKG_SHA256=${SOURCE_SHA256}/" "$RECIPE"
          sed -i -E 's/^TERMUX_PKG_AUTO_UPDATE=.*/TERMUX_PKG_AUTO_UPDATE=false/' "$RECIPE"
          sed -i '/^TERMUX_PKG_REVISION=/d' "$RECIPE"
          sed -i "/^TERMUX_PKG_VERSION=/a TERMUX_PKG_REVISION=99" "$RECIPE"

          echo "Building Godot ${VERSION} fork commit ${{ github.sha }} for Termux/aarch64"
          grep -E '^TERMUX_PKG_(VERSION|REVISION|SRCURL|SHA256|DEPENDS|BUILD_DEPENDS)=' "$RECIPE"

      - name: Free disk space
        working-directory: ${{ runner.temp }}/termux-packages
        run: |
          set -euxo pipefail
          ./scripts/free-space.sh

      - name: Build Godot package for Termux
        working-directory: ${{ runner.temp }}/termux-packages
        run: |
          set -euxo pipefail
          ./scripts/run-docker.sh -d ./build-package.sh -I -C -f -a aarch64 godot

      - name: Collect packages
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/termux-artifacts"
          if [ -d "$RUNNER_TEMP/termux-packages/output" ]; then
            find "$RUNNER_TEMP/termux-packages/output" -maxdepth 1 -type f -name 'godot*.deb' -exec cp -v {} "$GITHUB_WORKSPACE/termux-artifacts/" \;
          fi
          ls -lah "$GITHUB_WORKSPACE/termux-artifacts"

      - name: Upload Termux package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-termux-aarch64-${{ github.sha }}
          path: termux-artifacts/*.deb
          if-no-files-found: error
          retention-days: 14
