name: 📱 Termux Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "4.7"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/workflows/termux_build.yml"
  push:
    branches:
      - "4.7"
      - "renderer-batch2-stable"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/workflows/termux_build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}|${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-renderer-batch:
    name: Linux renderer batch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout renderer optimization branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1
          submodules: recursive

      - name: Repair malformed Visibility allocator for compilation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h")
          text = header.read_text(encoding="utf-8")
          bad = "bool ensure_visibility_textures(true, bool p_need_aux = true, bool p_need_depth = true);"
          good = "bool ensure_visibility_textures(bool p_need_full_visibility = true, bool p_need_aux = true, bool p_need_depth = true);"
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good not in text:
              raise RuntimeError("Unknown ensure_visibility_textures declaration")
          text = text.replace(
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // RG16F',
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // R16_UINT: packed group and strength',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R32G32_UINT: edge coords',
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R16G16_UINT: edge coords',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R32G32_UINT: ping/pong',
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R16G16_UINT: ping/pong',
              1,
          )
          header.write_text(text, encoding="utf-8")

          source = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp")
          text = source.read_text(encoding="utf-8")
          bad_return = "\treturn has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_VIS) && (p_need_depth ? has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH) : true);"
          good_return = """\tconst bool visibility_ready = has_texture(RB_SCOPE_BUFFERS, p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT);
\tconst bool aux_ready = !p_need_aux || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_AUX);
\tconst bool depth_ready = !p_need_depth || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH);
\treturn visibility_ready && aux_ready && depth_ready;"""
          if bad_return in text:
              text = text.replace(bad_return, good_return, 1)
          elif good_return not in text:
              raise RuntimeError("Unknown ensure_visibility_textures result")
          source.write_text(text, encoding="utf-8")
          PY

          ! grep -R -n 'ensure_visibility_textures(true,' servers/rendering
          grep -q 'bool ensure_visibility_textures(bool p_need_full_visibility = true' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h
          grep -q 'p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          git diff --check

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compile Linux Forward+ editor
        shell: bash
        run: |
          set -o pipefail
          scons -j2 \
            platform=linuxbsd \
            target=editor \
            arch=x86_64 \
            dev_mode=yes \
            module_text_server_fb_enabled=yes \
            tests=no \
            2>&1 | tee renderer-batch2-build.log

      - name: Smoke-test and package Linux editor
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.x86_64*' -perm -111 | head -n 1)"
          test -n "$BIN"
          "$BIN" --headless --version | tee renderer-batch2-version.txt
          mkdir -p renderer-batch2-artifact
          cp "$BIN" renderer-batch2-artifact/godot-vib-4.7.2-renderer-batch2.x86_64
          cp renderer-batch2-version.txt renderer-batch2-artifact/
          tar -C renderer-batch2-artifact -cJf godot-vib-4.7.2-renderer-batch2-linux-x86_64.tar.xz .

      - name: Upload Linux editor
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-4.7.2-renderer-batch2-linux-x86_64
          path: godot-vib-4.7.2-renderer-batch2-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-batch2-linux-build-log
          path: renderer-batch2-build.log
          if-no-files-found: ignore
          retention-days: 14

  build-termux-aarch64:
    name: Termux aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Select the exact fork commit
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            SOURCE_COMMIT="${{ github.event.pull_request.head.sha }}"
          else
            SOURCE_COMMIT="${GITHUB_SHA}"
          fi
          test -n "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}/archive/${SOURCE_COMMIT}.tar.gz" >> "$GITHUB_ENV"

      - name: Checkout fork head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify renderer and SSAO contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shader = Path("servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl").read_text(encoding="utf-8")
          shader_header = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.h").read_text(encoding="utf-8")
          shader_cpp = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp").read_text(encoding="utf-8")
          renderer = Path("servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp").read_text(encoding="utf-8")
          ssao = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl").read_text(encoding="utf-8")

          assert shader.count("layout(location = 3) out uint frag_mesh_blend_aux;") == 1
          assert "#ifdef MESH_BLEND_MAIN_PASS_OUTPUT\nlayout(location = 3) out uint frag_mesh_blend_aux;\n#endif" in shader
          assert "layout(location = 0) out vec4 frag_color;\n#define MESH_BLEND_MAIN_PASS_OUTPUT" not in shader
          assert "SHADER_COLOR_PASS_FLAG_MESH_BLEND = 1 << 5" in shader_header
          assert "PIPELINE_COLOR_PASS_FLAG_MESH_BLEND = 1 << 5" in shader_header
          assert '"\\n#define MESH_BLEND_MAIN_PASS_OUTPUT\\n"' in shader_cpp
          assert "const uint32_t color_attachment_count = 4;" in shader_cpp
          assert renderer.count("VALID_FLAG_COMBINATION(COLOR_PASS_FLAG_MESH_BLEND") == 8
          assert "transparent_color_pass_flags &= ~uint32_t(COLOR_PASS_FLAG_MESH_BLEND);" in renderer

          assert "INTELSSAO_MAIN_DISK_SAMPLE_COUNT" in ssao
          assert "#define VB_SECTOR_COUNT 32u" in ssao
          assert "vb_update_sectors" in ssao
          assert "delta_back = delta_pos - p_view_dir * p_thickness" in ssao
          assert "bidirectional = params.flags.x > 1.5" in ssao
          for bad in ("GT-VBAO implementation", "integrate_slice(", "Simplified GTAO", "This is not quite right"):
              assert bad not in ssao
          PY
          git diff --check

      - name: Clone Termux package builder
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/termux/termux-packages.git "$RUNNER_TEMP/termux-packages"

      - name: Point the Termux Godot recipe at this fork commit
        shell: bash
        run: |
          set -euxo pipefail
          RECIPE="$RUNNER_TEMP/termux-packages/x11-packages/godot/build.sh"

          curl -L --fail --retry 3 "$SOURCE_URL" -o "$RUNNER_TEMP/godot-vib.tar.gz"
          SOURCE_SHA256="$(sha256sum "$RUNNER_TEMP/godot-vib.tar.gz" | awk '{print $1}')"
          tar -tzf "$RUNNER_TEMP/godot-vib.tar.gz" | grep -E '/LICENSE\.txt$'

          VERSION="$(python3 - <<'PY'
          ns = {}
          with open('version.py', 'r', encoding='utf-8') as f:
              exec(f.read(), ns)
          print(f"{ns['major']}.{ns['minor']}.{ns['patch']}")
          PY
          )"

          sed -i -E "s/^TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=\"${VERSION}\"/" "$RECIPE"
          sed -i -E "s|^TERMUX_PKG_SRCURL=.*|TERMUX_PKG_SRCURL=\"${SOURCE_URL}\"|" "$RECIPE"
          sed -i -E "s/^TERMUX_PKG_SHA256=.*/TERMUX_PKG_SHA256=${SOURCE_SHA256}/" "$RECIPE"
          sed -i -E 's/^TERMUX_PKG_AUTO_UPDATE=.*/TERMUX_PKG_AUTO_UPDATE=false/' "$RECIPE"
          sed -i '/^TERMUX_PKG_REVISION=/d' "$RECIPE"
          sed -i "/^TERMUX_PKG_VERSION=/a TERMUX_PKG_REVISION=103" "$RECIPE"
          sed -i '/^TERMUX_PKG_LICENSE_FILE=/d' "$RECIPE"
          sed -i '/^TERMUX_PKG_LICENSE=/a TERMUX_PKG_LICENSE_FILE="LICENSE.txt"' "$RECIPE"

          echo "Building Godot ${VERSION} fork commit ${SOURCE_COMMIT} for Termux/aarch64"
          grep -E '^TERMUX_PKG_(LICENSE|LICENSE_FILE|VERSION|REVISION|SRCURL|SHA256|DEPENDS|BUILD_DEPENDS)=' "$RECIPE"

      - name: Free disk space
        working-directory: ${{ runner.temp }}/termux-packages
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/free-space.sh

      - name: Build Godot package for Termux
        working-directory: ${{ runner.temp }}/termux-packages
        shell: bash
        run: |
          set -o pipefail
          ./scripts/run-docker.sh -d \
            ./build-package.sh -I -C -f -a aarch64 godot \
            2>&1 | tee "$GITHUB_WORKSPACE/termux-build.log"

      - name: Collect package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/termux-artifacts"
          find "$RUNNER_TEMP/termux-packages/output" -maxdepth 1 -type f -name 'godot*.deb' \
            -exec cp -v {} "$GITHUB_WORKSPACE/termux-artifacts/" \;
          test -n "$(find "$GITHUB_WORKSPACE/termux-artifacts" -maxdepth 1 -type f -name 'godot*.deb' -print -quit)"
          ls -lah "$GITHUB_WORKSPACE/termux-artifacts"

      - name: Upload Termux package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-termux-aarch64-${{ env.SOURCE_COMMIT }}
          path: termux-artifacts/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Termux build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-termux-build-log-${{ env.SOURCE_COMMIT }}
          path: termux-build.log
          if-no-files-found: warn
          retention-days: 14

# Rebuild marker: SSAO repair + MSAA opaque attachment contract, revision 103
