name: Repair and verify renderer branch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/repair_renderer_on_comment.yml
      - .github/scripts/repair_renderer_scene.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-and-verify-renderer-branch
  cancel-in-progress: true

jobs:
  repair-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@v6
        with:
          ref: master
          path: automation
          fetch-depth: 1

      - name: Checkout renderer optimization branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-batch2
          path: source
          fetch-depth: 1

      - name: Repair renderer source
        run: python3 automation/.github/scripts/repair_renderer_scene.py source

      - name: Validate and persist repairs
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'ERR_FAIL_COND(rb.is_null());' servers/rendering/renderer_rd/renderer_scene_render_rd.cpp
          grep -Fq 'jump_flood(current_edge, next_edge, vb_aux_slice' servers/rendering/renderer_rd/renderer_scene_render_rd.cpp
          grep -Fq 'blend(color_source, blend_depth, vb_aux_slice' servers/rendering/renderer_rd/renderer_scene_render_rd.cpp
          test ! -e site_scons/site_init.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Fix renderer scene Mesh Blend compile errors'
            git push origin HEAD:opt/renderer-batch2
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install SCons
        run: python -m pip install scons==4.10.1

      - name: Compile Linux Forward Plus editor
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          scons -j4 \
            platform=linuxbsd \
            target=editor \
            arch=x86_64 \
            dev_mode=yes \
            module_text_server_fb_enabled=yes \
            tests=no \
            2>&1 | tee renderer-repair-build.log

      - name: Smoke test editor
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          binary="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --headless --version | tee renderer-version.txt

      - name: Package Linux editor
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/linux
          binary="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*' -perm -111 | head -n 1)"
          cp "$binary" artifacts/linux/godot-vib-4.7.2-renderer-linux-x86_64
          chmod +x artifacts/linux/godot-vib-4.7.2-renderer-linux-x86_64
          cp renderer-version.txt artifacts/linux/
          tar -C artifacts/linux -cJf artifacts/godot-vib-4.7.2-renderer-linux-x86_64.tar.xz \
            godot-vib-4.7.2-renderer-linux-x86_64 renderer-version.txt

      - name: Upload verified Linux editor
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-4.7.2-renderer-linux-x86_64
          path: source/artifacts/godot-vib-4.7.2-renderer-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-repair-build-log
          path: source/renderer-repair-build.log
          if-no-files-found: ignore
          retention-days: 14
