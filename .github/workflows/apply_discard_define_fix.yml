name: Apply discard define fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/renderer-optimizations'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout renderer branch
        uses: actions/checkout@v7
        with:
          ref: work/renderer-optimizations
          fetch-depth: 0

      - name: Bind DISCARD_USED to the actual discard flag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp")
          text = path.read_text(encoding="utf-8")

          obsolete = '\t\tactions.usage_defines["DISCARD"] = "#define DISCARD_USED\\n";\n'
          if text.count(obsolete) != 1:
              raise RuntimeError("Unexpected DISCARD usage-define declaration")
          text = text.replace(obsolete, "", 1)

          anchor = '''\tif (uniforms.has(StringName("mesh_blend"))) {
          \t\tgen_code.defines.push_back(String("#define MATERIAL_HAS_MESH_BLEND\\n"));
          \t}
          '''
          replacement = anchor + '''
          \tif (uses_discard) {
          \t\tgen_code.defines.push_back(String("#define DISCARD_USED\\n"));
          \t}
          '''
          if text.count(anchor) != 1:
              raise RuntimeError("Unexpected material Mesh Blend define block")
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format patched source
        continue-on-error: true
        uses: j178/prek-action@v2
        with:
          extra-args: --files servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -n 'if (uses_discard)' servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp
          grep -n '#define DISCARD_USED' servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp
          if grep -n 'usage_defines\["DISCARD"\]' servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp; then
            echo "Obsolete DISCARD usage define still exists" >&2
            exit 1
          fi

          rm -f .github/workflows/apply_discard_define_fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate DISCARD_USED from the actual shader discard flag"
          git push origin HEAD:work/renderer-optimizations
