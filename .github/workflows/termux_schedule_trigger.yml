name: Dispatch final Termux renderer build

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-final-termux-renderer
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Termux workflow on renderer branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh workflow run termux_build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref opt/renderer-batch2
