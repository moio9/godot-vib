name: 🐧 Linux x86_64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - "opt/renderer-batch2"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/actions/**"
      - ".github/workflows/linux_x86_64_build.yml"

permissions:
  contents: read

concurrency:
  group: linux-x86-64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x86-64:
    name: Linux x86_64 editor
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout exact fork commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: recursive

      - name: Verify repaired Mesh Blend shader source
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq '#if defined(MODE_RENDER_VISIBILITY) && !defined(MODE_RENDER_VISIBILITY_NO_AUX)' \
            servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          grep -Fq 'clamp(sc_get_material_mesh_blend(), -1.0, 1.0)' \
            servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          git diff --check

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compile Linux x86_64 Forward+ editor
        shell: bash
        run: |
          set -o pipefail
          scons -j2 \
            platform=linuxbsd \
            target=editor \
            arch=x86_64 \
            dev_mode=yes \
            module_text_server_fb_enabled=yes \
            tests=no \
            2>&1 | tee linux-x86_64-build.log

      - name: Locate and smoke-test editor
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.x86_64*' -perm -111 | head -n 1)"
          test -n "$BIN"
          "$BIN" --headless --version | tee linux-x86_64-version.txt

          mkdir -p package
          install -m 0755 "$BIN" package/godot-vib-4.7.2-linux-x86_64
          cp linux-x86_64-version.txt package/
          printf '%s\n' "${GITHUB_SHA}" > package/commit.txt
          tar -C package -cJf godot-vib-4.7.2-linux-x86_64.tar.xz .
          sha256sum godot-vib-4.7.2-linux-x86_64.tar.xz > godot-vib-4.7.2-linux-x86_64.tar.xz.sha256

      - name: Upload Linux x86_64 editor
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-linux-x86_64-${{ github.sha }}
          path: |
            godot-vib-4.7.2-linux-x86_64.tar.xz
            godot-vib-4.7.2-linux-x86_64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-linux-x86_64-build-log-${{ github.sha }}
          path: linux-x86_64-build.log
          if-no-files-found: warn
          retention-days: 14
