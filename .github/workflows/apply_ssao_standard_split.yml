name: Restore official SSAO and split VB shader

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ssao-standard-4.7.2
    paths:
      - .github/workflows/apply_ssao_standard_split.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ssao-standard-4.7.2
          fetch-depth: 0

      - name: Preserve custom VB shader and restore official 4.7.2 SSAO
        shell: bash
        run: |
          set -euo pipefail
          cp servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
             servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
            -o servers/rendering/renderer_rd/shaders/effects/ssao.glsl

      - name: Route STANDARD and VB through separate shader pipelines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path("servers/rendering/renderer_rd/effects/ss_effects.h")
          text = header.read_text(encoding="utf-8")
          include = '#include "servers/rendering/renderer_rd/shaders/effects/ssao.glsl.gen.h"'
          vb_include = '#include "servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl.gen.h"'
          if vb_include not in text:
              if include not in text:
                  raise RuntimeError("SSAO generated shader include was not found")
              text = text.replace(include, include + "\n" + vb_include, 1)

          if "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader;" not in text:
              old = "\t\tSsaoShaderRD gather_shader;\n\t\tRID gather_shader_version;"
              if old not in text:
                  # Accommodate a single-tab structure indentation.
                  old = "\tSsaoShaderRD gather_shader;\n\tRID gather_shader_version;"
              if old not in text:
                  raise RuntimeError("SSAO gather shader fields were not found")
              indent = old.split("SsaoShaderRD", 1)[0]
              new = (
                  old
                  + "\n"
                  + indent + "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader;\n"
                  + indent + "RID visibility_bitmask_shader_version;\n"
                  + indent + "PipelineDeferredRD visibility_bitmask_pipelines[SSAO_GATHER_ADAPTIVE + 1];"
              )
              text = text.replace(old, new, 1)
          header.write_text(text, encoding="utf-8")

          cpp = Path("servers/rendering/renderer_rd/effects/ss_effects.cpp")
          text = cpp.read_text(encoding="utf-8")

          if "visibility_bitmask_shader.initialize(ssao_modes)" not in text:
              start = text.index("ssao.gather_shader.initialize(ssao_modes);")
              loop_start = text.index("for (int i = 0; i <= SSAO_GATHER_ADAPTIVE; i++)", start)
              brace = text.index("{", loop_start)
              depth = 0
              loop_end = None
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          loop_end = i + 1
                          break
              if loop_end is None:
                  raise RuntimeError("Could not parse the SSAO gather pipeline creation loop")
              indent = re.match(r"[\t ]*", text[loop_start:]).group(0)
              addition = (
                  "\n\n"
                  + indent + "ssao.visibility_bitmask_shader.initialize(ssao_modes);\n"
                  + indent + "ssao.visibility_bitmask_shader_version = ssao.visibility_bitmask_shader.version_create();\n"
                  + indent + "for (int i = 0; i <= SSAO_GATHER_ADAPTIVE; i++) {\n"
                  + indent + "\tssao.visibility_bitmask_pipelines[i].create_compute_pipeline(ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, i));\n"
                  + indent + "}"
              )
              text = text[:loop_end] + addition + text[loop_end:]

          if "visibility_bitmask_shader.version_free" not in text:
              candidates = [
                  "ssao.gather_shader.version_free(ssao.gather_shader_version);",
                  "ssao.gather_shader_version = RID();",
              ]
              inserted = False
              for candidate in candidates:
                  pos = text.find(candidate)
                  if pos >= 0:
                      line_end = text.find("\n", pos)
                      indent = re.match(r"[\t ]*", text[text.rfind("\n", 0, pos) + 1:pos]).group(0)
                      addition = "\n" + indent + "ssao.visibility_bitmask_shader.version_free(ssao.visibility_bitmask_shader_version);"
                      text = text[:line_end] + addition + text[line_end:]
                      inserted = True
                      break
              if not inserted:
                  # version_free may be centralized; pipeline/shader objects still own their RIDs.
                  print("No explicit SSAO gather version_free call found; no destructor insertion needed.")

          # Modify only the internal SSAO gather function.
          function_match = re.search(r"void SSEffects::[A-Za-z0-9_]*SSAO[A-Za-z0-9_]*internal\s*\(", text)
          if function_match is None:
              function_match = re.search(r"void SSEffects::[A-Za-z0-9_]*ssao[A-Za-z0-9_]*internal\s*\(", text)
          if function_match is None:
              raise RuntimeError("Could not locate the internal SSAO gather function")
          fn_start = function_match.start()
          fn_end_match = re.search(r"\nvoid SSEffects::", text[function_match.end():])
          fn_end = len(text) if fn_end_match is None else function_match.end() + fn_end_match.start()
          fn = text[fn_start:fn_end]
          if "p_use_vb" not in fn:
              raise RuntimeError("The SSAO gather function does not expose p_use_vb")

          if "get_active_gather_shader" not in fn:
              body_open = fn.index("{") + 1
              helpers = '''
\tauto get_active_gather_shader = [&](int p_mode) -> RID {
\t\tif (p_use_vb) {
\t\t\treturn ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, p_mode);
\t\t}
\t\treturn ssao.gather_shader.version_get_shader(ssao.gather_shader_version, p_mode);
\t};
\tauto get_active_gather_pipeline = [&](int p_mode) -> RID {
\t\tif (p_use_vb) {
\t\t\treturn ssao.visibility_bitmask_pipelines[p_mode].get_rid();
\t\t}
\t\treturn ssao.pipelines[p_mode].get_rid();
\t};
'''
              fn = fn[:body_open] + helpers + fn[body_open:]

          def replace_shader_calls(source: str) -> tuple[str, int]:
              prefix = "ssao.gather_shader.version_get_shader(ssao.gather_shader_version,"
              count = 0
              cursor = 0
              while True:
                  start = source.find(prefix, cursor)
                  if start < 0:
                      break
                  arg_start = start + len(prefix)
                  depth = 0
                  end = arg_start
                  while end < len(source):
                      ch = source[end]
                      if ch == "(":
                          depth += 1
                      elif ch == ")":
                          if depth == 0:
                              break
                          depth -= 1
                      end += 1
                  if end >= len(source):
                      raise RuntimeError("Unterminated gather shader lookup")
                  arg = source[arg_start:end].strip()
                  replacement = f"get_active_gather_shader({arg})"
                  source = source[:start] + replacement + source[end + 1:]
                  cursor = start + len(replacement)
                  count += 1
              return source, count

          fn, shader_replacements = replace_shader_calls(fn)
          # Do not rewrite the helper fallback we just inserted.
          helper_begin = fn.index("auto get_active_gather_shader")
          helper_end = fn.index("};", helper_begin) + 2
          helper = fn[helper_begin:helper_end]
          if "ssao.gather_shader.version_get_shader" not in helper:
              raise RuntimeError("The standard gather helper fallback was unexpectedly rewritten")

          before_helper = fn[:helper_end]
          after_helper = fn[helper_end:]
          pipeline_pattern = re.compile(r"ssao\.pipelines\[([^\]]+)\]\.get_rid\(\)")
          after_helper, pipeline_replacements = pipeline_pattern.subn(r"get_active_gather_pipeline(\1)", after_helper)
          fn = before_helper + after_helper

          if shader_replacements == 0:
              raise RuntimeError("No SSAO gather shader call sites were routed")
          if pipeline_replacements == 0:
              raise RuntimeError("No SSAO gather pipeline call sites were routed")

          text = text[:fn_start] + fn + text[fn_end:]
          cpp.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/apply_ssao_standard_split.yml

      - name: Commit compiled SSAO split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore official 4.7.2 SSAO and isolate visibility-bitmask gather"
          git push origin HEAD:fix/ssao-standard-4.7.2
