name: Consolidate renderer optimizations v3

on:
  pull_request:
    branches:
      - "4.7"
    paths:
      - ".github/workflows/renderer_batch2_apply_v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-batch2-v3
  cancel-in-progress: false

jobs:
  apply-build-commit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 0

      - name: Fetch source branches
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Normalize current source names
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scene = Path("servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl")
          text = scene.read_text(encoding="utf-8")
          text = text.replace(
              "layout(location = 1) out vec4 visibility_aux_output;",
              "layout(location = 1) out vec2 frag_visibility_aux;",
          )
          text = text.replace(
              "visibility_aux_output = vec4(aux, 0.0, 0.0);",
              "frag_visibility_aux = aux;",
          )
          text = text.replace("visibility_aux_output", "frag_visibility_aux")
          if "frag_visibility_aux" not in text:
              raise RuntimeError("Could not normalize Visibility AUX output")
          scene.write_text(text, encoding="utf-8")

          for path in (
              Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h"),
              Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp"),
          ):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "ensure_visibility_textures(bool p_with_aux, bool p_create_depth)",
                  "ensure_visibility_textures(bool p_need_aux, bool p_need_depth)",
              )
              text = text.replace("p_with_aux", "p_need_aux")
              text = text.replace("p_create_depth", "p_need_depth")
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Apply validated shared-depth and edge-correctness patch
        shell: bash
        run: |
          set -euxo pipefail
          git show origin/opt/renderer-depth-final:.github/workflows/finalize_renderer_depth_optimizations.yml > /tmp/depth-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("/tmp/depth-workflow.yml").read_text(encoding="utf-8")
          match = re.search(r"python3 - <<'PY'\n(?P<body>.*?)\n[ \t]+PY(?:\n|$)", source, flags=re.DOTALL)
          if not match:
              raise RuntimeError("Depth patch program was not found")
          lines = match.group("body").splitlines()
          first = next(line for line in lines if line.strip())
          prefix = re.match(r"^[ \t]*", first).group(0)
          body = "\n".join(line[len(prefix):] if line.startswith(prefix) else line for line in lines) + "\n"
          Path("/tmp/depth-patch.py").write_text(body, encoding="utf-8")
          PY
          python3 /tmp/depth-patch.py
          git diff --check

      - name: Add functional per-pixel Mesh Blend shader API
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def insert_after_line(path: Path, needle: str, additions: list[str], guard: str) -> None:
              text = path.read_text(encoding="utf-8")
              if guard in text:
                  return
              lines = text.splitlines(keepends=True)
              index = next((i for i, line in enumerate(lines) if needle in line), None)
              if index is None:
                  raise RuntimeError(f"{path}: anchor not found: {needle}")
              indent = re.match(r"\s*", lines[index]).group(0)
              lines[index + 1:index + 1] = [indent + line + "\n" for line in additions]
              path.write_text("".join(lines), encoding="utf-8")

          # The public spatial language already has MESH_BLEND in this fork.
          # Add the group output only if missing.
          shader_types = Path("servers/rendering/shader_types.cpp")
          text = shader_types.read_text(encoding="utf-8")
          if 'built_ins["MESH_BLEND_GROUP"]' not in text:
              lines = text.splitlines(keepends=True)
              index = next((i for i, line in enumerate(lines) if 'functions["fragment"].built_ins["MESH_BLEND"]' in line), None)
              if index is None:
                  index = next((i for i, line in enumerate(lines) if 'functions["fragment"].built_ins["ALBEDO"]' in line), None)
              if index is None:
                  raise RuntimeError("Spatial fragment Mesh Blend registration anchor was not found")
              base = lines[index]
              group = base.replace('["MESH_BLEND"]', '["MESH_BLEND_GROUP"]').replace('["ALBEDO"]', '["MESH_BLEND_GROUP"]').replace("TYPE_FLOAT", "TYPE_UINT").replace("TYPE_VEC3", "TYPE_UINT")
              lines[index + 1:index + 1] = [group]
              shader_types.write_text("".join(lines), encoding="utf-8")

          def patch_compiler(path: Path, add_usage_defines: bool) -> None:
              if not path.exists():
                  return
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  'actions.renames["MESH_BLEND"] = "mesh_blend_value";',
                  'actions.renames["MESH_BLEND"] = "mesh_blend_output";',
              )
              path.write_text(text, encoding="utf-8")
              insert_after_line(
                  path,
                  'actions.renames["MESH_BLEND"]',
                  ['actions.renames["MESH_BLEND_GROUP"] = "mesh_blend_group_output";'],
                  'actions.renames["MESH_BLEND_GROUP"]',
              )
              if add_usage_defines:
                  insert_after_line(
                      path,
                      'actions.renames["MESH_BLEND_GROUP"]',
                      [
                          'actions.usage_defines["MESH_BLEND"] = "#define MESH_BLEND_OUTPUT_USED\\n";',
                          'actions.usage_defines["MESH_BLEND_GROUP"] = "#define MESH_BLEND_GROUP_OUTPUT_USED\\n";',
                      ],
                      'actions.usage_defines["MESH_BLEND_GROUP"]',
                  )

          clustered_cpp = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp")
          patch_compiler(clustered_cpp, True)

          mobile_cpp = Path("servers/rendering/renderer_rd/forward_mobile/scene_shader_forward_mobile.cpp")
          if mobile_cpp.exists():
              mobile_text = mobile_cpp.read_text(encoding="utf-8")
              if 'actions.renames["MESH_BLEND"]' not in mobile_text:
                  insert_after_line(
                      mobile_cpp,
                      'actions.renames["ALBEDO"]',
                      ['actions.renames["MESH_BLEND"] = "mesh_blend_output";'],
                      'actions.renames["MESH_BLEND"]',
                  )
              patch_compiler(mobile_cpp, False)

          gles_candidates = []
          for candidate in Path("drivers/gles3").rglob("*.cpp"):
              content = candidate.read_text(encoding="utf-8", errors="ignore")
              if 'actions.renames["ALBEDO"]' in content:
                  gles_candidates.append(candidate)
          if len(gles_candidates) != 1:
              raise RuntimeError(f"Expected one GLES3 spatial compiler, found {gles_candidates}")
          gles_cpp = gles_candidates[0]
          if 'actions.renames["MESH_BLEND"]' not in gles_cpp.read_text(encoding="utf-8"):
              insert_after_line(
                  gles_cpp,
                  'actions.renames["ALBEDO"]',
                  ['actions.renames["MESH_BLEND"] = "mesh_blend_output";'],
                  'actions.renames["MESH_BLEND"]',
              )
          patch_compiler(gles_cpp, False)

          def ensure_fragment_locals(path: Path) -> None:
              if not path.exists():
                  return
              text = path.read_text(encoding="utf-8")
              if "float mesh_blend_output" in text and "uint mesh_blend_group_output" in text:
                  return
              marker = "#CODE : FRAGMENT"
              if text.count(marker) != 1:
                  raise RuntimeError(f"{path}: expected one fragment marker, got {text.count(marker)}")
              declarations = "float mesh_blend_output = 0.0;\nuint mesh_blend_group_output = 0u;\n\n"
              path.write_text(text.replace(marker, declarations + marker, 1), encoding="utf-8")

          clustered_glsl = Path("servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl")
          ensure_fragment_locals(clustered_glsl)
          ensure_fragment_locals(Path("servers/rendering/renderer_rd/shaders/forward_mobile/scene_forward_mobile.glsl"))
          ensure_fragment_locals(Path("drivers/gles3/shaders/scene.glsl"))

          # Visibility debug without AUX remains cheap. The Mesh Blend/MSAA AUX
          # variant must execute the user's fragment code before writing metadata.
          text = clustered_glsl.read_text(encoding="utf-8")
          old_block = re.compile(
              r"#ifdef MODE_RENDER_VISIBILITY\n"
              r"(?P<body>.*?)"
              r"\treturn;\n"
              r"#endif\n",
              flags=re.DOTALL,
          )
          match = old_block.search(text)
          if not match:
              raise RuntimeError("Forward+ Visibility early block was not found")
          body = match.group("body")
          packed_match = re.search(
              r"\tuvec2 packed_ids = .*?;\n\tvisibility_id_output = .*?;\n",
              body,
              flags=re.DOTALL,
          )
          if not packed_match:
              raise RuntimeError("Visibility ID write was not found")
          replacement = (
              "#ifdef MODE_RENDER_VISIBILITY\n"
              + packed_match.group(0)
              + "#ifdef MODE_RENDER_VISIBILITY_NO_AUX\n"
              + "\treturn;\n"
              + "#endif\n"
              + "#endif\n"
          )
          text = text[:match.start()] + replacement + text[match.end():]

          marker = "#CODE : FRAGMENT"
          if text.count(marker) != 1:
              raise RuntimeError("Forward+ fragment marker count changed unexpectedly")
          post_code = r'''
#ifdef MODE_RENDER_VISIBILITY
	float material_mesh_blend = clamp(sc_get_material_mesh_blend(), -1.0, 1.0);
	float blend_id = sc_instance_hash(packed_ids.y);
	frag_visibility_aux = vec2(material_mesh_blend, blend_id);
#ifdef MESH_BLEND_OUTPUT_USED
	frag_visibility_aux.x = clamp(mesh_blend_output, 0.0, 1.0);
#endif
#ifdef MESH_BLEND_GROUP_OUTPUT_USED
	frag_visibility_aux.y = float(min(mesh_blend_group_output, 255u)) / 255.0;
#endif
	return;
#endif
'''
          text = text.replace(marker, marker + post_code, 1)
          clustered_glsl.write_text(text, encoding="utf-8")

          checks = {
              shader_types: ('built_ins["MESH_BLEND"]', 'built_ins["MESH_BLEND_GROUP"]'),
              clustered_cpp: ('actions.renames["MESH_BLEND"] = "mesh_blend_output"', 'actions.usage_defines["MESH_BLEND_GROUP"]'),
              clustered_glsl: ('float mesh_blend_output', 'MESH_BLEND_GROUP_OUTPUT_USED', 'frag_visibility_aux = vec2(material_mesh_blend, blend_id)'),
              gles_cpp: ('actions.renames["MESH_BLEND"]', 'actions.renames["MESH_BLEND_GROUP"]'),
          }
          for path, needles in checks.items():
              content = path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in content:
                      raise RuntimeError(f"{path}: missing {needle}")
          PY
          git diff --check

      - name: Apply validated Mesh Blend bandwidth passes
        shell: bash
        run: |
          set -euxo pipefail

          apply_workflow_python() {
            local branch="$1"
            local workflow="$2"
            local adapter="${3:-none}"
            git show "origin/${branch}:${workflow}" > /tmp/source-workflow.yml
            python3 - "$adapter" <<'PYEXTRACT'
          from pathlib import Path
          import re
          import sys

          source = Path("/tmp/source-workflow.yml").read_text(encoding="utf-8")
          match = re.search(r"python3 - <<'PY'\n(?P<body>.*?)\n[ \t]+PY(?:\n|$)", source, flags=re.DOTALL)
          if not match:
              raise RuntimeError("Patch program not found")
          lines = match.group("body").splitlines()
          first = next(line for line in lines if line.strip())
          prefix = re.match(r"^[ \t]*", first).group(0)
          body = "\n".join(line[len(prefix):] if line.startswith(prefix) else line for line in lines) + "\n"
          if sys.argv[1] == "compact-bool":
              body = body.replace("void ensure_visibility_textures", "bool ensure_visibility_textures")
              body = body.replace(
                  'r"void ([A-Za-z0-9_:]+)::ensure_visibility_textures',
                  'r"bool ([A-Za-z0-9_:]+)::ensure_visibility_textures',
              )
              body = body.replace(
                  'r"void \\1::ensure_visibility_textures',
                  'r"bool \\1::ensure_visibility_textures',
              )
          Path("/tmp/source-patch.py").write_text(body, encoding="utf-8")
          PYEXTRACT
            python3 /tmp/source-patch.py
            git diff --check
          }

          apply_workflow_python opt/mesh-blend-mask-bandwidth .github/workflows/optimize_mesh_blend_mask_bandwidth.yml
          apply_workflow_python opt/mesh-blend-compact-visibility-attachment .github/workflows/optimize_mesh_blend_visibility_attachment.yml compact-bool
          apply_workflow_python opt/mesh-blend-bounded-jump-flood .github/workflows/optimize_mesh_blend_jump_flood.yml
          apply_workflow_python opt/mesh-blend-rg16-edges .github/workflows/optimize_mesh_blend_edge_format.yml
          apply_workflow_python opt/mesh-blend-packed-mask .github/workflows/optimize_mesh_blend_mask_format.yml
          apply_workflow_python opt/mesh-blend-packed-vb-aux .github/workflows/optimize_mesh_blend_vb_aux.yml
          apply_workflow_python opt/mesh-blend-reuse-vb-aux-mask .github/workflows/optimize_mesh_blend_mask_alias.yml
          apply_workflow_python opt/mesh-blend-main-pass-metadata .github/workflows/optimize_mesh_blend_main_pass_metadata.yml

      - name: Remove tracked generated files
        shell: bash
        run: |
          set -euxo pipefail
          mapfile -t generated < <(git ls-files -ci --exclude-standard | grep -E '\.gen\.' || true)
          if (( ${#generated[@]} > 0 )); then
            git rm -f -- "${generated[@]}"
          fi
          bash ./misc/scripts/gitignore_check.sh

      - name: Verify optimized source invariants
        shell: bash
        run: |
          set -euxo pipefail
          grep -R 'built_ins\["MESH_BLEND_GROUP"\]' -n servers/rendering/shader_types.cpp
          grep -R 'actions.usage_defines\["MESH_BLEND_GROUP"\]' -n servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp
          grep -R 'DATA_FORMAT_R16_UINT' -n servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          grep -R 'DATA_FORMAT_R16G16_UINT' -n servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          grep -R 'frag_mesh_blend_aux' -n servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          grep -R 'p_gtid.y % 8' -n servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl
          grep -R 'p_gtid.y % 16' -n servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl
          grep -R 'neighbor_pixel + ivec2(1)' -n servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl
          grep -R 'MODE_RENDER_VISIBILITY_NO_AUX' -n servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          grep -R 'MESH_BLEND_GROUP_OUTPUT_USED' -n servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          if grep -R 'RB_TEX_MESH_BLEND_MASK' -n servers/rendering/renderer_rd; then
            echo "::error::Duplicate full-resolution Mesh Blend mask remains"
            exit 1
          fi
          git diff --check

      - name: Install shader validation tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools

      - name: Validate standalone Mesh Blend shaders
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ("mesh_blend_mask", "mesh_blend_jump_flood"):
              source = Path(f"servers/rendering/renderer_rd/shaders/effects/{name}.glsl")
              text = source.read_text(encoding="utf-8")
              text = text.replace("#[compute]\n", "", 1).replace("#VERSION_DEFINES", "", 1)
              Path(f"/tmp/{name}.comp").write_text(text, encoding="utf-8")
          blend = Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_blend.glsl").read_text(encoding="utf-8")
          fragment = blend.split("#[fragment]", 1)[1].replace("#VERSION_DEFINES", "", 1)
          Path("/tmp/mesh_blend_blend.frag").write_text(fragment, encoding="utf-8")
          PY
          for shader in /tmp/mesh_blend_*.comp; do
            glslangValidator -V --target-env vulkan1.2 -S comp "$shader" -o "${shader%.comp}.spv"
            spirv-val --target-env vulkan1.2 "${shader%.comp}.spv"
          done
          glslangValidator -V --target-env vulkan1.2 -S frag /tmp/mesh_blend_blend.frag -o /tmp/mesh_blend_blend.spv
          spirv-val --target-env vulkan1.2 /tmp/mesh_blend_blend.spv

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux Forward+ editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Commit validated source result
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/renderer_batch2_apply.yml
          rm -f .github/workflows/renderer_batch2_apply_v2.yml
          rm -f .github/workflows/renderer_batch2_apply_v3.yml
          mkdir -p .github/build-status
          {
            echo "branch=opt/renderer-batch2"
            echo "validated_by_run=${{ github.run_id }}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build=linux-editor"
            echo "msaa_fallback=fragment-output-enabled"
            echo "runtime_validation=pending"
          } > .github/build-status/renderer-batch2-compile.txt
          git add -A
          git commit -m "Consolidate renderer, Mesh Blend and MSAA optimizations"
          git push origin HEAD:opt/renderer-batch2
