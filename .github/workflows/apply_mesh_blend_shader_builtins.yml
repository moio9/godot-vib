name: Apply Mesh Blend shader builtins

on:
  push:
    branches:
      - "opt/renderer-depth-meshblend"
    paths:
      - "misc/scripts/apply_mesh_blend_shader_builtins.py"
      - ".github/workflows/apply_mesh_blend_shader_builtins.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mesh-blend-builtins-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-depth-meshblend
          fetch-depth: 0

      - name: Apply guarded source transformations
        run: python3 misc/scripts/apply_mesh_blend_shader_builtins.py

      - name: Validate patch
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              "servers/rendering/shader_types.cpp",
              "servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp",
              "servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl",
          }
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          if actual != expected:
              raise SystemExit(f"Unexpected changed files: actual={sorted(actual)}, expected={sorted(expected)}")
          PY

      - name: Commit per-pixel Mesh Blend outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            servers/rendering/shader_types.cpp \
            servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp \
            servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          git commit -m "Add per-pixel Mesh Blend outputs to spatial shaders [mesh-blend-builtins-applied]"
          git push origin HEAD:opt/renderer-depth-meshblend
