name: Finalize official SSAO and Visibility Bitmask split

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ssao-standard-final
    paths:
      - .github/workflows/finalize_ssao_standard_split.yml

permissions:
  contents: write

jobs:
  patch-build-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ssao-standard-final
          fetch-depth: 0

      - name: Restore the official 4.7.2 algorithm while preserving the fork ABI
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM=servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl
          STANDARD=servers/rendering/renderer_rd/shaders/effects/ssao.glsl

          if [ ! -f "$CUSTOM" ]; then
            cp "$STANDARD" "$CUSTOM"
          fi

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
            -o /tmp/ssao.official.glsl

          python3 - <<'PY'
          from pathlib import Path
          import re

          custom_path = Path("servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl")
          standard_path = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl")
          official_path = Path("/tmp/ssao.official.glsl")

          custom = custom_path.read_text(encoding="utf-8")
          official = official_path.read_text(encoding="utf-8")
          block_pattern = re.compile(
              r"layout\(push_constant, std430\) uniform Params\s*\{.*?\}\s*params;",
              flags=re.DOTALL,
          )
          custom_match = block_pattern.search(custom)
          official_match = block_pattern.search(official)
          if custom_match is None or official_match is None:
              raise RuntimeError("Could not locate both SSAO push-constant blocks")

          custom_block = custom_match.group(0)
          if "flags" not in custom_block:
              raise RuntimeError("The fork SSAO ABI no longer contains its algorithm flags")

          # Every field used by the official shader must still exist in the fork ABI block.
          official_fields = set(re.findall(r"params\.([A-Za-z_][A-Za-z0-9_]*)", official))
          declared_fields = set()
          for declaration in custom_block.splitlines():
              declaration = declaration.strip()
              match = re.match(
                  r"(?:const\s+)?(?:bool|int|uint|float|vec[234]|ivec[234]|uvec[234]|mat[234])\s+([A-Za-z_][A-Za-z0-9_]*)",
                  declaration,
              )
              if match:
                  declared_fields.add(match.group(1))
          missing = sorted(official_fields - declared_fields)
          if missing:
              raise RuntimeError(f"Fork push-constant ABI is missing official fields: {missing}")

          standard = official[:official_match.start()] + custom_block + official[official_match.end():]
          standard_path.write_text(standard, encoding="utf-8")

          # Outside the ABI block STANDARD must remain byte-for-byte the official 4.7.2 shader.
          normalized_standard = block_pattern.sub("<PUSH_CONSTANT_ABI>", standard, count=1)
          normalized_official = block_pattern.sub("<PUSH_CONSTANT_ABI>", official, count=1)
          if normalized_standard != normalized_official:
              raise RuntimeError("STANDARD SSAO differs from official Godot 4.7.2 outside the ABI block")

          if standard_path.read_bytes() == custom_path.read_bytes():
              raise RuntimeError("STANDARD and Visibility Bitmask shaders unexpectedly became identical")
          PY

      - name: Register a separate generated shader and pipeline set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # If this Godot revision uses an explicit GLSL list, add the new file beside ssao.glsl.
          for scsub in Path("servers/rendering/renderer_rd/shaders").rglob("SCsub"):
              text = scsub.read_text(encoding="utf-8")
              if "ssao.glsl" not in text or "ssao_visibility_bitmask.glsl" in text:
                  continue
              quoted = re.search(r"(?P<quote>['\"])(?P<path>[^'\"]*ssao\.glsl)(?P=quote)", text)
              if quoted:
                  old_literal = quoted.group(0)
                  vb_path = quoted.group("path").replace("ssao.glsl", "ssao_visibility_bitmask.glsl")
                  new_literal = old_literal + ",\n\t" + quoted.group("quote") + vb_path + quoted.group("quote")
                  text = text[:quoted.start()] + new_literal + text[quoted.end():]
                  scsub.write_text(text, encoding="utf-8")
                  break

          header = Path("servers/rendering/renderer_rd/effects/ss_effects.h")
          text = header.read_text(encoding="utf-8")
          standard_include = '#include "servers/rendering/renderer_rd/shaders/effects/ssao.glsl.gen.h"'
          vb_include = '#include "servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl.gen.h"'
          if vb_include not in text:
              if standard_include not in text:
                  raise RuntimeError("The standard SSAO generated-header include was not found")
              text = text.replace(standard_include, standard_include + "\n" + vb_include, 1)

          if "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader;" not in text:
              fields = re.search(
                  r"(?P<indent>^[\t ]*)SsaoShaderRD gather_shader;\n(?P=indent)RID gather_shader_version;",
                  text,
                  flags=re.MULTILINE,
              )
              if fields is None:
                  raise RuntimeError("The SSAO gather shader fields were not found")
              indent = fields.group("indent")
              replacement = (
                  fields.group(0)
                  + "\n" + indent + "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader;"
                  + "\n" + indent + "RID visibility_bitmask_shader_version;"
                  + "\n" + indent + "PipelineDeferredRD visibility_bitmask_pipelines[SSAO_GATHER_ADAPTIVE + 1];"
              )
              text = text[:fields.start()] + replacement + text[fields.end():]
          header.write_text(text, encoding="utf-8")

          cpp = Path("servers/rendering/renderer_rd/effects/ss_effects.cpp")
          text = cpp.read_text(encoding="utf-8")

          if "ssao.visibility_bitmask_shader.initialize(ssao_modes);" not in text:
              initialization = text.index("ssao.gather_shader.initialize(ssao_modes);")
              loop = re.search(
                  r"(?P<indent>^[\t ]*)for \(int i = 0; i <= SSAO_GATHER_ADAPTIVE; i\+\+\) \{\n.*?\n(?P=indent)\}",
                  text[initialization:],
                  flags=re.MULTILINE | re.DOTALL,
              )
              if loop is None:
                  raise RuntimeError("The standard SSAO gather pipeline creation loop was not found")
              absolute_end = initialization + loop.end()
              indent = loop.group("indent")
              addition = (
                  "\n\n" + indent + "ssao.visibility_bitmask_shader.initialize(ssao_modes);"
                  + "\n" + indent + "ssao.visibility_bitmask_shader_version = ssao.visibility_bitmask_shader.version_create();"
                  + "\n" + indent + "for (int i = 0; i <= SSAO_GATHER_ADAPTIVE; i++) {"
                  + "\n" + indent + "\tssao.visibility_bitmask_pipelines[i].create_compute_pipeline(ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, i));"
                  + "\n" + indent + "}"
              )
              text = text[:absolute_end] + addition + text[absolute_end:]

          if "ssao.visibility_bitmask_shader.version_free(ssao.visibility_bitmask_shader_version);" not in text:
              free_call = re.search(
                  r"(?P<indent>^[\t ]*)ssao\.gather_shader\.version_free\(ssao\.gather_shader_version\);",
                  text,
                  flags=re.MULTILINE,
              )
              if free_call:
                  insertion = (
                      free_call.group(0)
                      + "\n" + free_call.group("indent")
                      + "ssao.visibility_bitmask_shader.version_free(ssao.visibility_bitmask_shader_version);"
                  )
                  text = text[:free_call.start()] + insertion + text[free_call.end():]

          function = re.search(
              r"void SSEffects::(?:generate_SSAO_shadows_internal|generate_ssao_shadows_internal)\s*\(",
              text,
          )
          if function is None:
              raise RuntimeError("The internal SSAO gather function was not found")
          fn_start = function.start()
          fn_brace = text.index("{", function.end())
          depth = 0
          fn_end = None
          for index in range(fn_brace, len(text)):
              if text[index] == "{":
                  depth += 1
              elif text[index] == "}":
                  depth -= 1
                  if depth == 0:
                      fn_end = index + 1
                      break
          if fn_end is None:
              raise RuntimeError("The internal SSAO gather function has unbalanced braces")
          fn = text[fn_start:fn_end]
          if "p_use_vb" not in fn:
              raise RuntimeError("The internal SSAO gather function no longer exposes p_use_vb")

          if "get_active_gather_shader" not in fn:
              shader_call = "ssao.gather_shader.version_get_shader(ssao.gather_shader_version,"
              shader_replacements = 0
              cursor = 0
              while True:
                  position = fn.find(shader_call, cursor)
                  if position < 0:
                      break
                  argument_start = position + len(shader_call)
                  nested = 0
                  argument_end = argument_start
                  while argument_end < len(fn):
                      character = fn[argument_end]
                      if character == "(":
                          nested += 1
                      elif character == ")":
                          if nested == 0:
                              break
                          nested -= 1
                      argument_end += 1
                  if argument_end >= len(fn):
                      raise RuntimeError("An SSAO gather shader lookup is unterminated")
                  argument = fn[argument_start:argument_end].strip()
                  replacement = f"get_active_gather_shader({argument})"
                  fn = fn[:position] + replacement + fn[argument_end + 1:]
                  cursor = position + len(replacement)
                  shader_replacements += 1

              fn, pipeline_replacements = re.subn(
                  r"ssao\.pipelines\[([^\]]+)\]\.get_rid\(\)",
                  r"get_active_gather_pipeline(\1)",
                  fn,
              )
              if shader_replacements == 0 or pipeline_replacements == 0:
                  raise RuntimeError(
                      f"Gather routing is incomplete: shader={shader_replacements}, pipeline={pipeline_replacements}"
                  )

              body_start = fn.index("{") + 1
              helpers = '''
\tauto get_active_gather_shader = [&](int p_mode) -> RID {
\t\treturn p_use_vb ? ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, p_mode) : ssao.gather_shader.version_get_shader(ssao.gather_shader_version, p_mode);
\t};
\tauto get_active_gather_pipeline = [&](int p_mode) -> RID {
\t\treturn p_use_vb ? ssao.visibility_bitmask_pipelines[p_mode].get_rid() : ssao.pipelines[p_mode].get_rid();
\t};
'''
              fn = fn[:body_start] + helpers + fn[body_start:]
              text = text[:fn_start] + fn + text[fn_end:]

          cpp.write_text(text, encoding="utf-8")

          # Source-level assertions catch a partial split before the compiler does.
          checks = {
              header: (
                  "ssao_visibility_bitmask.glsl.gen.h",
                  "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader",
                  "visibility_bitmask_pipelines",
              ),
              cpp: (
                  "visibility_bitmask_shader.initialize",
                  "get_active_gather_shader",
                  "get_active_gather_pipeline",
                  "p_use_vb ? ssao.visibility_bitmask_pipelines",
              ),
          }
          for path, needles in checks.items():
              content = path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in content:
                      raise RuntimeError(f"{path}: missing {needle}")
          PY

          git diff --check

      - name: Validate all SSAO gather shader variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 - <<'PY'
          from pathlib import Path

          sources = {
              "standard": Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl"),
              "visibility_bitmask": Path("servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl"),
          }
          variants = {
              "gather": "",
              "base": "#define SSAO_BASE\n",
              "adaptive": "#define ADAPTIVE\n",
          }
          for source_name, source_path in sources.items():
              original = source_path.read_text(encoding="utf-8")
              if "#[compute]" not in original:
                  raise RuntimeError(f"{source_path}: compute-stage marker missing")
              for variant_name, defines in variants.items():
                  text = original.replace("#[compute]\n", "", 1)
                  text = text.replace("#VERSION_DEFINES", defines, 1)
                  output = Path(f"/tmp/{source_name}_{variant_name}.comp")
                  output.write_text(text, encoding="utf-8")
          PY

          for shader in /tmp/standard_*.comp /tmp/visibility_bitmask_*.comp; do
            echo "Validating $shader"
            glslangValidator -V --target-env vulkan1.2 -S comp "$shader"
          done

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Remove inherited temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply_ssao_standard_split.yml
          rm -f .github/workflows/apply_ssao_standard_split_v2.yml
          rm -f .github/workflows/apply_ssao_standard_split_v3.yml
          rm -f .github/workflows/finalize_ssao_standard_split.yml

      - name: Record validation and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/build-status
          {
            echo "branch=fix/ssao-standard-final"
            echo "validated_by_run=${{ github.run_id }}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/build-status/ssao-standard-final.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore official 4.7.2 SSAO and isolate Visibility Bitmask"
          git push origin HEAD:fix/ssao-standard-final
