name: Apply robust renderer optimizations

on:
  workflow_dispatch:
  push:
    branches:
      - opt/renderer-depth-mesh-blend
    paths:
      - .github/workflows/apply_renderer_optimizations_robust.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: opt/renderer-depth-mesh-blend
          fetch-depth: 0

      - name: Apply idempotent renderer patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_contain(text: str, needle: str, path: Path) -> None:
              if needle not in text:
                  raise RuntimeError(f"{path}: required text is missing: {needle}")

          # 1) Shared linear-depth preparation: fix redundant/duplicate mip writers.
          p = Path("servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "still_alive = p_gtid.x % 8 == depth_array_offset.x && depth_array_offset.y % 8 == depth_array_offset.y;",
              "still_alive = p_gtid.x % 8 == depth_array_offset.x && p_gtid.y % 8 == depth_array_offset.y;",
          )
          text = text.replace(
              "still_alive = p_gtid.x % 16 == depth_array_offset.x && depth_array_offset.y % 16 == depth_array_offset.y;",
              "still_alive = p_gtid.x % 16 == depth_array_offset.x && p_gtid.y % 16 == depth_array_offset.y;",
          )
          must_contain(text, "p_gtid.y % 8 == depth_array_offset.y", p)
          must_contain(text, "p_gtid.y % 16 == depth_array_offset.y", p)

          # Add a shader variant that stops after two generated mips.
          if "GENERATE_TWO_MIPS" not in text:
              decl_pattern = re.compile(
                  r"(?P<d2>layout\(r16f, set = 2, binding = 1\) uniform restrict writeonly image2DArray dest_image2;\n)"
                  r"(?P<rest>layout\(r16f, set = 2, binding = 2\) uniform restrict writeonly image2DArray dest_image3;\n"
                  r"#ifdef GENERATE_FULL_MIPS\n"
                  r"layout\(r16f, set = 2, binding = 3\) uniform restrict writeonly image2DArray dest_image4;\n"
                  r"#endif)"
              )
              text, count = decl_pattern.subn(
                  r"\g<d2>#ifndef GENERATE_TWO_MIPS\n\g<rest>\n#endif",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Could not wrap the third/fourth depth-mip image declarations")

              marker = "\tstill_alive = p_gtid.x % 8 == depth_array_offset.x && p_gtid.y % 8 == depth_array_offset.y;"
              if text.count(marker) != 1:
                  raise RuntimeError("Could not identify the third depth-mip stage")
              text = text.replace(marker, "#ifndef GENERATE_TWO_MIPS\n" + marker, 1)

              start = text.index("#ifndef GENERATE_TWO_MIPS\n" + marker)
              end_marker = "\n}\n#else\n#ifndef USE_HALF_BUFFERS"
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError("Could not identify the end of prepare_depths_and_mips()")
              text = text[:end] + "\n#endif // !GENERATE_TWO_MIPS" + text[end:]

          p.write_text(text, encoding="utf-8")

          # 2) Mesh Blend depth is sampled, not used as a storage image.
          p = Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "layout(r32f, set = 0, binding = 4) uniform readonly image2D mesh_depth;",
              "layout(set = 0, binding = 4) uniform sampler2D mesh_depth;",
          )
          text = text.replace(
              "float depth_value = imageLoad(mesh_depth, sample_pixel).x;",
              "float depth_value = texelFetch(mesh_depth, sample_pixel, 0).x;",
          )
          must_contain(text, "uniform sampler2D mesh_depth;", p)
          must_contain(text, "texelFetch(mesh_depth, sample_pixel, 0).x", p)
          p.write_text(text, encoding="utf-8")

          p = Path("servers/rendering/renderer_rd/effects/mesh_blend.cpp")
          whole = p.read_text(encoding="utf-8")
          start = whole.index("void MeshBlend::generate_mask(")
          end = whole.index("void MeshBlend::jump_flood(", start)
          fn = whole[start:end]
          if "MaterialStorage *material_storage" not in fn:
              fn, count = re.subn(
                  r"(\tUniformSetCacheRD \*uniform_cache = UniformSetCacheRD::get_singleton\(\);\n\tERR_FAIL_NULL\(uniform_cache\);\n)",
                  r"\1\tMaterialStorage *material_storage = MaterialStorage::get_singleton();\n\tERR_FAIL_NULL(material_storage);\n\tRID sampler_nearest = material_storage->sampler_rd_get_default(RSE::CANVAS_ITEM_TEXTURE_FILTER_NEAREST, RSE::CANVAS_ITEM_TEXTURE_REPEAT_DISABLED);\n",
                  fn,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Could not add the nearest depth sampler to generate_mask()")
          fn = fn.replace(
              "RD::Uniform u_depth(RD::UNIFORM_TYPE_IMAGE, 4, Vector<RID>({ p_vb_depth }));",
              "RD::Uniform u_depth(RD::UNIFORM_TYPE_SAMPLER_WITH_TEXTURE, 4, Vector<RID>({ sampler_nearest, p_vb_depth }));",
          )
          must_contain(fn, "RD::UNIFORM_TYPE_SAMPLER_WITH_TEXTURE, 4", p)
          whole = whole[:start] + fn + whole[end:]
          p.write_text(whole, encoding="utf-8")

          # The main depth attachment can be reused without MSAA now that Mesh Blend does not
          # require STORAGE usage. The existing MSAA guard keeps its dedicated attachment.
          p = Path("servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp")
          text = p.read_text(encoding="utf-8")
          text, removed = re.subn(
              r"\n\tif \((?:RendererSceneRenderRD::get_singleton\(\)->is_mesh_blend_enabled\(\)|_mesh_blend_enabled\(\))\) \{\n"
              r"\t\tuse_main_depth_for_vb = false;[^\n]*Mesh blend needs STORAGE usage on depth[^\n]*\n"
              r"\t\}\n",
              "\n",
              text,
              count=1,
          )
          if removed == 0 and "Mesh blend needs STORAGE usage on depth" in text:
              raise RuntimeError("Mesh Blend main-depth override exists but did not match safely")
          p.write_text(text, encoding="utf-8")

          # 3) Register and select the exact two-mip variant.
          p = Path("servers/rendering/renderer_rd/effects/ss_effects.h")
          text = p.read_text(encoding="utf-8")
          if "SS_EFFECTS_DOWNSAMPLE_TWO_MIPS" not in text:
              text, count = re.subn(
                  r"(?P<indent>\s*)SS_EFFECTS_MAX",
                  r"\g<indent>SS_EFFECTS_DOWNSAMPLE_TWO_MIPS,\g<indent>SS_EFFECTS_MAX",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Could not extend SSEffectsMode")
          p.write_text(text, encoding="utf-8")

          p = Path("servers/rendering/renderer_rd/effects/ss_effects.cpp")
          text = p.read_text(encoding="utf-8")
          if "#define GENERATE_TWO_MIPS" not in text:
              pattern = re.compile(
                  r'(?P<indent>\s*)downsampler_modes\.push_back\("\\n#define GENERATE_MIPS\\n#define GENERATE_FULL_MIPS"\);'
              )
              match = pattern.search(text)
              if not match:
                  raise RuntimeError("Could not find the full-mips shader variant registration")
              addition = match.group(0) + match.group("indent") + 'downsampler_modes.push_back("\\n#define GENERATE_MIPS\\n#define GENERATE_TWO_MIPS\\n");'
              text = text[:match.start()] + addition + text[match.end():]

          if "bool use_two_mips" not in text:
              text, count = re.subn(
                  r"(\tbool use_full_mips = false;)",
                  r"\1\n\tbool use_two_mips = false;",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Could not add use_two_mips state")

          todo_pattern = re.compile(
              r"\t\t} else \{\n"
              r"\t\t\t// Only need the first two mipmaps[^\n]*\n"
              r"\t\t\t// TODO investigate the benefit of a shader version to generate only 2 mips\n"
              r"\t\t\tdownsample_mode = SS_EFFECTS_DOWNSAMPLE_MIPMAP;\n"
              r"\t\t\tuse_mips = true;\n"
              r"\t\t}\n"
              r"\t}"
          )
          replacement = (
              "\t\t} else {\n"
              "\t\t\tdownsample_mode = SS_EFFECTS_DOWNSAMPLE_TWO_MIPS;\n"
              "\t\t\tuse_mips = true;\n"
              "\t\t\tuse_two_mips = true;\n"
              "\t\t}\n"
              "\t}"
          )
          text, count = todo_pattern.subn(replacement, text, count=1)
          if count == 0 and "TODO investigate the benefit of a shader version to generate only 2 mips" in text:
              raise RuntimeError("The mixed half-size path could not be changed safely")
          must_contain(text, "downsample_mode = SS_EFFECTS_DOWNSAMPLE_TWO_MIPS;", p)

          old_loop = "for (int i = 0; i < (use_full_mips ? 4 : 3); i++) {"
          if old_loop in text:
              text = text.replace(
                  old_loop,
                  "const int generated_mip_count = use_full_mips ? 4 : (use_two_mips ? 2 : 3);\n\t\tfor (int i = 0; i < generated_mip_count; i++) {",
                  1,
              )
          must_contain(text, "generated_mip_count", p)
          p.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Clean temporary patch workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply_renderer_optimizations.yml
          rm -f .github/workflows/apply_renderer_optimizations_stage2.yml
          rm -f .github/workflows/apply_renderer_optimizations_stage3.yml
          rm -f .github/workflows/apply_renderer_optimizations_robust.yml

      - name: Commit compiled changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Optimize shared depth preparation and Mesh Blend depth reuse"
          git push origin HEAD:opt/renderer-depth-mesh-blend
