name: Restore official SSAO with fork ABI v3

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ssao-standard-4.7.2
    paths:
      - .github/workflows/apply_ssao_standard_split_v3.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ssao-standard-4.7.2
          fetch-depth: 0

      - name: Restore algorithm while preserving shader interface ABI
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM=servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl
          STANDARD=servers/rendering/renderer_rd/shaders/effects/ssao.glsl
          if [ ! -f "$CUSTOM" ]; then
            cp "$STANDARD" "$CUSTOM"
          fi
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
            -o "$STANDARD.official"

          python3 - <<'PY'
          from pathlib import Path
          import re

          custom_path = Path("servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl")
          official_path = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl.official")
          output_path = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl")

          custom = custom_path.read_text(encoding="utf-8")
          official = official_path.read_text(encoding="utf-8")
          block_re = re.compile(
              r"layout\(push_constant, std430\) uniform Params\s*\{.*?\}\s*params;",
              flags=re.DOTALL,
          )
          custom_match = block_re.search(custom)
          official_match = block_re.search(official)
          if not custom_match or not official_match:
              raise RuntimeError("Could not locate SSAO push-constant blocks")

          custom_block = custom_match.group(0)
          official_block = official_match.group(0)
          # The custom block is the engine-side ABI source of truth. It contains the
          # standard fields plus fork-specific algorithm flags.
          standard = official[:official_match.start()] + custom_block + official[official_match.end():]
          output_path.write_text(standard, encoding="utf-8")
          official_path.unlink()

          if "flags" not in custom_block:
              raise RuntimeError("Fork SSAO push constants no longer expose algorithm flags")
          if custom_block == official_block:
              print("Official and fork push-constant layouts already match.")
          PY

      - name: Add separate VB shader objects and route gather calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def find_function(text: str) -> tuple[int, int, str]:
              match = re.search(
                  r"void SSEffects::(?:generate_SSAO_shadows_internal|generate_ssao_shadows_internal)\s*\(",
                  text,
              )
              if not match:
                  raise RuntimeError("Internal SSAO gather function not found")
              start = match.start()
              brace = text.index("{", match.end())
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1, text[start:i + 1]
              raise RuntimeError("Unbalanced SSAO gather function")

          header = Path("servers/rendering/renderer_rd/effects/ss_effects.h")
          h = header.read_text(encoding="utf-8")
          std_inc = '#include "servers/rendering/renderer_rd/shaders/effects/ssao.glsl.gen.h"'
          vb_inc = '#include "servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl.gen.h"'
          if vb_inc not in h:
              if std_inc not in h:
                  raise RuntimeError("Standard SSAO include missing")
              h = h.replace(std_inc, std_inc + "\n" + vb_inc, 1)
          if "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader;" not in h:
              match = re.search(
                  r"(?P<indent>^[\t ]*)SsaoShaderRD gather_shader;\n(?P=indent)RID gather_shader_version;",
                  h,
                  flags=re.MULTILINE,
              )
              if not match:
                  raise RuntimeError("SSAO shader fields missing")
              indent = match.group("indent")
              replacement = (
                  match.group(0)
                  + "\n" + indent + "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader;"
                  + "\n" + indent + "RID visibility_bitmask_shader_version;"
                  + "\n" + indent + "PipelineDeferredRD visibility_bitmask_pipelines[SSAO_GATHER_ADAPTIVE + 1];"
              )
              h = h[:match.start()] + replacement + h[match.end():]
          header.write_text(h, encoding="utf-8")

          cpp = Path("servers/rendering/renderer_rd/effects/ss_effects.cpp")
          c = cpp.read_text(encoding="utf-8")
          if "visibility_bitmask_shader.initialize(ssao_modes);" not in c:
              anchor = c.index("ssao.gather_shader.initialize(ssao_modes);")
              loop = re.search(
                  r"(?P<indent>^[\t ]*)for \(int i = 0; i <= SSAO_GATHER_ADAPTIVE; i\+\+\) \{\n.*?\n(?P=indent)\}",
                  c[anchor:],
                  flags=re.MULTILINE | re.DOTALL,
              )
              if not loop:
                  raise RuntimeError("SSAO gather pipeline creation loop missing")
              end = anchor + loop.end()
              indent = loop.group("indent")
              addition = (
                  "\n\n" + indent + "ssao.visibility_bitmask_shader.initialize(ssao_modes);"
                  "\n" + indent + "ssao.visibility_bitmask_shader_version = ssao.visibility_bitmask_shader.version_create();"
                  "\n" + indent + "for (int i = 0; i <= SSAO_GATHER_ADAPTIVE; i++) {"
                  "\n" + indent + "\tssao.visibility_bitmask_pipelines[i].create_compute_pipeline(ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, i));"
                  "\n" + indent + "}"
              )
              c = c[:end] + addition + c[end:]

          if "visibility_bitmask_shader.version_free" not in c:
              free_match = re.search(
                  r"(?P<indent>^[\t ]*)ssao\.gather_shader\.version_free\(ssao\.gather_shader_version\);",
                  c,
                  flags=re.MULTILINE,
              )
              if free_match:
                  insertion = free_match.group(0) + "\n" + free_match.group("indent") + "ssao.visibility_bitmask_shader.version_free(ssao.visibility_bitmask_shader_version);"
                  c = c[:free_match.start()] + insertion + c[free_match.end():]

          fn_start, fn_end, fn = find_function(c)
          if "p_use_vb" not in fn:
              raise RuntimeError("p_use_vb missing from gather function")

          if "get_active_gather_shader" not in fn:
              shader_needle = "ssao.gather_shader.version_get_shader(ssao.gather_shader_version,"
              replacements = 0
              cursor = 0
              while True:
                  pos = fn.find(shader_needle, cursor)
                  if pos < 0:
                      break
                  arg_start = pos + len(shader_needle)
                  nested = 0
                  end = arg_start
                  while end < len(fn):
                      ch = fn[end]
                      if ch == "(":
                          nested += 1
                      elif ch == ")":
                          if nested == 0:
                              break
                          nested -= 1
                      end += 1
                  if end >= len(fn):
                      raise RuntimeError("Unterminated gather shader call")
                  arg = fn[arg_start:end].strip()
                  repl = f"get_active_gather_shader({arg})"
                  fn = fn[:pos] + repl + fn[end + 1:]
                  cursor = pos + len(repl)
                  replacements += 1

              fn, pipeline_replacements = re.subn(
                  r"ssao\.pipelines\[([^\]]+)\]\.get_rid\(\)",
                  r"get_active_gather_pipeline(\1)",
                  fn,
              )
              if replacements == 0 or pipeline_replacements == 0:
                  raise RuntimeError(f"Gather routing incomplete: {replacements}, {pipeline_replacements}")

              body = fn.index("{") + 1
              helpers = '''
\tauto get_active_gather_shader = [&](int p_mode) -> RID {
\t\treturn p_use_vb ? ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, p_mode) : ssao.gather_shader.version_get_shader(ssao.gather_shader_version, p_mode);
\t};
\tauto get_active_gather_pipeline = [&](int p_mode) -> RID {
\t\treturn p_use_vb ? ssao.visibility_bitmask_pipelines[p_mode].get_rid() : ssao.pipelines[p_mode].get_rid();
\t};
'''
              fn = fn[:body] + helpers + fn[body:]
              c = c[:fn_start] + fn + c[fn_end:]

          cpp.write_text(c, encoding="utf-8")
          PY
          git diff --check

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply_ssao_standard_split.yml
          rm -f .github/workflows/apply_ssao_standard_split_v2.yml
          rm -f .github/workflows/apply_ssao_standard_split_v3.yml

      - name: Commit compiled SSAO split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore official 4.7.2 SSAO and isolate visibility-bitmask gather"
          git push origin HEAD:fix/ssao-standard-4.7.2
