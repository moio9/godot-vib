name: Apply SSAO standard and VB shader separation

on:
  pull_request:
    branches:
      - "4.7"
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/4.7.2-ssao-standard-vb' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore official Standard SSAO and isolate Visibility Bitmask
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
            -o /tmp/ssao-official-4.7.2.glsl

          python3 - <<'PY'
          from pathlib import Path
          import re

          shader_path = Path('servers/rendering/renderer_rd/shaders/effects/ssao.glsl')
          current = shader_path.read_text(encoding='utf-8')
          official = Path('/tmp/ssao-official-4.7.2.glsl').read_text(encoding='utf-8')

          header_re = re.compile(
              r'^.*?#\[compute\]\s*\n\s*#version\s+450\s*\n\s*#VERSION_DEFINES\s*\n',
              re.DOTALL,
          )
          current_header = header_re.match(current)
          official_header = header_re.match(official)
          if not current_header or not official_header:
              raise RuntimeError('Unable to isolate SSAO generated-shader headers')

          pc_re = re.compile(
              r'layout\s*\(\s*push_constant\s*,\s*std430\s*\)\s*uniform\s+Params\s*\{.*?\}\s*params\s*;',
              re.DOTALL,
          )
          current_pc = pc_re.search(current)
          official_pc = pc_re.search(official)
          if not current_pc or not official_pc:
              raise RuntimeError('Unable to locate SSAO push constant blocks')

          # The fork appended mode flags to the official push constants. Keep
          # that ABI for both shader variants while restoring official ASSAO.
          official = official[:official_pc.start()] + current_pc.group(0) + official[official_pc.end():]

          field_names = set(
              re.findall(
                  r'\b(?:float|int|uint|bool|vec[234]|ivec[234]|uvec[234]|mat[234])\s+([A-Za-z_][A-Za-z0-9_]*)',
                  current_pc.group(0),
              )
          )
          used_official = set(re.findall(r'\bparams\.([A-Za-z_][A-Za-z0-9_]*)', official))
          missing = sorted(used_official - field_names)
          if missing:
              raise RuntimeError('Fork push constants are missing official fields: ' + ', '.join(missing))

          standard_body = official[header_re.match(official).end():]
          vb_body = current[current_header.end():]

          standard_inc = Path('servers/rendering/renderer_rd/shaders/effects/ssao_standard_inc.glsl')
          vb_inc = Path('servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask_inc.glsl')
          standard_inc.write_text(
              '// Official Godot 4.7.2 ASSAO implementation. Included by ssao.glsl.\n' + standard_body,
              encoding='utf-8',
          )
          vb_inc.write_text(
              '// Fork Visibility Bitmask implementation. Included by ssao.glsl.\n' + vb_body,
              encoding='utf-8',
          )

          shader_path.write_text(
              '#[compute]\n\n'
              '#version 450\n\n'
              '#VERSION_DEFINES\n\n'
              '#ifdef USE_VISIBILITY_BITMASK\n'
              '#include "ssao_visibility_bitmask_inc.glsl"\n'
              '#else\n'
              '#include "ssao_standard_inc.glsl"\n'
              '#endif\n',
              encoding='utf-8',
          )

          header_path = Path('servers/rendering/renderer_rd/effects/ss_effects.h')
          header = header_path.read_text(encoding='utf-8')
          enum_re = re.compile(
              r'enum\s+SSAOMode\s*\{(?P<body>.*?)\n\s*\};',
              re.DOTALL,
          )
          enum_match = enum_re.search(header)
          if not enum_match:
              raise RuntimeError('SSAOMode enum not found')
          body = enum_match.group('body')
          if 'SSAO_GATHER_VB' not in body:
              needle = 'SSAO_GATHER_ADAPTIVE,'
              if body.count(needle) != 1:
                  raise RuntimeError('Unexpected SSAO_GATHER_ADAPTIVE enum layout')
              body = body.replace(
                  needle,
                  needle + '\n\t\tSSAO_GATHER_VB,\n\t\tSSAO_GATHER_BASE_VB,\n\t\tSSAO_GATHER_ADAPTIVE_VB,',
                  1,
              )
              header = header[:enum_match.start('body')] + body + header[enum_match.end('body'):]
              header_path.write_text(header, encoding='utf-8')

          cpp_path = Path('servers/rendering/renderer_rd/effects/ss_effects.cpp')
          cpp = cpp_path.read_text(encoding='utf-8')

          modes_block = (
              '\t\t\tssao_modes.push_back("\\n");\n'
              '\t\t\tssao_modes.push_back("\\n#define SSAO_BASE\\n");\n'
              '\t\t\tssao_modes.push_back("\\n#define ADAPTIVE\\n");\n'
          )
          if '#define USE_VISIBILITY_BITMASK' not in cpp:
              if cpp.count(modes_block) != 1:
                  raise RuntimeError('Unable to locate SSAO gather mode list')
              extended = modes_block + (
                  '\t\t\tssao_modes.push_back("\\n#define USE_VISIBILITY_BITMASK\\n");\n'
                  '\t\t\tssao_modes.push_back("\\n#define SSAO_BASE\\n#define USE_VISIBILITY_BITMASK\\n");\n'
                  '\t\t\tssao_modes.push_back("\\n#define ADAPTIVE\\n#define USE_VISIBILITY_BITMASK\\n");\n'
              )
              cpp = cpp.replace(modes_block, extended, 1)

          old_loop = 'for (int i = 0; i <= SSAO_GATHER_ADAPTIVE; i++) {'
          new_loop = 'for (int i = 0; i <= SSAO_GATHER_ADAPTIVE_VB; i++) {'
          if old_loop in cpp:
              if cpp.count(old_loop) != 1:
                  raise RuntimeError('Unexpected duplicate SSAO gather initialization loops')
              cpp = cpp.replace(old_loop, new_loop, 1)
          elif new_loop not in cpp:
              raise RuntimeError('SSAO gather initialization loop not found')

          fn_start = cpp.find('void SSEffects::generate_ssao(')
          if fn_start < 0:
              raise RuntimeError('SSEffects::generate_ssao not found')
          brace = cpp.find('{', fn_start)
          depth = 0
          fn_end = None
          for i in range(brace, len(cpp)):
              if cpp[i] == '{':
                  depth += 1
              elif cpp[i] == '}':
                  depth -= 1
                  if depth == 0:
                      fn_end = i + 1
                      break
          if fn_end is None:
              raise RuntimeError('SSEffects::generate_ssao is unterminated')
          function = cpp[fn_start:fn_end]

          helper = (
              '\n\tconst int gather_mode_offset = p_settings.vb_mode != 0 ? '
              '(SSAO_GATHER_VB - SSAO_GATHER) : 0;\n'
          )
          if 'const int gather_mode_offset =' not in function:
              insert = function.find('\n', function.find('{')) + 1
              function = function[:insert] + helper + function[insert:]

          for mode in ('SSAO_GATHER_ADAPTIVE', 'SSAO_GATHER_BASE', 'SSAO_GATHER'):
              # Avoid modifying enum names that already carry the _VB suffix.
              function = re.sub(
                  rf'ssao\.pipelines\[{mode}\](?!\s*\+)',
                  f'ssao.pipelines[{mode} + gather_mode_offset]',
                  function,
              )
              function = re.sub(
                  rf'(version_get_shader\(ssao\.gather_shader_version,\s*){mode}(\s*\))',
                  rf'\1{mode} + gather_mode_offset\2',
                  function,
              )

          cpp = cpp[:fn_start] + function + cpp[fn_end:]
          cpp_path.write_text(cpp, encoding='utf-8')

          Path('.github/workflows/pr_apply_ssao_standard_vb_split.yml').unlink()
          PY

          git diff --check
          grep -n 'USE_VISIBILITY_BITMASK' servers/rendering/renderer_rd/shaders/effects/ssao.glsl
          grep -n 'SSAO_GATHER_VB' servers/rendering/renderer_rd/effects/ss_effects.h
          grep -n 'SSAO_GATHER_ADAPTIVE_VB' servers/rendering/renderer_rd/effects/ss_effects.cpp
          grep -n 'gather_mode_offset' servers/rendering/renderer_rd/effects/ss_effects.cpp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore official 4.7.2 Standard SSAO and isolate VB shader'
          git push origin HEAD
