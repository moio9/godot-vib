name: Fix VB normal angle

on:
  push:
    branches:
      - "renderer-batch2-stable"
    paths:
      - ".github/workflows/fix_vb_normal_angle.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: renderer-batch2-stable
          fetch-depth: 1
      - name: Correct projected-normal orientation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl")
          s = p.read_text(encoding="utf-8")
          old = "float normal_angle = -sign(dot(projected_normal, tangent)) * acos(cos_n);"
          new = "float normal_angle = sign(dot(projected_normal, tangent)) * acos(cos_n);"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          assert "front_back_horizon = clamp(((-p_sampling_direction * front_back_horizon) - p_normal_angle + VB_HALF_PI) / VB_PI" in s
          p.write_text(s, encoding="utf-8")
          PY
          rm .github/workflows/fix_vb_normal_angle.yml
          git diff --check
      - name: Commit correction
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers/rendering/renderer_rd/shaders/effects/ssao.glsl .github/workflows/fix_vb_normal_angle.yml
          git commit -m "Fix Visibility Bitmask normal-angle orientation"
          git push origin HEAD:renderer-batch2-stable
