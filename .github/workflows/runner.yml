name: 🔗 GHA
on: [push, workflow_dispatch]

permissions:
  contents: write

concurrency:
  group: repair-transparent-mesh-blend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  repair-transparent-mesh-blend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/opt/renderer-batch2'
    name: Repair transparent Mesh Blend source
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout renderer branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-batch2
          fetch-depth: 2

      - name: Patch and push renderer source
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp")
          source = source_path.read_text(encoding="utf-8")
          old_initializer = "blend_state_color_blend.attachments = { blend_attachment, RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment() };"
          new_initializer = "blend_state_color_blend.attachments = { blend_attachment, RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment() };"

          if source.count(new_initializer) == 1 and source.count(old_initializer) == 0:
              print("Transparent Mesh Blend source is already repaired.")
          elif source.count(old_initializer) == 1 and source.count(new_initializer) == 0:
              source_path.write_text(source.replace(old_initializer, new_initializer, 1), encoding="utf-8")
          else:
              raise SystemExit("Unexpected transparent blend-state source layout")
          PY

          git diff --check
          if git diff --quiet -- servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp
          git commit -m "Fix transparent Mesh Blend pipeline attachment count"
          git push origin HEAD:opt/renderer-batch2