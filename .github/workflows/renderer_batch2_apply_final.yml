name: Apply final renderer optimization batch

on:
  pull_request:
    branches:
      - "4.7"
    paths:
      - ".github/workflows/renderer_batch2_apply_final.yml"
      - ".github/scripts/apply_renderer_batch2.py"
      - ".github/scripts/prepare_renderer_batch2_driver.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-batch2-apply
  cancel-in-progress: true

jobs:
  apply-source-batch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-slim
    timeout-minutes: 60

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1

      - name: Fetch validated patch branches
        shell: bash
        run: |
          set -euxo pipefail
          branches=(
            opt/renderer-depth-final
            opt/mesh-blend-mask-bandwidth
            opt/mesh-blend-compact-visibility-attachment
            opt/mesh-blend-rg16-edges
            opt/mesh-blend-packed-mask
            opt/mesh-blend-packed-vb-aux
            opt/mesh-blend-reuse-vb-aux-mask
            opt/mesh-blend-main-pass-metadata
          )
          for branch in "${branches[@]}"; do
            git fetch --depth=1 origin \
              "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          done

      - name: Prepare Godot 4.7.2 patch compatibility
        run: python3 .github/scripts/prepare_renderer_batch2_driver.py

      - name: Persist main-pass C++ and remove legacy verification
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_renderer_batch2.py")
          text = path.read_text(encoding="utf-8")

          branch_marker = '    if branch == "opt/mesh-blend-main-pass-metadata":\n'
          persistence = (
              '        persistence_marker = "# Final C++ source invariants."\n'
              '        if persistence_marker not in body:\n'
              '            raise RuntimeError("Main-pass C++ invariant marker was not found")\n'
              '        body = body.replace(\n'
              '            persistence_marker,\n'
              '            \'cpp.write_text(text, encoding="utf-8")\\n\\n\' + persistence_marker,\n'
              '            1,\n'
              '        )\n'
          )
          if 'persistence_marker = "# Final C++ source invariants."' not in text:
              if branch_marker not in text:
                  raise RuntimeError("Main-pass compatibility branch was not found")
              text = text.replace(branch_marker, branch_marker + persistence, 1)

          legacy_stage = '        "Verify optimized source invariants",\n'
          if legacy_stage in text:
              text = text.replace(legacy_stage, "", 1)

          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile .github/scripts/apply_renderer_batch2.py

      - name: Apply renderer, Mesh Blend and MSAA source optimizations
        run: python3 .github/scripts/apply_renderer_batch2.py

      - name: Verify final renderer source structurally
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path(".")

          def read(path: str) -> str:
              file = root / path
              if not file.exists():
                  raise RuntimeError(f"Required source file is missing: {path}")
              return file.read_text(encoding="utf-8")

          def require_all(label: str, text: str, values: tuple[str, ...]) -> None:
              missing = [value for value in values if value not in text]
              if missing:
                  raise RuntimeError(f"{label} is incomplete; missing: {', '.join(missing)}")

          def require_any(label: str, text: str, values: tuple[str, ...]) -> None:
              if not any(value in text for value in values):
                  raise RuntimeError(f"{label} is missing every accepted marker: {', '.join(values)}")

          depth = read("servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl")
          require_all(
              "Shared screen-space depth reduction",
              depth,
              (
                  "p_gtid.y % 8 == depth_array_offset.y",
                  "p_gtid.y % 16 == depth_array_offset.y",
              ),
          )

          shader_types = read("servers/rendering/shader_types.cpp")
          require_all(
              "Per-pixel GDSHADER Mesh Blend API",
              shader_types,
              ("MESH_BLEND", "MESH_BLEND_GROUP"),
          )

          scene_shader = read(
              "servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl"
          )
          require_any(
              "Per-pixel Mesh Blend output",
              scene_shader,
              (
                  "MESH_BLEND_OUTPUT_USED",
                  "mesh_blend_output",
                  "MESH_BLEND_GROUP_OUTPUT_USED",
              ),
          )
          require_any(
              "Opaque-pass packed Mesh Blend metadata",
              scene_shader,
              (
                  "frag_mesh_blend_aux",
                  "pack_mesh_blend_aux",
                  "MESH_BLEND_MAIN_PASS_OUTPUT",
              ),
          )

          render_cpp = read(
              "servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp"
          )
          require_all(
              "Forward+ Mesh Blend main/fallback paths",
              render_cpp,
              (
                  "COLOR_PASS_FLAG_MESH_BLEND",
                  "const bool mesh_blend_main_pass = _mesh_blend_enabled()",
                  "RSE::VIEWPORT_MSAA_DISABLED",
                  "ensure_visibility_textures(false, true, false)",
                  "mesh_blend_requires_visibility_pass",
              ),
          )
          packed_attachments = "color, specular, velocity_buffer, mesh_blend_aux, depth"
          if render_cpp.count(packed_attachments) < 2:
              raise RuntimeError(
                  "Mesh Blend AUX is not attached to both Forward+ framebuffer variants"
              )

          buffers = read(
              "servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp"
          )
          aux_match = re.search(
              r"RB_TEX_VB_AUX.*?(?:RD|RenderingDevice)::DATA_FORMAT_R16_UINT",
              buffers,
              flags=re.DOTALL,
          )
          if aux_match is None:
              raise RuntimeError("VB_AUX is not allocated as packed R16_UINT")
          if "TEXTURE_USAGE_SAMPLING_BIT" not in buffers:
              raise RuntimeError("VB_AUX is not sampleable by the final blend pass")

          mask_shader = read(
              "servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl"
          )
          require_all(
              "Packed VB_AUX Mesh Blend edge input",
              mask_shader,
              (
                  "layout(r16ui",
                  "uimage2D vb_aux",
                  "unpack_visibility_aux",
                  "uimage2D mesh_edges",
              ),
          )
          if "mesh_mask" in mask_shader:
              raise RuntimeError(
                  "The duplicate full-resolution Mesh Blend mask still exists"
              )
          if "vb_vis" in mask_shader:
              raise RuntimeError(
                  "Mesh Blend edge detection still reads the full Visibility ID buffer"
              )

          jump_shader = read(
              "servers/rendering/renderer_rd/shaders/effects/mesh_blend_jump_flood.glsl"
          )
          if "layout(rg16ui" not in jump_shader:
              raise RuntimeError("Jump-flood coordinates are not packed as RG16_UINT")

          renderer_scene = read("servers/rendering/renderer_rd/renderer_scene_render_rd.cpp")
          require_all(
              "Radius-bounded Mesh Blend jump flood",
              renderer_scene,
              (
                  "while (spread < int(edge_radius_pixels))",
                  "while (spread >= 1)",
              ),
          )
          if "MAX(size.x, size.y)" in renderer_scene or "MAX(size.width, size.height)" in renderer_scene:
              raise RuntimeError("A full-screen Mesh Blend jump-flood spread remains")

          source_blob = "\n".join(
              (
                  render_cpp,
                  buffers,
                  read("servers/rendering/renderer_rd/renderer_scene_render_rd.h"),
              )
          )
          forbidden = ("RB_TEX_MESH_BLEND_MASK", "USE_VISBUFFER_FOR_MESH_BLEND")
          present = [value for value in forbidden if value in source_blob]
          if present:
              raise RuntimeError(
                  "Deprecated Mesh Blend allocations/flags remain: " + ", ".join(present)
              )

          subprocess.run(["git", "diff", "--check"], check=True)
          print("Renderer source invariants passed.")
          PY

      - name: Commit consolidated source result
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/renderer_batch2_apply.yml
          rm -f .github/workflows/renderer_batch2_apply_v2.yml
          rm -f .github/workflows/renderer_batch2_apply_v3.yml
          rm -f .github/workflows/renderer_batch2_apply_final.yml
          rm -f .github/workflows/renderer_batch2_validation_repair.yml
          rm -f .github/scripts/apply_renderer_batch2.py
          rm -f .github/scripts/prepare_renderer_batch2_driver.py
          rm -f .github/scripts/fix_renderer_batch2_main_pass_cpp.py
          rm -f .github/scripts/fix_renderer_batch2_main_pass_adapter.py

          mkdir -p .github/build-status
          {
            echo "branch=opt/renderer-batch2"
            echo "source_patches=applied"
            echo "applied_by_run=${{ github.run_id }}"
            echo "applied_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "linux_compile=pending"
            echo "termux_compile=pending"
            echo "msaa_runtime_validation=pending"
          } > .github/build-status/renderer-batch2-source.txt

          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
              echo "::error::No renderer source changes were produced"
              exit 1
          fi

          git commit -m "Apply renderer, Mesh Blend and MSAA optimizations"
          git push origin HEAD:opt/renderer-batch2
