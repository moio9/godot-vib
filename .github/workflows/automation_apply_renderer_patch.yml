name: Format renderer optimization branch

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: >-
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/renderer-optimizations'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout trusted renderer branch
        uses: actions/checkout@v7
        with:
          ref: work/renderer-optimizations
          fetch-depth: 0

      - name: Apply Godot formatters
        continue-on-error: true
        uses: j178/prek-action@v2
        with:
          extra-args: >-
            --files
            servers/rendering/renderer_rd/effects/mesh_blend.cpp
            servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp
            servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp
            servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl
            servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl
            servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl

      - name: Validate formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp|\
              servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl|\
              servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl)
                ;;
              *)
                echo "Formatter changed unexpected file: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Commit formatter changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Renderer files are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp \
            servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl \
            servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          git commit -m "Format renderer optimization sources"
          git push origin HEAD:work/renderer-optimizations
