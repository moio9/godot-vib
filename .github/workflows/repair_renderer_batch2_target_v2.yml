name: Trusted renderer batch repair v2

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: trusted-renderer-batch-repair-v2
  cancel-in-progress: true

jobs:
  repair-renderer-branch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'opt/renderer-batch2')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout renderer optimization branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1

      - name: Repair malformed Visibility allocator API
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h")
          text = header.read_text(encoding="utf-8")
          bad = "bool ensure_visibility_textures(true, bool p_need_aux = true, bool p_need_depth = true);"
          good = "bool ensure_visibility_textures(bool p_need_full_visibility = true, bool p_need_aux = true, bool p_need_depth = true);"
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good not in text:
              raise RuntimeError("Unknown ensure_visibility_textures declaration")
          text = text.replace(
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // RG16F',
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // R16_UINT: packed group and strength',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R32G32_UINT: edge coords',
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R16G16_UINT: edge coords',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R32G32_UINT: ping/pong',
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R16G16_UINT: ping/pong',
              1,
          )
          header.write_text(text, encoding="utf-8")

          source = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp")
          text = source.read_text(encoding="utf-8")
          old = "\treturn has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_VIS) && (p_need_depth ? has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH) : true);"
          new = """\tconst bool visibility_ready = has_texture(RB_SCOPE_BUFFERS, p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT);
\tconst bool aux_ready = !p_need_aux || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_AUX);
\tconst bool depth_ready = !p_need_depth || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH);
\treturn visibility_ready && aux_ready && depth_ready;"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError("Unknown ensure_visibility_textures result")
          source.write_text(text, encoding="utf-8")
          PY

          ! grep -R -n 'ensure_visibility_textures(true,' servers/rendering
          grep -q 'bool ensure_visibility_textures(bool p_need_full_visibility = true' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h
          grep -q 'p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          git diff --check

      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          if git diff --cached --quiet; then
            echo "Renderer allocator is already repaired."
            exit 0
          fi
          git commit -m "Fix Visibility texture allocator declaration and readiness"
          git push origin HEAD:opt/renderer-batch2
