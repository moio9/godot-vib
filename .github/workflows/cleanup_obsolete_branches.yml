name: Cleanup obsolete branches

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup_obsolete_branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'backup/4.7-before-4.7.2',
              'build/renderer-batch2-stable',
              'cleanup/temporary',
              'feat/4.7.2-mesh-blend-per-pixel',
              'feature/mesh-blend-per-pixel',
              'feature/mesh-blend-per-pixel-final',
              'fix/mesh-blend-edge-barrier',
              'fix/mesh-blend-edge-propagation',
              'fix/ssao-standard-4.7.2',
              'fix/ssao-standard-final',
              'fix/ssao-vb-sector-intervals',
              'fix/4.7.2-ssao-standard-vb',
              'opt/mesh-blend-bounded-jump-flood',
              'opt/mesh-blend-compact-visibility-attachment',
              'opt/mesh-blend-main-pass-metadata',
              'opt/mesh-blend-mask-bandwidth',
              'opt/mesh-blend-packed-mask',
              'opt/mesh-blend-packed-vb-aux',
              'opt/mesh-blend-reuse-vb-aux-mask',
              'opt/mesh-blend-rg16-edges',
              'opt/mesh-blend-vb-depth',
              'opt/renderer-batch2',
              'opt/renderer-depth-final',
              'opt/renderer-depth-mesh-blend',
              'opt/renderer-depth-meshblend',
              'opt/4.7.2-renderer',
              'opt/4.7.2-renderer-depth-v1',
              'opt/4.7.2-renderer-depth-v2',
              'sync/4.7.2',
              'upstream/4.7.2-stable',
              'work/renderer-optimizations'
            ];

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Already absent: ${branch}`);
                } else {
                  throw error;
                }
              }
            }
