name: Repair renderer batch validation

on:
  push:
    branches:
      - "opt/renderer-batch2"
    paths:
      - ".github/workflows/renderer_batch2_validation_repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-batch2-validation-repair
  cancel-in-progress: true

jobs:
  repair-validator:
    runs-on: ubuntu-slim
    timeout-minutes: 20

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1

      - name: Replace obsolete duplicate-mask invariant
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/renderer_batch2_apply_final.yml")
          text = path.read_text(encoding="utf-8")

          old = '''          require_all(
              "Packed Mesh Blend mask",
              mask_shader,
              ("layout(r16ui", "uimage2D mesh_mask"),
          )
          if "vb_vis" in mask_shader:
              raise RuntimeError("Mesh Blend mask still reads the full Visibility ID buffer")
'''

          new = '''          require_all(
              "Packed VB_AUX Mesh Blend edge input",
              mask_shader,
              (
                  "layout(r16ui",
                  "uimage2D vb_aux",
                  "unpack_visibility_aux",
                  "uimage2D mesh_edges",
              ),
          )
          if "mesh_mask" in mask_shader:
              raise RuntimeError("The duplicate full-resolution Mesh Blend mask still exists")
          if "vb_vis" in mask_shader:
              raise RuntimeError("Mesh Blend edge detection still reads the full Visibility ID buffer")
'''

          if old not in text:
              raise RuntimeError("The obsolete Packed Mesh Blend mask invariant was not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -n -A18 -B3 "Packed VB_AUX Mesh Blend edge input" \
            .github/workflows/renderer_batch2_apply_final.yml

      - name: Commit repaired validator
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/renderer_batch2_validation_repair.yml
          git add -A
          git diff --cached --check
          git commit -m "Validate VB_AUX mask reuse instead of removed mesh mask"
          git push origin HEAD:opt/renderer-batch2
