name: Repair and compile renderer batch

# trigger: 3
on:
  push:
    branches:
      - "opt/renderer-batch2"
    paths:
      - ".github/workflows/renderer_compile_repair_final.yml"
  pull_request:
    branches:
      - "4.7"
    paths:
      - ".github/workflows/renderer_compile_repair_final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-compile-repair-final
  cancel-in-progress: true

jobs:
  repair-compile-package:
    if: github.event_name != 'pull_request' || github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout renderer branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1

      - name: Repair Visibility allocator declaration and readiness
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h")
          text = header.read_text(encoding="utf-8")
          bad = "bool ensure_visibility_textures(true, bool p_need_aux = true, bool p_need_depth = true);"
          good = "bool ensure_visibility_textures(bool p_need_full_visibility = true, bool p_need_aux = true, bool p_need_depth = true);"
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good not in text:
              raise RuntimeError("Unknown Visibility allocator declaration")
          text = text.replace(
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // RG16F',
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // R16_UINT: packed group and strength',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R32G32_UINT: edge coords',
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R16G16_UINT: edge coords',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R32G32_UINT: ping/pong',
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R16G16_UINT: ping/pong',
              1,
          )
          header.write_text(text, encoding="utf-8")

          source = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp")
          text = source.read_text(encoding="utf-8")
          bad_return = "\treturn has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_VIS) && (p_need_depth ? has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH) : true);"
          good_return = """\tconst bool visibility_ready = has_texture(RB_SCOPE_BUFFERS, p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT);
\tconst bool aux_ready = !p_need_aux || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_AUX);
\tconst bool depth_ready = !p_need_depth || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH);
\treturn visibility_ready && aux_ready && depth_ready;"""
          if bad_return in text:
              text = text.replace(bad_return, good_return, 1)
          elif good_return not in text:
              raise RuntimeError("Unknown Visibility allocator return expression")
          source.write_text(text, encoding="utf-8")
          PY

          ! grep -R -n 'ensure_visibility_textures(true,' servers/rendering
          grep -q 'bool ensure_visibility_textures(bool p_need_full_visibility = true' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h
          grep -q 'p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          git diff --check

      - name: Commit repaired source before compiling
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          if ! git diff --cached --quiet; then
            git commit -m "Fix Visibility texture allocator declaration and readiness"
            git push origin HEAD:opt/renderer-batch2
          fi

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux Forward+ editor
        shell: bash
        run: |
          set -o pipefail
          scons -j2 \
            platform=linuxbsd \
            target=editor \
            arch=x86_64 \
            dev_mode=yes \
            module_text_server_fb_enabled=yes \
            tests=no \
            2>&1 | tee renderer-compile.log

      - name: Smoke-test editor
        shell: bash
        run: |
          set -euxo pipefail
          binary="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --headless --version

      - name: Package Linux editor
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/linux
          binary="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*' -perm -111 | head -n 1)"
          cp "$binary" artifacts/linux/godot-vib-4.7.2-linux-x86_64
          chmod +x artifacts/linux/godot-vib-4.7.2-linux-x86_64
          tar -C artifacts/linux -cJf artifacts/godot-vib-4.7.2-linux-x86_64.tar.xz godot-vib-4.7.2-linux-x86_64

      - name: Upload Linux editor
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-4.7.2-linux-x86_64
          path: artifacts/godot-vib-4.7.2-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-compile-failure-log
          path: renderer-compile.log
          if-no-files-found: ignore
          retention-days: 14
