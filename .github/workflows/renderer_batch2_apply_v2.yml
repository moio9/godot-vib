name: Consolidate renderer optimizations driver

on:
  pull_request:
    branches:
      - "4.7"
    paths:
      - ".github/workflows/renderer_batch2_apply_v2.yml"
      - ".github/workflows/renderer_batch2_apply_v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-batch2-driver
  cancel-in-progress: true

jobs:
  apply-build-commit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 0

      - name: Execute V3 patch and validation stages
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path(".github/workflows/renderer_batch2_apply_v3.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()

          def extract_step(name: str) -> str:
              start = next((i for i, line in enumerate(lines) if line.strip() == f"- name: {name}"), None)
              if start is None:
                  raise RuntimeError(f"Step not found in V3 workflow: {name}")

              run_index = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == "run: |"), None)
              if run_index is None:
                  raise RuntimeError(f"Run block not found for V3 step: {name}")

              run_indent = len(lines[run_index]) - len(lines[run_index].lstrip())
              block = []
              for line in lines[run_index + 1:]:
                  if line.strip():
                      indent = len(line) - len(line.lstrip())
                      if indent <= run_indent:
                          break
                  block.append(line)

              nonempty = [line for line in block if line.strip()]
              if not nonempty:
                  raise RuntimeError(f"Empty run block for V3 step: {name}")
              prefix = min(len(line) - len(line.lstrip()) for line in nonempty)
              return "\n".join(line[prefix:] if line.strip() else "" for line in block) + "\n"

          stages = [
              "Fetch source branches",
              "Normalize current source names",
              "Apply validated shared-depth and edge-correctness patch",
              "Add functional per-pixel Mesh Blend shader API",
              "Apply validated Mesh Blend bandwidth passes",
              "Remove tracked generated files",
              "Verify optimized source invariants",
              "Install shader validation tools",
              "Validate standalone Mesh Blend shaders",
          ]

          for stage in stages:
              print(f"\n===== {stage} =====", flush=True)
              subprocess.run(
                  ["bash", "-c", "set -euo pipefail\n" + extract_step(stage)],
                  check=True,
              )
          PY

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux Forward+ editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Commit validated V3 result
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path(".github/workflows/renderer_batch2_apply_v3.yml").read_text(encoding="utf-8").splitlines()
          name = "Commit validated source result"
          start = next(i for i, line in enumerate(lines) if line.strip() == f"- name: {name}")
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "run: |")
          run_indent = len(lines[run_index]) - len(lines[run_index].lstrip())
          block = []
          for line in lines[run_index + 1:]:
              if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                  break
              block.append(line)
          nonempty = [line for line in block if line.strip()]
          prefix = min(len(line) - len(line.lstrip()) for line in nonempty)
          script = "\n".join(line[prefix:] if line.strip() else "" for line in block) + "\n"
          subprocess.run(["bash", "-c", "set -euo pipefail\n" + script], check=True)
          PY
