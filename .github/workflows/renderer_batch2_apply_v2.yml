name: Apply consolidated renderer optimizations

on:
  pull_request:
    branches:
      - "4.7"
    paths:
      - ".github/workflows/renderer_batch2_apply_v2.yml"
      - ".github/workflows/renderer_batch2_apply_v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renderer-batch2-driver
  cancel-in-progress: true

jobs:
  apply-and-commit-source:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-slim
    timeout-minutes: 60

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1

      - name: Fetch only validated patch branches
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branches=(
            opt/renderer-depth-final
            opt/mesh-blend-mask-bandwidth
            opt/mesh-blend-compact-visibility-attachment
            opt/mesh-blend-bounded-jump-flood
            opt/mesh-blend-rg16-edges
            opt/mesh-blend-packed-mask
            opt/mesh-blend-packed-vb-aux
            opt/mesh-blend-reuse-vb-aux-mask
            opt/mesh-blend-main-pass-metadata
          )

          for branch in "${branches[@]}"; do
            git fetch --depth=1 origin \
              "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          done

      - name: Apply and verify V3 source stages
        shell: bash
        run: |
          set -euxo pipefail
          command -v git
          command -v python3

          # V3 is used as a patch-program container. Normalize its nested GLSL
          # literal and make the oldest mask patch tolerate renamed call arguments.
          python3 - <<'PYFIX'
          from pathlib import Path

          path = Path(".github/workflows/renderer_batch2_apply_v3.yml")
          text = path.read_text(encoding="utf-8")

          start_marker = "          post_code = r'''\n"
          end_marker = "\n'''\n          text = text.replace(marker, marker + post_code, 1)"
          start = text.find(start_marker)
          if start < 0:
              raise RuntimeError("Nested post_code literal was not found in V3")
          end = text.find(end_marker, start)
          if end < 0:
              raise RuntimeError("Nested post_code literal terminator was not found in V3")

          replacement = (
              "          post_code = (\n"
              "              \"\\n#ifdef MODE_RENDER_VISIBILITY\\n\"\n"
              "              \"\\tfloat material_mesh_blend = clamp(sc_get_material_mesh_blend(), -1.0, 1.0);\\n\"\n"
              "              \"\\tfloat blend_id = sc_instance_hash(packed_ids.y);\\n\"\n"
              "              \"\\tfrag_visibility_aux = vec2(material_mesh_blend, blend_id);\\n\"\n"
              "              \"#ifdef MESH_BLEND_OUTPUT_USED\\n\"\n"
              "              \"\\tfrag_visibility_aux.x = clamp(mesh_blend_output, 0.0, 1.0);\\n\"\n"
              "              \"#endif\\n\"\n"
              "              \"#ifdef MESH_BLEND_GROUP_OUTPUT_USED\\n\"\n"
              "              \"\\tfrag_visibility_aux.y = float(min(mesh_blend_group_output, 255u)) / 255.0;\\n\"\n"
              "              \"#endif\\n\"\n"
              "              \"\\treturn;\\n\"\n"
              "              \"#endif\\n\"\n"
              "          )"
          )
          text = text[:start] + replacement + text[end + 4:]

          old_call = (
              "          apply_workflow_python opt/mesh-blend-mask-bandwidth "
              ".github/workflows/optimize_mesh_blend_mask_bandwidth.yml"
          )
          new_call = old_call + " mask-call-flex"
          if old_call not in text:
              raise RuntimeError("Mask-bandwidth patch call was not found in V3")
          text = text.replace(old_call, new_call, 1)

          write_anchor = '          Path("/tmp/source-patch.py").write_text(body, encoding="utf-8")'
          adapter_code = '''          if sys.argv[1] == "mask-call-flex":
              body = body.replace(
                  r"\\s*vb_vis\\s*",
                  r"\\s*[A-Za-z_][A-Za-z0-9_]*\\s*",
              )
'''
          if write_anchor not in text:
              raise RuntimeError("Patch-program write anchor was not found in V3")
          text = text.replace(write_anchor, adapter_code + write_anchor, 1)

          path.write_text(text, encoding="utf-8")
          PYFIX

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path(".github/workflows/renderer_batch2_apply_v3.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()

          def extract_step(name: str) -> str:
              start = next((i for i, line in enumerate(lines) if line.strip() == f"- name: {name}"), None)
              if start is None:
                  raise RuntimeError(f"Step not found in V3 workflow: {name}")

              run_index = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == "run: |"), None)
              if run_index is None:
                  raise RuntimeError(f"Run block not found for V3 step: {name}")

              run_indent = len(lines[run_index]) - len(lines[run_index].lstrip())
              block = []
              for line in lines[run_index + 1:]:
                  if line.strip():
                      indent = len(line) - len(line.lstrip())
                      if indent <= run_indent:
                          break
                  block.append(line)

              nonempty = [line for line in block if line.strip()]
              if not nonempty:
                  raise RuntimeError(f"Empty run block for V3 step: {name}")

              prefix = min(len(line) - len(line.lstrip()) for line in nonempty)
              return "\n".join(line[prefix:] if line.strip() else "" for line in block) + "\n"

          stages = [
              "Normalize current source names",
              "Apply validated shared-depth and edge-correctness patch",
              "Add functional per-pixel Mesh Blend shader API",
              "Apply validated Mesh Blend bandwidth passes",
              "Remove tracked generated files",
              "Verify optimized source invariants",
          ]

          for stage in stages:
              print(f"\n===== {stage} =====", flush=True)
              subprocess.run(
                  ["bash", "-c", "set -euo pipefail\n" + extract_step(stage)],
                  check=True,
              )
          PY

      - name: Commit consolidated source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/renderer_batch2_apply.yml
          rm -f .github/workflows/renderer_batch2_apply_v2.yml
          rm -f .github/workflows/renderer_batch2_apply_v3.yml

          mkdir -p .github/build-status
          {
            echo "branch=opt/renderer-batch2"
            echo "source_patches=applied"
            echo "applied_by_run=${{ github.run_id }}"
            echo "applied_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "linux_compile=pending"
            echo "msaa_runtime_validation=pending"
          } > .github/build-status/renderer-batch2-source.txt

          git add -A
          if git diff --cached --quiet; then
            echo "::error::No renderer source changes were produced"
            exit 1
          fi

          git commit -m "Apply renderer, Mesh Blend and MSAA optimizations"
          git push origin HEAD:opt/renderer-batch2
