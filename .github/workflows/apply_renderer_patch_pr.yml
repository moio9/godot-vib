name: Apply trusted renderer patch

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/renderer-optimizations'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout trusted same-repository branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded source transformations
        run: python3 misc/scripts/apply_renderer_optimizations.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit transformed sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Renderer sources already contain the requested optimizations."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl \
            servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl \
            servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl \
            servers/rendering/renderer_rd/effects/mesh_blend.cpp \
            servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp \
            servers/rendering/renderer_rd/renderer_scene_render_rd.cpp \
            .github/workflows/termux_build.yml
          git commit -m "Optimize VB mesh blending and shared depth preparation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
