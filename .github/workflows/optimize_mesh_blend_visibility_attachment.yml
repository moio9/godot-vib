name: Use a compact Visibility attachment for Mesh Blend

on:
  workflow_dispatch:
  push:
    branches:
      - opt/mesh-blend-compact-visibility-attachment
    paths:
      - .github/workflows/optimize_mesh_blend_visibility_attachment.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: opt/mesh-blend-compact-visibility-attachment
          fetch-depth: 0

      - name: Add the compact attachment path idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def function_extent(text: str, signature_pattern: str) -> tuple[int, int]:
              match = re.search(signature_pattern, text)
              if match is None:
                  raise RuntimeError(f"Function not found: {signature_pattern}")
              brace = text.index("{", match.end())
              depth = 0
              for index in range(brace, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return match.start(), index + 1
              raise RuntimeError(f"Unbalanced function: {signature_pattern}")

          def indent_block(block: str, prefix: str) -> str:
              return "\n".join(prefix + line if line else line for line in block.splitlines())

          source_files = list(Path("servers/rendering").rglob("*.h")) + list(Path("servers/rendering").rglob("*.cpp"))

          # Add a distinct texture name so toggling Visibility debug never requires changing
          # an existing texture's format in place.
          macro_file = None
          for path in source_files:
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "#define RB_TEX_VB_VIS" in text:
                  macro_file = path
                  if "#define RB_TEX_VB_COMPACT" not in text:
                      line_match = re.search(r"^#define RB_TEX_VB_VIS[^\n]*$", text, flags=re.MULTILINE)
                      if line_match is None:
                          raise RuntimeError("RB_TEX_VB_VIS macro line was not found")
                      insertion = line_match.group(0) + '\n#define RB_TEX_VB_COMPACT SNAME("visibility_compact")'
                      text = text[:line_match.start()] + insertion + text[line_match.end():]
                      path.write_text(text, encoding="utf-8")
                  break
          if macro_file is None:
              raise RuntimeError("RB_TEX_VB_VIS definition was not found")

          # Extend declaration and definition with an explicit full-visibility requirement.
          declaration_patched = 0
          definition_path = None
          for path in source_files:
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "ensure_visibility_textures" not in text:
                  continue
              updated = text
              updated, count = re.subn(
                  r"void ensure_visibility_textures\(bool p_need_aux, bool p_need_depth\);",
                  "void ensure_visibility_textures(bool p_need_full_visibility, bool p_need_aux, bool p_need_depth);",
                  updated,
                  count=1,
              )
              declaration_patched += count
              updated, count_def = re.subn(
                  r"void ([A-Za-z0-9_:]+)::ensure_visibility_textures\(bool p_need_aux, bool p_need_depth\) \{",
                  r"void \1::ensure_visibility_textures(bool p_need_full_visibility, bool p_need_aux, bool p_need_depth) {",
                  updated,
                  count=1,
              )
              if count_def:
                  definition_path = path
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          if definition_path is None:
              # The branch may already carry the expanded signature.
              for path in source_files:
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  if "::ensure_visibility_textures(bool p_need_full_visibility" in text:
                      definition_path = path
                      break
          if definition_path is None:
              raise RuntimeError("ensure_visibility_textures definition was not found")

          # Replace the unconditional full ID texture creation with full/debug and compact paths.
          text = definition_path.read_text(encoding="utf-8")
          fn_start, fn_end = function_extent(
              text,
              r"void [A-Za-z0-9_:]+::ensure_visibility_textures\(bool p_need_full_visibility, bool p_need_aux, bool p_need_depth\)",
          )
          fn = text[fn_start:fn_end]
          if "RB_TEX_VB_COMPACT" not in fn:
              vis_position = fn.find("RB_TEX_VB_VIS")
              if vis_position < 0:
                  raise RuntimeError("Full Visibility texture creation was not found in ensure_visibility_textures")
              if_position = fn.rfind("\n\tif (", 0, vis_position)
              if if_position < 0:
                  if_position = fn.rfind("\n\t\tif (", 0, vis_position)
              if if_position < 0:
                  raise RuntimeError("Could not locate the Visibility texture creation condition")
              if_position += 1
              brace = fn.index("{", if_position)
              depth = 0
              block_end = None
              for index in range(brace, len(fn)):
                  if fn[index] == "{":
                      depth += 1
                  elif fn[index] == "}":
                      depth -= 1
                      if depth == 0:
                          block_end = index + 1
                          break
              if block_end is None:
                  raise RuntimeError("Visibility texture creation block has unbalanced braces")
              original_block = fn[if_position:block_end]
              if "RD::DATA_FORMAT_R32G32_UINT" not in original_block:
                  raise RuntimeError("Expected RG32_UINT format was not found in the full Visibility block")
              compact_block = original_block.replace("RB_TEX_VB_VIS", "RB_TEX_VB_COMPACT")
              compact_block = compact_block.replace("RD::DATA_FORMAT_R32G32_UINT", "RD::DATA_FORMAT_R8_UINT")
              indentation = re.match(r"[\t ]*", original_block).group(0)
              wrapped = (
                  indentation + "if (p_need_full_visibility) {\n"
                  + indent_block(original_block, "\t") + "\n"
                  + indentation + "} else {\n"
                  + indent_block(compact_block, "\t") + "\n"
                  + indentation + "}"
              )
              fn = fn[:if_position] + wrapped + fn[block_end:]
              text = text[:fn_start] + fn + text[fn_end:]
              definition_path.write_text(text, encoding="utf-8")

          # Update all call sites conservatively. Non-render-pass callers retain the full format.
          call_count = 0
          for path in source_files:
              text = path.read_text(encoding="utf-8", errors="ignore")
              updated, count = re.subn(
                  r"ensure_visibility_textures\((?!bool p_need_full_visibility)([^,()]+),\s*([^()]+)\);",
                  r"ensure_visibility_textures(true, \1, \2);",
                  text,
              )
              if count:
                  path.write_text(updated, encoding="utf-8")
                  call_count += count

          # The actual Visibility/Mesh Blend pass chooses the compact attachment unless the
          # user is explicitly viewing the full Primitive/Instance ID debug output.
          renderer_path = None
          for path in Path("servers/rendering/renderer_rd").rglob("*.cpp"):
              content = path.read_text(encoding="utf-8", errors="ignore")
              if "_render_visibility_buffer_pass" in content:
                  renderer_path = path
                  break
          if renderer_path is None:
              raise RuntimeError("_render_visibility_buffer_pass implementation was not found")

          text = renderer_path.read_text(encoding="utf-8")
          fn_start, fn_end = function_extent(text, r"void [A-Za-z0-9_:]+::_render_visibility_buffer_pass\(")
          fn = text[fn_start:fn_end]
          if "need_full_visibility" not in fn:
              rb_anchor = re.search(r"^[\t ]*Ref<RenderSceneBuffersRD> rb = [^\n]+;", fn, flags=re.MULTILINE)
              if rb_anchor is None:
                  raise RuntimeError("RenderSceneBuffersRD local was not found in the Visibility pass")
              indent = re.match(r"[\t ]*", rb_anchor.group(0)).group(0)
              declaration = (
                  "\n" + indent
                  + "bool need_full_visibility = get_debug_draw_mode() == RSE::VIEWPORT_DEBUG_DRAW_VISIBILITY_BUFFER;"
              )
              fn = fn[:rb_anchor.end()] + declaration + fn[rb_anchor.end():]

          fn, ensure_count = re.subn(
              r"ensure_visibility_textures\((?:true,\s*)?need_aux,\s*!use_main_depth_for_vb\);",
              "ensure_visibility_textures(need_full_visibility, need_aux, !use_main_depth_for_vb);",
              fn,
              count=1,
          )
          if ensure_count == 0 and "ensure_visibility_textures(need_full_visibility" not in fn:
              raise RuntimeError("Visibility texture allocation call was not patched")

          full_get = "rb->get_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_VIS)"
          compact_get = "rb->get_texture(RB_SCOPE_BUFFERS, need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT)"
          if full_get in fn:
              fn = fn.replace(full_get, compact_get, 1)
          if "need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT" not in fn:
              raise RuntimeError("The Visibility pass does not select the compact attachment")

          text = text[:fn_start] + fn + text[fn_end:]
          renderer_path.write_text(text, encoding="utf-8")

          # Any remaining two-argument calls are unsafe after the API change.
          leftovers = []
          for path in source_files:
              content = path.read_text(encoding="utf-8", errors="ignore")
              if re.search(r"ensure_visibility_textures\([^,()]+,\s*[^,()]+\);", content):
                  leftovers.append(path)
          if leftovers:
              raise RuntimeError(f"Two-argument ensure_visibility_textures calls remain: {leftovers}")

          # Final source assertions.
          all_text = "\n".join(path.read_text(encoding="utf-8", errors="ignore") for path in source_files)
          required = (
              "RB_TEX_VB_COMPACT",
              "RD::DATA_FORMAT_R8_UINT",
              "p_need_full_visibility",
              "need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT",
          )
          for needle in required:
              if needle not in all_text:
                  raise RuntimeError(f"Compact Visibility source result is missing: {needle}")
          PY

          git diff --check

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Compile Windows editor
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no
            arch=x86_64

      - name: Remove workflow, record validation and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/optimize_mesh_blend_visibility_attachment.yml
          mkdir -p .github/build-status
          {
            echo "branch=opt/mesh-blend-compact-visibility-attachment"
            echo "validated_by_run=${{ github.run_id }}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/build-status/mesh-blend-compact-visibility-attachment.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use R8 Visibility attachment for Mesh Blend outside debug mode"
          git push origin HEAD:opt/mesh-blend-compact-visibility-attachment
