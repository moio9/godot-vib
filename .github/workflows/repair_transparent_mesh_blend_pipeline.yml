name: Repair transparent Mesh Blend pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "opt/renderer-batch2"
    paths:
      - ".github/workflows/repair_transparent_mesh_blend_pipeline.yml"

permissions:
  contents: write

concurrency:
  group: repair-transparent-mesh-blend-pipeline
  cancel-in-progress: false

jobs:
  repair:
    name: Patch transparent blend state and Vulkan regression test
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout renderer branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1

      - name: Apply focused repair
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp")
          source = source_path.read_text(encoding="utf-8")

          old_comment = "// Color pass -> attachment 0: Color/Diffuse, attachment 1: Separate Specular, attachment 2: Motion Vectors"
          new_comment = "// Color pass -> attachment 0: Color/Diffuse, attachment 1: Separate Specular, attachment 2: Motion Vectors, attachment 3: Mesh Blend auxiliary"
          if source.count(old_comment) != 1:
              raise SystemExit(f"Expected one color attachment comment, found {source.count(old_comment)}")
          source = source.replace(old_comment, new_comment, 1)

          old_initializer = "blend_state_color_blend.attachments = { blend_attachment, RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment() };"
          new_initializer = "blend_state_color_blend.attachments = { blend_attachment, RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment() };"
          if source.count(old_initializer) != 1:
              raise SystemExit(f"Expected one transparent blend-state initializer, found {source.count(old_initializer)}")
          source = source.replace(old_initializer, new_initializer, 1)
          source_path.write_text(source, encoding="utf-8")

          ci_path = Path(".github/workflows/renderer_batch2_compile_fixed.yml")
          ci = ci_path.read_text(encoding="utf-8")

          old_assert = '          assert "color_attachment_count = (p_pipeline_key.color_pass_flags & PIPELINE_COLOR_PASS_FLAG_MESH_BLEND) ? 4 : 3" in shader_cpp\n'
          new_assert = old_assert + '          assert "blend_state_color_blend.attachments = { blend_attachment, RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment(), RD::PipelineColorBlendState::Attachment() };" in shader_cpp\n'
          if ci.count(old_assert) != 1:
              raise SystemExit(f"Expected one attachment-count assertion, found {ci.count(old_assert)}")
          ci = ci.replace(old_assert, new_assert, 1)

          old_scene_tail = '''              mesh_instance.material_override = material
              add_child(mesh_instance)
          EOF
'''
          new_scene_tail = '''              mesh_instance.material_override = material
              add_child(mesh_instance)

              # The previous regression only appeared when the main framebuffer had
              # the Mesh Blend auxiliary attachment while a transparent pipeline was built.
              var transparent_mesh := MeshInstance3D.new()
              transparent_mesh.mesh = SphereMesh.new()
              transparent_mesh.position = Vector3(1.4, 0.0, 0.0)
              var transparent_shader := Shader.new()
              transparent_shader.code = """
          shader_type spatial;
          render_mode blend_mix, depth_draw_alpha_prepass, cull_back;
          void fragment() {
              ALBEDO = vec3(0.2, 0.55, 0.9);
              ROUGHNESS = 0.35;
              ALPHA = 0.45;
              MESH_BLEND = 0.25;
              MESH_BLEND_GROUP = 2u;
          }
          """
              var transparent_material := ShaderMaterial.new()
              transparent_material.shader = transparent_shader
              transparent_mesh.material_override = transparent_material
              add_child(transparent_mesh)
          EOF
'''
          if ci.count(old_scene_tail) != 1:
              raise SystemExit(f"Expected one runtime-scene insertion point, found {ci.count(old_scene_tail)}")
          ci = ci.replace(old_scene_tail, new_scene_tail, 1)

          old_pattern = r'pipeline\\.is_null\\(\\)|Error compiling'
          new_pattern = r'pipeline\\.is_null\\(\\)|p_blend_state\\.attachments\\.size\\(\\) < pass\\.color_attachments\\.size\\(\\)|Error compiling'
          if ci.count(old_pattern) != 2:
              raise SystemExit(f"Expected two runtime error patterns, found {ci.count(old_pattern)}")
          ci = ci.replace(old_pattern, new_pattern)

          ci_path.write_text(ci, encoding="utf-8")
          PY

          git diff --check
          git diff -- servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp .github/workflows/renderer_batch2_compile_fixed.yml

      - name: Commit repaired source and validation
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/repair_transparent_mesh_blend_pipeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp
          git add .github/workflows/renderer_batch2_compile_fixed.yml
          git commit -m "Fix transparent Mesh Blend pipeline attachment count"
          git push origin HEAD:opt/renderer-batch2
