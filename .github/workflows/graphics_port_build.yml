name: Godot 4.8 graphics port

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Platforms to build
        type: choice
        default: all
        options: [all, termux]
  push:
    branches: ["port/4.8-graphics", "experimental/4.8-dynamic-gi"]

permissions:
  contents: read

concurrency:
  group: graphics-port-${{ github.ref }}-${{ inputs.build_target || 'all' }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux editor and Vulkan smoke test
    if: inputs.build_target != 'termux'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/godot-deps
      - name: Install shader and Vulkan test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools mesa-vulkan-drivers xvfb xauth
      - name: Check effect shaders
        run: python3 misc/scripts/check_graphics_shaders.py
      - name: Compile editor
        run: |
          set -o pipefail
          scons -j2 platform=linuxbsd target=editor arch=x86_64 \
            dev_mode=yes debug_symbols=no accesskit=no tests=no \
            module_text_server_fb_enabled=yes 2>&1 | tee linux-build.log
      - name: Run Vulkan graphics combinations
        run: |
          set -euxo pipefail
          BIN=bin/godot.linuxbsd.editor.x86_64
          test -x "$BIN"
          "$BIN" --headless --version | tee version.txt
          LVP_ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP_ICD"
          GI_ARGS=()
          if [ "$GITHUB_REF_NAME" = "experimental/4.8-dynamic-gi" ]; then
            GI_ARGS=(-- --dynamic-gi)
          fi
          timeout 900s xvfb-run -a env VK_ICD_FILENAMES="$LVP_ICD" \
            "$BIN" --path misc/tests/graphics_port --rendering-method forward_plus \
            --rendering-driver vulkan --audio-driver Dummy --verbose "${GI_ARGS[@]}" 2>&1 | tee vulkan-runtime.log
          test "$(grep -c 'GRAPHICS_CASE_OK' vulkan-runtime.log)" -eq 6
          test "$(grep -c 'REFLECTION_PROBE_CASE_OK' vulkan-runtime.log)" -eq 2
          grep -Fq GRAPHICS_FSR2_OK vulkan-runtime.log
          grep -Fq GRAPHICS_PORT_OK vulkan-runtime.log
          if [ "$GITHUB_REF_NAME" = "experimental/4.8-dynamic-gi" ]; then
            test "$(grep -c 'DYNAMIC_GI_CASE_OK' vulkan-runtime.log)" -eq 12
            grep -Fq DYNAMIC_GI_PORT_OK vulkan-runtime.log
          fi
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Error compiling' vulkan-runtime.log; then
            exit 1
          fi
      - name: Run rendering resource lifecycle regression
        run: |
          set -euxo pipefail
          BIN=bin/godot.linuxbsd.editor.x86_64
          LVP_ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP_ICD"
          timeout 180s xvfb-run -a env VK_ICD_FILENAMES="$LVP_ICD" \
            "$BIN" --path tests/rendering/resource_lifecycle --rendering-method forward_plus \
            --rendering-driver vulkan --audio-driver Dummy --verbose 2>&1 | tee resource-lifecycle-runtime.log
          grep -Fq 'LIFECYCLE_RESULT checks=4 failures=0' resource-lifecycle-runtime.log
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Error compiling|RID.*leaked|ObjectDB.*leaked' resource-lifecycle-runtime.log; then
            exit 1
          fi
      - name: Run shader engine version regression
        run: |
          set -euxo pipefail
          BIN=bin/godot.linuxbsd.editor.x86_64
          LVP_ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP_ICD"
          timeout 180s xvfb-run -a env VK_ICD_FILENAMES="$LVP_ICD" \
            "$BIN" --path tests/rendering/shader_version --rendering-method forward_plus \
            --rendering-driver vulkan --audio-driver Dummy --verbose 2>&1 | tee shader-version-runtime.log
          grep -Fq 'SHADER_VERSION_RESULT checks=4 failures=0' shader-version-runtime.log
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Error compiling|RID.*leaked|ObjectDB.*leaked' shader-version-runtime.log; then
            exit 1
          fi
      - name: Run shared SSR history and threaded shutdown regression
        run: |
          set -euxo pipefail
          BIN=bin/godot.linuxbsd.editor.x86_64
          LVP_ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP_ICD"
          timeout 180s xvfb-run -a env VK_ICD_FILENAMES="$LVP_ICD" \
            "$BIN" --path tests/rendering/ssr_history --rendering-method forward_plus \
            --rendering-driver vulkan --audio-driver Dummy --verbose 2>&1 | tee ssr-history-runtime.log
          grep -Fq 'SSR_HISTORY_RESULT checks=10 failures=0' ssr-history-runtime.log
          if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Error compiling|leaked' ssr-history-runtime.log; then
            exit 1
          fi
      - name: Run independent decal ORM regression in all renderers
        run: |
          set -euxo pipefail
          BIN=bin/godot.linuxbsd.editor.x86_64
          LVP_ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP_ICD"
          for METHOD in forward_plus mobile gl_compatibility; do
            timeout 180s xvfb-run -a env VK_ICD_FILENAMES="$LVP_ICD" LIBGL_ALWAYS_SOFTWARE=1 \
              "$BIN" --path tests/rendering/decal_orm --script res://check.gd \
              --rendering-method "$METHOD" --audio-driver Dummy --verbose 2>&1 | tee "decal-orm-$METHOD.log"
            grep -Fq "DECAL_ORM_RESULT renderer=$METHOD checks=17 failures=0" "decal-orm-$METHOD.log"
            if grep -Eq 'ERROR:|SCRIPT ERROR|Parse Error|Error compiling|leaked' "decal-orm-$METHOD.log"; then
              exit 1
            fi
          done
      - name: Package Linux editor
        run: |
          tar -cJf godot-vib-4.8-dev-linux-x86_64.tar.xz \
            bin/godot.linuxbsd.editor.x86_64 LICENSE.txt COPYRIGHT.txt version.txt
          sha256sum godot-vib-4.8-dev-linux-x86_64.tar.xz > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: godot-4.8-linux-${{ github.sha }}
          path: |
            godot-vib-4.8-dev-linux-x86_64.tar.xz
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: graphics-linux-logs-${{ github.sha }}
          path: |
            linux-build.log
            vulkan-runtime.log
            resource-lifecycle-runtime.log
            shader-version-runtime.log
            ssr-history-runtime.log
            decal-orm-*.log
            version.txt

  windows:
    name: Windows x86_64 editor (Vulkan and D3D12)
    if: github.ref_name == 'experimental/4.8-dynamic-gi' && inputs.build_target != 'termux'
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      SCONS_CACHE_MSVC_CONFIG: true
      PYTHONIOENCODING: utf8
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/godot-deps
      - name: Install D3D12 SDK components
        run: python misc/scripts/install_d3d12_sdk_windows.py
      - name: Compile Windows editor
        run: |
          scons -j2 platform=windows target=editor arch=x86_64 dev_mode=yes `
            debug_symbols=no accesskit=no angle=no d3d12=yes tests=no `
            windows_subsystem=console module_text_server_fb_enabled=yes `
            2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check and package Windows editor
        run: |
          & bin/godot.windows.editor.x86_64.exe --headless --version | Tee-Object -FilePath windows-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @('bin/godot.windows.editor.x86_64.exe', 'LICENSE.txt', 'COPYRIGHT.txt', 'windows-version.txt')
          $files += @(Get-ChildItem bin -Filter '*.dll' | ForEach-Object { $_.FullName })
          Compress-Archive -Path $files -DestinationPath godot-vib-4.8-dev-windows-x86_64.zip
          $hash = (Get-FileHash godot-vib-4.8-dev-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  godot-vib-4.8-dev-windows-x86_64.zip" | Set-Content -Encoding utf8 SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: godot-4.8-windows-${{ github.sha }}
          path: |
            godot-vib-4.8-dev-windows-x86_64.zip
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: graphics-windows-logs-${{ github.sha }}
          path: |
            windows-build.log
            windows-version.txt

  termux:
    name: Termux aarch64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned Termux package builder
        uses: actions/checkout@v6
        with:
          repository: termux/termux-packages
          ref: b51ee964cce82cadb4be3d90162cd3a0e6f8dced
          path: termux-packages
          fetch-depth: 1
      - name: Prepare 4.8 recipe
        run: |
          set -euxo pipefail
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          curl -fL --retry 3 "$SOURCE_URL" -o "$RUNNER_TEMP/godot-source.tar.gz"
          SOURCE_SHA256=$(sha256sum "$RUNNER_TEMP/godot-source.tar.gz" | cut -d ' ' -f1)
          python3 misc/dist/termux/prepare_recipe.py termux-packages/x11-packages/godot \
            --source-url "$SOURCE_URL" --sha256 "$SOURCE_SHA256"
      - name: Free runner disk space
        working-directory: termux-packages
        run: ./scripts/free-space.sh
      - name: Build package
        working-directory: termux-packages
        run: |
          set -o pipefail
          ./scripts/run-docker.sh -d ./build-package.sh -I -C -f -a aarch64 godot \
            2>&1 | tee "$GITHUB_WORKSPACE/termux-build.log"
      - name: Collect package
        run: |
          mkdir -p termux-artifacts
          find termux-packages/output -maxdepth 1 -name 'godot*.deb' \
            -exec cp {} termux-artifacts/ \;
          test -n "$(find termux-artifacts -name 'godot*.deb' -print -quit)"
          cd termux-artifacts
          sha256sum godot*.deb > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: godot-4.8-termux-aarch64-${{ github.sha }}
          path: termux-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: graphics-termux-logs-${{ github.sha }}
          path: termux-build.log
