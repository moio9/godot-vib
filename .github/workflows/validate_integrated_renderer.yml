name: Validate integrated renderer changes

on:
  workflow_dispatch:
  push:
    branches:
      - "4.7"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/workflows/validate_integrated_renderer.yml"

permissions:
  contents: write

concurrency:
  group: integrated-renderer-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-validation:
    name: Linux editor and renderer smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify integrated source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = {}
          exec(Path("version.py").read_text(encoding="utf-8"), version)
          expected = (4, 7, 2, "stable")
          actual = (version["major"], version["minor"], version["patch"], version["status"])
          if actual != expected:
              raise RuntimeError(f"Expected Godot {expected}, got {actual}")

          required = {
              Path("servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl"): (
                  "p_gtid.y % 8 == depth_array_offset.y",
                  "p_gtid.y % 16 == depth_array_offset.y",
                  "GENERATE_TWO_MIPS",
              ),
              Path("servers/rendering/renderer_rd/effects/ss_effects.cpp"): (
                  "SS_EFFECTS_DOWNSAMPLE_TWO_MIPS",
                  "generated_mip_count",
                  "visibility_bitmask_shader.initialize",
                  "get_active_gather_shader",
              ),
              Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl"): (
                  "uniform sampler2D mesh_depth",
                  "if (!pixel_in_bounds)",
                  "neighbor_pixel + ivec2(1)",
              ),
              Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_jump_flood.glsl"): (
                  "float best_dist = 3.402823466e+38",
                  "ivec2(edge_candidate) - ivec2(1)",
              ),
              Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_blend.glsl"): (
                  "ivec2(edge_coord_u) - ivec2(1)",
              ),
              Path("servers/rendering/shader_types.cpp"): (
                  'built_ins["MESH_BLEND"]',
                  'built_ins["MESH_BLEND_GROUP"]',
              ),
              Path("servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl"): (
                  "MESH_BLEND_OUTPUT_USED",
                  "MESH_BLEND_GROUP_OUTPUT_USED",
                  "frag_visibility_aux.x = clamp(mesh_blend_output",
              ),
              Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl"): (
                  "layout(push_constant, std430) uniform Params",
              ),
              Path("servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl"): (
                  "layout(push_constant, std430) uniform Params",
                  "flags",
              ),
          }
          for path, needles in required.items():
              if not path.exists():
                  raise RuntimeError(f"Required file is missing: {path}")
              content = path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in content:
                      raise RuntimeError(f"{path}: missing {needle}")

          # STANDARD must remain official 4.7.2 outside the fork ABI block.
          # The network-free comparison uses the retained custom shader distinction and
          # the final branch's validation marker as provenance; exact upstream comparison
          # is repeated in the SSAO feature workflow before merge.
          standard = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl").read_text(encoding="utf-8")
          visibility = Path("servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl").read_text(encoding="utf-8")
          if standard == visibility:
              raise RuntimeError("STANDARD and Visibility Bitmask SSAO shaders are identical")

          # No temporary patch workflows may survive integration.
          temporary = sorted(Path(".github/workflows").glob("apply_*renderer*optim*.yml"))
          temporary += sorted(Path(".github/workflows").glob("apply_mesh_blend_*.yml"))
          temporary += sorted(Path(".github/workflows").glob("apply_ssao_standard_*.yml"))
          if temporary:
              raise RuntimeError(f"Temporary patch workflows remain: {temporary}")
          PY

          git diff --check

      - name: Validate modified GLSL stages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 - <<'PY'
          from pathlib import Path

          def write_compute(source: Path, output: Path, defines: str = "") -> None:
              text = source.read_text(encoding="utf-8")
              text = text.replace("#[compute]\n", "", 1)
              text = text.replace("#VERSION_DEFINES", defines, 1)
              output.write_text(text, encoding="utf-8")

          depth = Path("servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl")
          write_compute(depth, Path("/tmp/depth_default.comp"))
          write_compute(depth, Path("/tmp/depth_mips.comp"), "#define GENERATE_MIPS\n")
          write_compute(depth, Path("/tmp/depth_two_mips.comp"), "#define GENERATE_MIPS\n#define GENERATE_TWO_MIPS\n")
          write_compute(depth, Path("/tmp/depth_full_mips.comp"), "#define GENERATE_MIPS\n#define GENERATE_FULL_MIPS\n")

          for name in ("mesh_blend_mask", "mesh_blend_jump_flood"):
              write_compute(
                  Path(f"servers/rendering/renderer_rd/shaders/effects/{name}.glsl"),
                  Path(f"/tmp/{name}.comp"),
              )

          blend = Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_blend.glsl").read_text(encoding="utf-8")
          fragment = blend.split("#[fragment]", 1)[1].replace("#VERSION_DEFINES", "", 1)
          Path("/tmp/mesh_blend_blend.frag").write_text(fragment, encoding="utf-8")

          for source_name in ("ssao", "ssao_visibility_bitmask"):
              source = Path(f"servers/rendering/renderer_rd/shaders/effects/{source_name}.glsl")
              for variant, defines in {
                  "gather": "",
                  "base": "#define SSAO_BASE\n",
                  "adaptive": "#define ADAPTIVE\n",
              }.items():
                  write_compute(source, Path(f"/tmp/{source_name}_{variant}.comp"), defines)
          PY

          for shader in /tmp/depth_*.comp /tmp/mesh_blend_*.comp /tmp/ssao_*.comp; do
            echo "Validating $shader"
            glslangValidator -V --target-env vulkan1.2 -S comp "$shader"
          done
          glslangValidator -V --target-env vulkan1.2 -S frag /tmp/mesh_blend_blend.frag

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Run Compatibility Mesh Blend shader smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/integrated-renderer-test
          cat > /tmp/integrated-renderer-test/project.godot <<'EOF'
          [application]
          config/name="Integrated Renderer Test"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cat > /tmp/integrated-renderer-test/test.gd <<'EOF'
          extends SceneTree

          func _initialize() -> void:
              var shader := Shader.new()
              shader.code = """shader_type spatial;
          uniform sampler2D noise_texture;
          void fragment() {
              float n = texture(noise_texture, UV * 6.0).r;
              MESH_BLEND = smoothstep(0.25, 0.75, n);
              MESH_BLEND_GROUP = 4u;
              ALBEDO = vec3(n);
          }
          """
              var material := ShaderMaterial.new()
              material.shader = shader
              var instance := MeshInstance3D.new()
              instance.mesh = BoxMesh.new()
              instance.material_override = material
              get_root().add_child(instance)
              await process_frame
              await process_frame
              quit()
          EOF

          GODOT_BIN="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.*' | head -n1)"
          test -n "$GODOT_BIN"
          set +e
          "$GODOT_BIN" --headless --rendering-method gl_compatibility --path /tmp/integrated-renderer-test --script /tmp/integrated-renderer-test/test.gd > /tmp/integrated-renderer-test.log 2>&1
          result=$?
          set -e
          cat /tmp/integrated-renderer-test.log
          if grep -Eqi 'unknown identifier.*MESH_BLEND|shader compilation failed|error.*test\.gd' /tmp/integrated-renderer-test.log; then
            exit 1
          fi
          exit "$result"

  windows-validation:
    name: Windows editor compile
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Windows editor
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no
            arch=x86_64

  record-validation:
    name: Record integrated validation
    needs:
      - linux-validation
      - windows-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "4.7"
          fetch-depth: 0

      - name: Commit validation marker without retriggering the workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 4.7
          git checkout -B 4.7 origin/4.7

          mkdir -p .github/build-status
          {
            echo "platforms=linux-editor,windows-editor"
            echo "source_sha=${{ github.sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/build-status/integrated-renderer.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/integrated-renderer.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record integrated renderer validation for ${{ github.sha }}"
          git pull --rebase origin 4.7
          git push origin HEAD:4.7
