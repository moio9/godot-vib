name: Finalize renderer depth and Mesh Blend optimizations

on:
  workflow_dispatch:
  push:
    branches:
      - opt/renderer-depth-final
    paths:
      - .github/workflows/finalize_renderer_depth_optimizations.yml

permissions:
  contents: write

jobs:
  patch-build-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: opt/renderer-depth-final
          fetch-depth: 0

      - name: Apply consolidated idempotent patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def require(path: Path, text: str, needle: str) -> None:
              if needle not in text:
                  raise RuntimeError(f"{path}: missing required result: {needle}")

          # Shared depth preparation.
          shader = Path("servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl")
          text = shader.read_text(encoding="utf-8")
          text = text.replace(
              "still_alive = p_gtid.x % 8 == depth_array_offset.x && depth_array_offset.y % 8 == depth_array_offset.y;",
              "still_alive = p_gtid.x % 8 == depth_array_offset.x && p_gtid.y % 8 == depth_array_offset.y;",
          )
          text = text.replace(
              "still_alive = p_gtid.x % 16 == depth_array_offset.x && depth_array_offset.y % 16 == depth_array_offset.y;",
              "still_alive = p_gtid.x % 16 == depth_array_offset.x && p_gtid.y % 16 == depth_array_offset.y;",
          )
          require(shader, text, "p_gtid.y % 8 == depth_array_offset.y")
          require(shader, text, "p_gtid.y % 16 == depth_array_offset.y")

          if "GENERATE_TWO_MIPS" not in text:
              declaration_pattern = re.compile(
                  r"(?P<d2>layout\(r16f, set = 2, binding = 1\) uniform restrict writeonly image2DArray dest_image2;\n)"
                  r"(?P<rest>layout\(r16f, set = 2, binding = 2\) uniform restrict writeonly image2DArray dest_image3;\n"
                  r"#ifdef GENERATE_FULL_MIPS\n"
                  r"layout\(r16f, set = 2, binding = 3\) uniform restrict writeonly image2DArray dest_image4;\n"
                  r"#endif)"
              )
              text, count = declaration_pattern.subn(
                  r"\g<d2>#ifndef GENERATE_TWO_MIPS\n\g<rest>\n#endif",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Could not add two-mip image declaration variant")

              third_stage = "\tstill_alive = p_gtid.x % 8 == depth_array_offset.x && p_gtid.y % 8 == depth_array_offset.y;"
              if text.count(third_stage) != 1:
                  raise RuntimeError("Could not isolate third mip generation stage")
              text = text.replace(third_stage, "#ifndef GENERATE_TWO_MIPS\n" + third_stage, 1)
              start = text.index("#ifndef GENERATE_TWO_MIPS\n" + third_stage)
              end_marker = "\n}\n#else\n#ifndef USE_HALF_BUFFERS"
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError("Could not close two-mip conditional")
              text = text[:end] + "\n#endif // !GENERATE_TWO_MIPS" + text[end:]
          shader.write_text(text, encoding="utf-8")

          header = Path("servers/rendering/renderer_rd/effects/ss_effects.h")
          text = header.read_text(encoding="utf-8")
          if "SS_EFFECTS_DOWNSAMPLE_TWO_MIPS" not in text:
              text, count = re.subn(
                  r"(?P<indent>^[\t ]*)SS_EFFECTS_MAX",
                  r"\g<indent>SS_EFFECTS_DOWNSAMPLE_TWO_MIPS,\n\g<indent>SS_EFFECTS_MAX",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError("Could not register two-mip downsample mode")
          header.write_text(text, encoding="utf-8")

          cpp = Path("servers/rendering/renderer_rd/effects/ss_effects.cpp")
          text = cpp.read_text(encoding="utf-8")
          if "#define GENERATE_TWO_MIPS" not in text:
              match = re.search(
                  r'(?P<indent>^[\t ]*)downsampler_modes\.push_back\("\\n#define GENERATE_MIPS\\n#define GENERATE_FULL_MIPS"\);',
                  text,
                  flags=re.MULTILINE,
              )
              if not match:
                  raise RuntimeError("Full-mips shader mode registration missing")
              addition = match.group(0) + "\n" + match.group("indent") + 'downsampler_modes.push_back("\\n#define GENERATE_MIPS\\n#define GENERATE_TWO_MIPS\\n");'
              text = text[:match.start()] + addition + text[match.end():]
          if "bool use_two_mips" not in text:
              text, count = re.subn(
                  r"(\tbool use_full_mips = false;)",
                  r"\1\n\tbool use_two_mips = false;",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Could not add two-mip runtime state")
          todo = re.compile(
              r"\t\t} else \{\n"
              r"\t\t\t// Only need the first two mipmaps[^\n]*\n"
              r"\t\t\t// TODO investigate the benefit of a shader version to generate only 2 mips\n"
              r"\t\t\tdownsample_mode = SS_EFFECTS_DOWNSAMPLE_MIPMAP;\n"
              r"\t\t\tuse_mips = true;\n"
              r"\t\t}\n\t}"
          )
          text, _ = todo.subn(
              "\t\t} else {\n\t\t\tdownsample_mode = SS_EFFECTS_DOWNSAMPLE_TWO_MIPS;\n\t\t\tuse_mips = true;\n\t\t\tuse_two_mips = true;\n\t\t}\n\t}",
              text,
              count=1,
          )
          require(cpp, text, "downsample_mode = SS_EFFECTS_DOWNSAMPLE_TWO_MIPS;")
          old_loop = "for (int i = 0; i < (use_full_mips ? 4 : 3); i++) {"
          if old_loop in text:
              text = text.replace(
                  old_loop,
                  "const int generated_mip_count = use_full_mips ? 4 : (use_two_mips ? 2 : 3);\n\t\tfor (int i = 0; i < generated_mip_count; i++) {",
                  1,
              )
          require(cpp, text, "generated_mip_count")
          cpp.write_text(text, encoding="utf-8")

          # Mesh Blend depth sampling.
          mask = Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl")
          text = mask.read_text(encoding="utf-8")
          text = text.replace(
              "layout(r32f, set = 0, binding = 4) uniform readonly image2D mesh_depth;",
              "layout(set = 0, binding = 4) uniform sampler2D mesh_depth;",
          )
          text = text.replace(
              "float depth_value = imageLoad(mesh_depth, sample_pixel).x;",
              "float depth_value = texelFetch(mesh_depth, sample_pixel, 0).x;",
          )
          require(mask, text, "uniform sampler2D mesh_depth;")

          # Workgroup edge correctness: no lane may return before the barrier.
          old_bounds = '''\tivec2 pixel = ivec2(gl_GlobalInvocationID.xy);
\tivec2 resolution = params.resolution;
\tif (any(greaterThanEqual(pixel, resolution))) {
\t\treturn;
\t}

\tivec2 tile_origin = ivec2(gl_WorkGroupID.xy) * THREADCOUNT - ivec2(TILE_BORDER);'''
          if old_bounds in text:
              text = text.replace(
                  old_bounds,
                  '''\tivec2 pixel = ivec2(gl_GlobalInvocationID.xy);
\tivec2 resolution = params.resolution;
\tbool pixel_in_bounds = all(lessThan(pixel, resolution));

\tivec2 tile_origin = ivec2(gl_WorkGroupID.xy) * THREADCOUNT - ivec2(TILE_BORDER);''',
                  1,
              )
          barrier = '''\tbarrier();

\tivec2 local_pixel = local_id + ivec2(TILE_BORDER);'''
          if barrier in text:
              text = text.replace(
                  barrier,
                  '''\tbarrier();

\tif (!pixel_in_bounds) {
\t\treturn;
\t}

\tivec2 local_pixel = local_id + ivec2(TILE_BORDER);''',
                  1,
              )
          require(mask, text, "if (!pixel_in_bounds)")

          # Encode real edge coordinates as coord + 1, reserving zero as the only invalid value.
          text = text.replace(
              "\t\tedge_store.xy = uvec2(neighbor_pixel);",
              "\t\tedge_store.xy = uvec2(neighbor_pixel + ivec2(1));",
              1,
          )
          require(mask, text, "neighbor_pixel + ivec2(1)")
          mask.write_text(text, encoding="utf-8")

          mesh_cpp = Path("servers/rendering/renderer_rd/effects/mesh_blend.cpp")
          whole = mesh_cpp.read_text(encoding="utf-8")
          start = whole.index("void MeshBlend::generate_mask(")
          end = whole.index("void MeshBlend::jump_flood(", start)
          fn = whole[start:end]
          if "MaterialStorage *material_storage" not in fn:
              fn, count = re.subn(
                  r"(\tUniformSetCacheRD \*uniform_cache = UniformSetCacheRD::get_singleton\(\);\n\tERR_FAIL_NULL\(uniform_cache\);\n)",
                  r"\1\tMaterialStorage *material_storage = MaterialStorage::get_singleton();\n\tERR_FAIL_NULL(material_storage);\n\tRID sampler_nearest = material_storage->sampler_rd_get_default(RSE::CANVAS_ITEM_TEXTURE_FILTER_NEAREST, RSE::CANVAS_ITEM_TEXTURE_REPEAT_DISABLED);\n",
                  fn,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError("Could not add Mesh Blend depth sampler")
          fn = fn.replace(
              "RD::Uniform u_depth(RD::UNIFORM_TYPE_IMAGE, 4, Vector<RID>({ p_vb_depth }));",
              "RD::Uniform u_depth(RD::UNIFORM_TYPE_SAMPLER_WITH_TEXTURE, 4, Vector<RID>({ sampler_nearest, p_vb_depth }));",
          )
          require(mesh_cpp, fn, "RD::UNIFORM_TYPE_SAMPLER_WITH_TEXTURE, 4")
          whole = whole[:start] + fn + whole[end:]
          mesh_cpp.write_text(whole, encoding="utf-8")

          renderer = Path("servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp")
          text = renderer.read_text(encoding="utf-8")
          init_old = "bool use_main_depth_for_vb = RendererSceneRenderRD::get_singleton()->is_visibility_buffer_reusing_main_depth();"
          init_new = "bool use_main_depth_for_vb = RendererSceneRenderRD::get_singleton()->is_visibility_buffer_reusing_main_depth() || RendererSceneRenderRD::get_singleton()->is_mesh_blend_enabled();"
          if init_old in text:
              text = text.replace(init_old, init_new, 1)
          text, _ = re.subn(
              r"\n\tif \((?:RendererSceneRenderRD::get_singleton\(\)->is_mesh_blend_enabled\(\)|_mesh_blend_enabled\(\))\) \{\n"
              r"\t\tuse_main_depth_for_vb = false;[^\n]*Mesh blend needs STORAGE usage on depth[^\n]*\n"
              r"\t\}\n",
              "\n",
              text,
              count=1,
          )
          require(renderer, text, "is_visibility_buffer_reusing_main_depth() || RendererSceneRenderRD::get_singleton()->is_mesh_blend_enabled()")
          if "Mesh blend needs STORAGE usage on depth" in text:
              raise RuntimeError("Obsolete Mesh Blend STORAGE override remains")
          renderer.write_text(text, encoding="utf-8")

          flood = Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_jump_flood.glsl")
          text = flood.read_text(encoding="utf-8")
          old_init = '''\tuvec2 best_edge = imageLoad(edges_in, pixel).xy;
\tvec2 best_diff = vec2(pixel - ivec2(best_edge));
\tfloat best_dist = dot(best_diff, best_diff);'''
          if old_init in text:
              text = text.replace(
                  old_init,
                  '''\tuvec2 best_edge = imageLoad(edges_in, pixel).xy;
\tfloat best_dist = 3.402823466e+38;
\tif (any(notEqual(best_edge, uvec2(0u)))) {
\t\tivec2 best_coord = ivec2(best_edge) - ivec2(1);
\t\tvec2 best_diff = vec2(pixel - best_coord);
\t\tbest_dist = dot(best_diff, best_diff);
\t}''',
                  1,
              )
          old_candidate = '''\t\tuvec2 edge_candidate = imageLoad(edges_in, sample_pixel).xy;
\t\tivec2 edge_coord = ivec2(edge_candidate);

\t\tif (any(lessThan(edge_coord, ivec2(0))) || any(greaterThanEqual(edge_coord, params.resolution))) {
\t\t\tcontinue;
\t\t}'''
          if old_candidate in text:
              text = text.replace(
                  old_candidate,
                  '''\t\tuvec2 edge_candidate = imageLoad(edges_in, sample_pixel).xy;
\t\tif (all(equal(edge_candidate, uvec2(0u)))) {
\t\t\tcontinue;
\t\t}
\t\tivec2 edge_coord = ivec2(edge_candidate) - ivec2(1);

\t\tif (any(lessThan(edge_coord, ivec2(0))) || any(greaterThanEqual(edge_coord, params.resolution))) {
\t\t\tcontinue;
\t\t}''',
                  1,
              )
          require(flood, text, "float best_dist = 3.402823466e+38;")
          require(flood, text, "ivec2(edge_candidate) - ivec2(1)")
          flood.write_text(text, encoding="utf-8")

          blend = Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_blend.glsl")
          text = blend.read_text(encoding="utf-8")
          old_decode = '''\tuvec2 edge_coord_u = texelFetch(edge_tex, pixel, 0).xy;
\tivec2 edge_coord = ivec2(edge_coord_u);
\tif (edge_coord == ivec2(0)) {
\t\tfrag_color = texelFetch(source_color, pixel, 0);
\t\treturn;
\t}'''
          if old_decode in text:
              text = text.replace(
                  old_decode,
                  '''\tuvec2 edge_coord_u = texelFetch(edge_tex, pixel, 0).xy;
\tif (all(equal(edge_coord_u, uvec2(0u)))) {
\t\tfrag_color = texelFetch(source_color, pixel, 0);
\t\treturn;
\t}
\tivec2 edge_coord = ivec2(edge_coord_u) - ivec2(1);''',
                  1,
              )
          require(blend, text, "ivec2(edge_coord_u) - ivec2(1)")
          blend.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Validate standalone GLSL stages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 - <<'PY'
          from pathlib import Path

          compute_files = [
              Path("servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl"),
              Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_mask.glsl"),
              Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_jump_flood.glsl"),
          ]
          for source in compute_files:
              text = source.read_text(encoding="utf-8")
              text = text.replace("#[compute]\n", "", 1).replace("#VERSION_DEFINES", "")
              Path("/tmp", source.stem + ".comp").write_text(text, encoding="utf-8")

          source = Path("servers/rendering/renderer_rd/shaders/effects/mesh_blend_blend.glsl")
          text = source.read_text(encoding="utf-8")
          fragment = text.split("#[fragment]", 1)[1]
          fragment = fragment.replace("#VERSION_DEFINES", "")
          Path("/tmp/mesh_blend_blend.frag").write_text(fragment, encoding="utf-8")
          PY
          glslangValidator -V -S comp /tmp/ss_effects_downsample.comp
          glslangValidator -V -S comp /tmp/mesh_blend_mask.comp
          glslangValidator -V -S comp /tmp/mesh_blend_jump_flood.comp
          glslangValidator -V -S frag /tmp/mesh_blend_blend.frag

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Remove inherited temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply_renderer_optimizations.yml
          rm -f .github/workflows/apply_renderer_optimizations_stage2.yml
          rm -f .github/workflows/apply_renderer_optimizations_stage3.yml
          rm -f .github/workflows/apply_renderer_optimizations_robust.yml
          rm -f .github/workflows/finalize_renderer_depth_optimizations.yml

      - name: Commit validated consolidated patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/build-status
          {
            echo "branch=opt/renderer-depth-final"
            echo "validated_by_run=${{ github.run_id }}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/build-status/renderer-depth-final.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize shared depth and fix Mesh Blend edge propagation"
          git push origin HEAD:opt/renderer-depth-final
