name: Compile consolidated renderer optimizations

on:
  pull_request:
    branches:
      - "4.7"
    paths:
      - ".github/workflows/renderer_batch2_compile.yml"
      - "servers/rendering/**"
      - "drivers/gles3/**"
      - "site_scons/site_init.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: renderer-batch2-linux-compile
  cancel-in-progress: false

jobs:
  compile-linux-forward-plus:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'opt/renderer-batch2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v7
        with:
          ref: opt/renderer-batch2
          fetch-depth: 1

      - name: Persist renderer source repairs
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h")
          text = header.read_text(encoding="utf-8")
          bad = "bool ensure_visibility_textures(true, bool p_need_aux = true, bool p_need_depth = true);"
          good = "bool ensure_visibility_textures(bool p_need_full_visibility = true, bool p_need_aux = true, bool p_need_depth = true);"
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good not in text:
              raise RuntimeError("Unexpected ensure_visibility_textures declaration")
          text = text.replace(
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // RG16F',
              '#define RB_TEX_VB_AUX      SNAME("vb_aux")      // R16_UINT: packed group and strength',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R32G32_UINT: edge coords',
              '#define RB_TEX_MESH_BLEND_EDGE0 SNAME("mesh_blend_edge0")     // R16G16_UINT: edge coords',
              1,
          )
          text = text.replace(
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R32G32_UINT: ping/pong',
              '#define RB_TEX_MESH_BLEND_EDGE1 SNAME("mesh_blend_edge1")     // R16G16_UINT: ping/pong',
              1,
          )
          header.write_text(text, encoding="utf-8")

          source = Path("servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp")
          text = source.read_text(encoding="utf-8")
          bad_return = "\treturn has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_VIS) && (p_need_depth ? has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH) : true);"
          good_return = """\tconst bool visibility_ready = has_texture(RB_SCOPE_BUFFERS, p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT);
\tconst bool aux_ready = !p_need_aux || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_AUX);
\tconst bool depth_ready = !p_need_depth || has_texture(RB_SCOPE_BUFFERS, RB_TEX_VB_DEPTH);
\treturn visibility_ready && aux_ready && depth_ready;"""
          if bad_return in text:
              text = text.replace(bad_return, good_return, 1)
          elif good_return not in text:
              raise RuntimeError("Unexpected ensure_visibility_textures return expression")
          source.write_text(text, encoding="utf-8")

          forward = Path("servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp")
          text = forward.read_text(encoding="utf-8")
          outer_anchor = "\tbool using_motion_pass = rb_data.is_valid() && using_upscaling;\n"
          outer_decl = outer_anchor + "\tbool mesh_blend_main_pass = false;\n"
          local_decl = "\t\tconst bool mesh_blend_main_pass = _mesh_blend_enabled() && p_render_data->reflection_probe.is_null() && rb->get_msaa_3d() == RSE::VIEWPORT_MSAA_DISABLED;"
          assignment = "\t\tmesh_blend_main_pass = _mesh_blend_enabled() && p_render_data->reflection_probe.is_null() && rb->get_msaa_3d() == RSE::VIEWPORT_MSAA_DISABLED;"
          if outer_decl not in text:
              if outer_anchor not in text:
                  raise RuntimeError("Could not find Mesh Blend outer-scope anchor")
              text = text.replace(outer_anchor, outer_decl, 1)
          if local_decl in text:
              text = text.replace(local_decl, assignment, 1)
          elif assignment not in text:
              raise RuntimeError("Could not find Mesh Blend main-pass assignment")
          forward.write_text(text, encoding="utf-8")
          PY

          rm -f site_scons/site_init.py

          ! grep -R -n 'ensure_visibility_textures(true,' servers/rendering
          grep -q 'bool ensure_visibility_textures(bool p_need_full_visibility = true' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h
          grep -q 'p_need_full_visibility ? RB_TEX_VB_VIS : RB_TEX_VB_COMPACT' \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp
          grep -q 'bool mesh_blend_main_pass = false;' \
            servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp
          grep -q 'mesh_blend_main_pass = _mesh_blend_enabled()' \
            servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp
          test ! -e site_scons/site_init.py
          git diff --check

      - name: Commit repaired source before compiling
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.h \
            servers/rendering/renderer_rd/storage_rd/render_scene_buffers_rd.cpp \
            servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp \
            site_scons/site_init.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Persist renderer Visibility and main-pass fixes"
            git push origin HEAD:opt/renderer-batch2
          fi

      - name: Verify consolidated renderer source
        shell: bash
        run: |
          set -euxo pipefail
          test -f .github/build-status/renderer-batch2-source.txt
          grep -q '^source_patches=applied$' .github/build-status/renderer-batch2-source.txt
          grep -q 'p_gtid.y % 8 == depth_array_offset.y' servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl
          grep -q 'p_gtid.y % 16 == depth_array_offset.y' servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl
          grep -q 'bool mesh_blend_main_pass = false;' servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp
          grep -q 'mesh_blend_main_pass = _mesh_blend_enabled()' servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp
          grep -q 'mesh_blend_requires_visibility_pass' servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp
          grep -q 'COLOR_PASS_FLAG_MESH_BLEND' servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.h
          grep -Eq 'frag_mesh_blend_aux|pack_mesh_blend_aux|MESH_BLEND_MAIN_PASS_OUTPUT' servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl
          grep -q 'MESH_BLEND_GROUP' servers/rendering/shader_types.cpp
          if grep -R -n 'RB_TEX_MESH_BLEND_MASK\|USE_VISBUFFER_FOR_MESH_BLEND' servers/rendering; then
            echo '::error::Deprecated Mesh Blend path remains'
            exit 1
          fi
          git diff --check

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux Forward+ editor
        shell: bash
        run: |
          set -o pipefail
          scons -j4 \
            platform=linuxbsd \
            target=editor \
            arch=x86_64 \
            dev_mode=yes \
            module_text_server_fb_enabled=yes \
            tests=no \
            2>&1 | tee renderer-batch2-build.log

      - name: Smoke-test compiled editor
        shell: bash
        run: |
          set -euxo pipefail
          binary="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*' -perm -111 | head -n 1)"
          test -n "$binary"
          "$binary" --headless --version | tee renderer-version.txt

      - name: Package Linux editor
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/linux
          binary="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*' -perm -111 | head -n 1)"
          cp "$binary" artifacts/linux/godot-vib-4.7.2-linux-x86_64
          chmod +x artifacts/linux/godot-vib-4.7.2-linux-x86_64
          cp renderer-version.txt artifacts/linux/
          tar -C artifacts/linux -cJf artifacts/godot-vib-4.7.2-linux-x86_64.tar.xz \
            godot-vib-4.7.2-linux-x86_64 renderer-version.txt

      - name: Upload Linux editor
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-4.7.2-linux-x86_64-${{ github.sha }}
          path: artifacts/godot-vib-4.7.2-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Mark Linux compile as passed
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/build-status/renderer-batch2-source.txt')
          text = path.read_text(encoding='utf-8')
          if 'linux_compile=pending' in text:
              text = text.replace('linux_compile=pending', 'linux_compile=passed', 1)
          elif 'linux_compile=passed' not in text:
              text += '\nlinux_compile=passed\n'
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status/renderer-batch2-source.txt
          if ! git diff --cached --quiet; then
            git commit -m "Mark renderer Linux build as passed"
            git push origin HEAD:opt/renderer-batch2
          fi

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-batch2-compile-log-${{ github.sha }}
          path: renderer-batch2-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report success on PR
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/27/comments" \
            -f body="Linux Forward+ compiled successfully from persisted renderer sources and passed --headless --version. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failure on PR
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/27/comments" \
            -f body="Renderer compile failed. Exact run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
