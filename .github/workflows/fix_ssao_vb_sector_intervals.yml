name: Fix SSAO Visibility Bitmask sector intervals

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ssao-vb-sector-intervals
    paths:
      - .github/workflows/fix_ssao_vb_sector_intervals.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ssao-vb-sector-intervals
          fetch-depth: 0

      - name: Replace one-bit samples with conservative angular intervals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl")
          text = path.read_text(encoding="utf-8")
          original = text

          helper_name = "vb_sector_interval_mask"
          if helper_name not in text:
              marker_candidates = [
                  "const float PI",
                  "#define M_PI",
                  "layout(push_constant",
              ]
              insertion_pos = None
              for marker in marker_candidates:
                  pos = text.find(marker)
                  if pos >= 0:
                      insertion_pos = pos
                      break
              if insertion_pos is None:
                  raise RuntimeError("No safe global insertion point was found in the VB shader")
              helper = '''// Conservative 32-sector angular interval used by Visibility Bitmask AO.
// `first` and `last` are inclusive and are always clamped by the caller.
uint vb_sector_interval_mask(uint first, uint last) {
\tuint count = last - first + 1u;
\tuint base_mask = count >= 32u ? 0xFFFFFFFFu : ((1u << count) - 1u);
\treturn base_mask << first;
}

const float VB_SECTORS_PER_RADIAN = 10.185916357881302; // 32 / PI.
const float VB_VIRTUAL_THICKNESS = 0.075; // Fraction of the AO radius.
const float VB_MAX_INTERVAL_RADIUS = 6.0;

'''
              text = text[:insertion_pos] + helper + text[insertion_pos:]

          def find_function_extent(source: str, name: str, search_from: int = 0) -> tuple[int, int]:
              match = re.search(rf"\b[A-Za-z_][A-Za-z0-9_<> ]*\b{name}\s*\(", source[search_from:])
              if match is None:
                  raise RuntimeError(f"Function {name} was not found")
              start = search_from + match.start()
              brace = source.index("{", search_from + match.end())
              depth = 0
              for index in range(brace, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
              raise RuntimeError(f"Function {name} has unbalanced braces")

          # Support one or more overloads, but require every integrate_slice implementation
          # containing a bit write to be converted.
          cursor = 0
          converted_sites = 0
          while True:
              match = re.search(r"\bintegrate_slice\s*\(", text[cursor:])
              if match is None:
                  break
              fn_start, fn_end = find_function_extent(text, "integrate_slice", cursor)
              fn = text[fn_start:fn_end]

              bit_declarations = list(re.finditer(
                  r"(?P<indent>^[\t ]*)uint\s+(?P<bit>[A-Za-z_][A-Za-z0-9_]*)\s*=\s*1u?\s*<<\s*(?P<index>[^;]+);",
                  fn,
                  flags=re.MULTILINE,
              ))
              direct_writes = list(re.finditer(
                  r"(?P<indent>^[\t ]*)(?P<mask>[A-Za-z_][A-Za-z0-9_]*)\s*\|=\s*1u?\s*<<\s*(?P<index>[^;]+);",
                  fn,
                  flags=re.MULTILINE,
              ))

              replacements = []
              for declaration in bit_declarations:
                  bit_name = declaration.group("bit")
                  use = re.search(
                      rf"(?P<indent>^[\t ]*)(?P<mask>[A-Za-z_][A-Za-z0-9_]*)\s*\|=\s*{re.escape(bit_name)}\s*;",
                      fn[declaration.end():],
                      flags=re.MULTILINE,
                  )
                  if use is None:
                      continue
                  use_start = declaration.end() + use.start()
                  use_end = declaration.end() + use.end()
                  replacements.append((
                      declaration.start(),
                      declaration.end(),
                      use_start,
                      use_end,
                      declaration.group("indent"),
                      use.group("mask"),
                      declaration.group("index").strip(),
                  ))

              for direct in direct_writes:
                  replacements.append((
                      direct.start(),
                      direct.end(),
                      None,
                      None,
                      direct.group("indent"),
                      direct.group("mask"),
                      direct.group("index").strip(),
                  ))

              # Apply from bottom to top so source offsets remain valid.
              for site_index, site in enumerate(sorted(replacements, key=lambda item: item[0], reverse=True), 1):
                  start, end, use_start, use_end, indent, mask_name, index_expr = site
                  preceding = fn[:start]

                  dist_matches = list(re.finditer(
                      r"(?:float|highp\s+float)\s+([A-Za-z_][A-Za-z0-9_]*(?:dist_sq|distance_sq|dist2)[A-Za-z0-9_]*)\s*=",
                      preceding,
                  ))
                  if not dist_matches:
                      # The current fork uses a `dist_sq` identifier; retain a strict fallback.
                      dist_matches = list(re.finditer(r"\b(dist_sq)\b", preceding))
                  falloff_matches = list(re.finditer(
                      r"(?:float|highp\s+float)\s+([A-Za-z_][A-Za-z0-9_]*falloff[A-Za-z0-9_]*)\s*=",
                      preceding,
                  ))
                  if not dist_matches or not falloff_matches:
                      raise RuntimeError(
                          "A one-bit VB write was found without preceding distance-squared and falloff values"
                      )
                  dist_name = dist_matches[-1].group(1)
                  falloff_name = falloff_matches[-1].group(1)
                  suffix = f"_{converted_sites + site_index}"
                  code = (
                      f"{indent}uint vb_center_sector{suffix} = uint(clamp(float({index_expr}), 0.0, 31.0));\n"
                      f"{indent}float vb_distance_rcp{suffix} = inversesqrt(max({dist_name}, 1e-8));\n"
                      f"{indent}float vb_angular_radius{suffix} = params.radius * VB_VIRTUAL_THICKNESS * clamp({falloff_name}, 0.0, 1.0) * vb_distance_rcp{suffix};\n"
                      f"{indent}uint vb_sector_radius{suffix} = uint(clamp(ceil(vb_angular_radius{suffix} * VB_SECTORS_PER_RADIAN), 0.0, VB_MAX_INTERVAL_RADIUS));\n"
                      f"{indent}uint vb_first_sector{suffix} = vb_center_sector{suffix} > vb_sector_radius{suffix} ? vb_center_sector{suffix} - vb_sector_radius{suffix} : 0u;\n"
                      f"{indent}uint vb_last_sector{suffix} = min(31u, vb_center_sector{suffix} + vb_sector_radius{suffix});\n"
                      f"{indent}{mask_name} |= vb_sector_interval_mask(vb_first_sector{suffix}, vb_last_sector{suffix});"
                  )
                  if use_start is not None:
                      fn = fn[:use_start] + fn[use_end:]
                  fn = fn[:start] + code + fn[end:]
                  converted_sites += 1

              text = text[:fn_start] + fn + text[fn_end:]
              cursor = fn_start + len(fn)

          if converted_sites == 0 and "vb_center_sector_" not in text:
              raise RuntimeError("No one-bit Visibility Bitmask sample writes were converted")

          # VB must produce its own visibility result. Retain STANDARD as a separate pipeline,
          # but remove the old heuristic blend between two unrelated AO estimators.
          visibility_names = set(re.findall(r"\b([A-Za-z_][A-Za-z0-9_]*vb_visibility[A-Za-z0-9_]*)\b", text))
          mix_replacements = 0
          for visibility_name in visibility_names:
              pattern = re.compile(
                  rf"mix\(\s*[^,\n]+\s*,\s*{re.escape(visibility_name)}\s*,\s*[^)\n]+\)",
              )
              text, count = pattern.subn(visibility_name, text)
              mix_replacements += count
          if mix_replacements == 0 and re.search(r"mix\([^\n]*vb_visibility", text):
              raise RuntimeError("A heuristic STANDARD/VB mix remains but could not be rewritten safely")
          if re.search(r"mix\([^\n]*vb_visibility", text):
              raise RuntimeError("Visibility Bitmask output is still mixed with STANDARD AO")

          # The only remaining 1u << operations should be the interval helper itself.
          for fn_match in re.finditer(r"\bintegrate_slice\s*\(", text):
              fn_start, fn_end = find_function_extent(text, "integrate_slice", fn_match.start())
              fn = text[fn_start:fn_end]
              if re.search(r"1u?\s*<<", fn):
                  raise RuntimeError("A one-sector write remains inside integrate_slice")

          if text == original:
              raise RuntimeError("The Visibility Bitmask shader was not modified")
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Validate all Visibility Bitmask gather variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
          python3 - <<'PY'
          from pathlib import Path
          source = Path("servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl")
          original = source.read_text(encoding="utf-8")
          for name, defines in {
              "gather": "",
              "base": "#define SSAO_BASE\n",
              "adaptive": "#define ADAPTIVE\n",
          }.items():
              text = original.replace("#[compute]\n", "", 1).replace("#VERSION_DEFINES", defines, 1)
              Path(f"/tmp/ssao_vb_{name}.comp").write_text(text, encoding="utf-8")
          PY
          for shader in /tmp/ssao_vb_*.comp; do
            glslangValidator -V --target-env vulkan1.2 -S comp "$shader" -o "${shader%.comp}.spv"
            spirv-val --target-env vulkan1.2 "${shader%.comp}.spv"
          done

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Remove workflow, record validation and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix_ssao_vb_sector_intervals.yml
          mkdir -p .github/build-status
          {
            echo "branch=fix/ssao-vb-sector-intervals"
            echo "validated_by_run=${{ github.run_id }}"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sector_count=32"
            echo "virtual_thickness_fraction=0.075"
          } > .github/build-status/ssao-vb-sector-intervals.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use conservative angular intervals in SSAO Visibility Bitmask"
          git push origin HEAD:fix/ssao-vb-sector-intervals
