name: Restore official SSAO and split VB shader v2

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ssao-standard-4.7.2
    paths:
      - .github/workflows/apply_ssao_standard_split_v2.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ssao-standard-4.7.2
          fetch-depth: 0

      - name: Create distinct official and VB SSAO shaders
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl ]; then
            cp servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
               servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl
          fi
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/servers/rendering/renderer_rd/shaders/effects/ssao.glsl \
            -o servers/rendering/renderer_rd/shaders/effects/ssao.glsl

      - name: Patch pipeline routing safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def parse_function(text: str, pattern: str) -> tuple[int, int, str]:
              match = re.search(pattern, text)
              if not match:
                  raise RuntimeError(f"Function not found: {pattern}")
              start = match.start()
              brace = text.index("{", match.end())
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1, text[start:i + 1]
              raise RuntimeError("Unbalanced function braces")

          header = Path("servers/rendering/renderer_rd/effects/ss_effects.h")
          h = header.read_text(encoding="utf-8")
          std_inc = '#include "servers/rendering/renderer_rd/shaders/effects/ssao.glsl.gen.h"'
          vb_inc = '#include "servers/rendering/renderer_rd/shaders/effects/ssao_visibility_bitmask.glsl.gen.h"'
          if vb_inc not in h:
              if std_inc not in h:
                  raise RuntimeError("Missing standard SSAO generated-header include")
              h = h.replace(std_inc, std_inc + "\n" + vb_inc, 1)

          if "visibility_bitmask_shader;" not in h:
              match = re.search(
                  r"(?P<indent>^[\t ]*)SsaoShaderRD gather_shader;\n"
                  r"(?P=indent)RID gather_shader_version;",
                  h,
                  flags=re.MULTILINE,
              )
              if not match:
                  raise RuntimeError("Could not find SSAO gather shader fields")
              indent = match.group("indent")
              replacement = (
                  match.group(0)
                  + "\n" + indent + "SsaoVisibilityBitmaskShaderRD visibility_bitmask_shader;"
                  + "\n" + indent + "RID visibility_bitmask_shader_version;"
                  + "\n" + indent + "PipelineDeferredRD visibility_bitmask_pipelines[SSAO_GATHER_ADAPTIVE + 1];"
              )
              h = h[:match.start()] + replacement + h[match.end():]
          header.write_text(h, encoding="utf-8")

          cpp = Path("servers/rendering/renderer_rd/effects/ss_effects.cpp")
          c = cpp.read_text(encoding="utf-8")

          if "visibility_bitmask_shader.initialize(ssao_modes);" not in c:
              init_pos = c.index("ssao.gather_shader.initialize(ssao_modes);")
              loop_match = re.search(
                  r"(?P<indent>^[\t ]*)for \(int i = 0; i <= SSAO_GATHER_ADAPTIVE; i\+\+\) \{\n"
                  r"(?P<body>.*?)\n(?P=indent)\}",
                  c[init_pos:],
                  flags=re.MULTILINE | re.DOTALL,
              )
              if not loop_match:
                  raise RuntimeError("Could not parse standard SSAO gather pipeline loop")
              absolute_end = init_pos + loop_match.end()
              indent = loop_match.group("indent")
              addition = (
                  "\n\n" + indent + "ssao.visibility_bitmask_shader.initialize(ssao_modes);"
                  "\n" + indent + "ssao.visibility_bitmask_shader_version = ssao.visibility_bitmask_shader.version_create();"
                  "\n" + indent + "for (int i = 0; i <= SSAO_GATHER_ADAPTIVE; i++) {"
                  "\n" + indent + "\tssao.visibility_bitmask_pipelines[i].create_compute_pipeline(ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, i));"
                  "\n" + indent + "}"
              )
              c = c[:absolute_end] + addition + c[absolute_end:]

          # Explicitly release the added shader version beside the standard one if this code path exists.
          if "visibility_bitmask_shader.version_free" not in c:
              match = re.search(
                  r"(?P<indent>^[\t ]*)ssao\.gather_shader\.version_free\(ssao\.gather_shader_version\);",
                  c,
                  flags=re.MULTILINE,
              )
              if match:
                  insertion = match.group(0) + "\n" + match.group("indent") + "ssao.visibility_bitmask_shader.version_free(ssao.visibility_bitmask_shader_version);"
                  c = c[:match.start()] + insertion + c[match.end():]

          fn_start, fn_end, fn = parse_function(
              c,
              r"void SSEffects::(?:generate_SSAO_shadows_internal|generate_ssao_shadows_internal)\s*\(",
          )
          if "p_use_vb" not in fn:
              raise RuntimeError("SSAO gather function is missing p_use_vb")

          # Rewrite only pre-existing call sites, before inserting helper functions.
          shader_needle = "ssao.gather_shader.version_get_shader(ssao.gather_shader_version,"
          shader_count = 0
          cursor = 0
          while True:
              pos = fn.find(shader_needle, cursor)
              if pos < 0:
                  break
              arg_start = pos + len(shader_needle)
              paren_depth = 0
              end = arg_start
              while end < len(fn):
                  ch = fn[end]
                  if ch == "(":
                      paren_depth += 1
                  elif ch == ")":
                      if paren_depth == 0:
                          break
                      paren_depth -= 1
                  end += 1
              if end >= len(fn):
                  raise RuntimeError("Unterminated SSAO gather-shader lookup")
              arg = fn[arg_start:end].strip()
              replacement = f"get_active_gather_shader({arg})"
              fn = fn[:pos] + replacement + fn[end + 1:]
              cursor = pos + len(replacement)
              shader_count += 1

          fn, pipeline_count = re.subn(
              r"ssao\.pipelines\[([^\]]+)\]\.get_rid\(\)",
              r"get_active_gather_pipeline(\1)",
              fn,
          )
          if shader_count == 0 or pipeline_count == 0:
              raise RuntimeError(f"Routing incomplete: shader={shader_count}, pipeline={pipeline_count}")

          body = fn.index("{") + 1
          helpers = '''
\tauto get_active_gather_shader = [&](int p_mode) -> RID {
\t\treturn p_use_vb ? ssao.visibility_bitmask_shader.version_get_shader(ssao.visibility_bitmask_shader_version, p_mode) : ssao.gather_shader.version_get_shader(ssao.gather_shader_version, p_mode);
\t};
\tauto get_active_gather_pipeline = [&](int p_mode) -> RID {
\t\treturn p_use_vb ? ssao.visibility_bitmask_pipelines[p_mode].get_rid() : ssao.pipelines[p_mode].get_rid();
\t};
'''
          fn = fn[:body] + helpers + fn[body:]
          c = c[:fn_start] + fn + c[fn_end:]
          cpp.write_text(c, encoding="utf-8")
          PY

          git diff --check

      - name: Set up Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Compile Linux editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: >-
            dev_mode=yes
            module_text_server_fb_enabled=yes
            tests=no

      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply_ssao_standard_split.yml
          rm -f .github/workflows/apply_ssao_standard_split_v2.yml

      - name: Commit compiled SSAO split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore official 4.7.2 SSAO and isolate visibility-bitmask gather"
          git push origin HEAD:fix/ssao-standard-4.7.2
