name: Linux x86_64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - "renderer-batch2-stable"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/actions/**"
      - ".github/workflows/renderer_batch2_compile_fixed.yml"
  pull_request:
    branches:
      - "4.7"
    paths:
      - "core/**"
      - "drivers/**"
      - "editor/**"
      - "main/**"
      - "modules/**"
      - "platform/**"
      - "scene/**"
      - "servers/**"
      - "thirdparty/**"
      - "SConstruct"
      - "version.py"
      - ".github/actions/**"
      - ".github/workflows/renderer_batch2_compile_fixed.yml"

permissions:
  contents: read

concurrency:
  group: linux-x86-64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x86-64:
    name: Linux x86_64 editor
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout exact fork commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: recursive

      - name: Verify renderer and SSAO contracts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shader = Path("servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl").read_text(encoding="utf-8")
          shader_header = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.h").read_text(encoding="utf-8")
          shader_cpp = Path("servers/rendering/renderer_rd/forward_clustered/scene_shader_forward_clustered.cpp").read_text(encoding="utf-8")
          renderer = Path("servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp").read_text(encoding="utf-8")
          ssao = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl").read_text(encoding="utf-8")
          ss_effects = Path("servers/rendering/renderer_rd/effects/ss_effects.cpp").read_text(encoding="utf-8")

          assert shader.count("layout(location = 3) out uint frag_mesh_blend_aux;") == 1
          assert "#ifdef MESH_BLEND_MAIN_PASS_OUTPUT\nlayout(location = 3) out uint frag_mesh_blend_aux;\n#endif" in shader
          assert "layout(location = 0) out vec4 frag_color;\n#define MESH_BLEND_MAIN_PASS_OUTPUT" not in shader
          assert "SHADER_COLOR_PASS_FLAG_MESH_BLEND = 1 << 5" in shader_header
          assert "PIPELINE_COLOR_PASS_FLAG_MESH_BLEND = 1 << 5" in shader_header
          assert "SHADER_COLOR_PASS_FLAG_COUNT = 1 << 6" in shader_header
          assert '"\\n#define MESH_BLEND_MAIN_PASS_OUTPUT\\n"' in shader_cpp
          assert "const uint32_t color_attachment_count = 4;" in shader_cpp
          assert renderer.count("VALID_FLAG_COMBINATION(COLOR_PASS_FLAG_MESH_BLEND") == 8
          assert "transparent_color_pass_flags &= ~uint32_t(COLOR_PASS_FLAG_MESH_BLEND);" in renderer

          # Standard mode must retain the Godot 4.7.2 Intel SSAO path.
          assert "INTELSSAO_MAIN_DISK_SAMPLE_COUNT" in ssao
          assert "SSAO_ADAPTIVE_TAP_BASE_COUNT" in ssao
          assert "SSAO_ADAPTIVE_TAP_FLEXIBLE_COUNT" in ssao
          assert "calculate_pixel_obscurance" in ssao
          assert "params.horizon_angle_threshold" in ssao
          assert "if (!p_adaptive_base && params.flags.x > 0.5)" in ssao

          # Visibility Bitmask must use finite front/back angular intervals.
          assert "#define VB_SECTOR_COUNT 32u" in ssao
          assert "vb_update_sectors" in ssao
          assert "delta_back = delta_pos - p_view_dir * p_thickness" in ssao
          assert "bitCount(occluded_sectors)" in ssao
          assert "bidirectional = params.flags.x > 1.5" in ssao

          # The discarded approximate GTAO/GT-VBAO implementation must stay gone.
          for bad in ("GT-VBAO implementation", "integrate_slice(", "Simplified GTAO", "This is not quite right", "Let's use a robust approximation"):
              assert bad not in ssao

          assert "ssao.gather_push_constant.flags[0] = float(p_settings.vb_mode);" in ss_effects
          PY
          git diff --check

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Install Vulkan runtime test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb xauth

      - name: Compile Linux x86_64 Forward+ editor
        shell: bash
        run: |
          set -o pipefail
          scons -j2 \
            platform=linuxbsd \
            target=editor \
            arch=x86_64 \
            dev_mode=yes \
            module_text_server_fb_enabled=yes \
            tests=no \
            2>&1 | tee linux-x86_64-build.log

      - name: Locate and smoke-test editor
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.x86_64*' -perm -111 | head -n 1)"
          test -n "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --headless --version | tee linux-x86_64-version.txt

      - name: Exercise MSAA Mesh Blend and all SSAO algorithms on Vulkan
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime-test
          cat > runtime-test/project.godot <<'EOF'
          [application]
          config/name="MSAA Mesh Blend and SSAO Runtime Test"
          run/main_scene="res://main.tscn"

          [display]
          window/size/viewport_width=320
          window/size/viewport_height=240
          window/size/window_width_override=320
          window/size/window_height_override=240

          [rendering]
          renderer/rendering_method="forward_plus"
          renderer/rendering_method.mobile="forward_plus"
          mesh_blend/enabled=true
          EOF

          cat > runtime-test/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://main.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > runtime-test/main.gd <<'EOF'
          extends Node3D

          func _ready() -> void:
              get_viewport().msaa_3d = Viewport.MSAA_2X

              var camera := Camera3D.new()
              camera.position = Vector3(0.0, 1.3, 5.0)
              camera.look_at_from_position(camera.position, Vector3(0.0, 0.3, 0.0))
              camera.current = true
              add_child(camera)

              var light := DirectionalLight3D.new()
              light.rotation_degrees = Vector3(-35.0, -25.0, 0.0)
              light.shadow_enabled = true
              add_child(light)

              var env := Environment.new()
              env.background_mode = Environment.BG_COLOR
              env.background_color = Color(0.12, 0.12, 0.12)
              env.ssao_enabled = true
              env.ssao_radius = 1.5
              env.ssao_intensity = 2.0
              var world_env := WorldEnvironment.new()
              world_env.environment = env
              add_child(world_env)

              var floor_mesh := MeshInstance3D.new()
              var floor_box := BoxMesh.new()
              floor_box.size = Vector3(6.0, 0.2, 6.0)
              floor_mesh.mesh = floor_box
              floor_mesh.position = Vector3(0.0, -0.6, 0.0)
              add_child(floor_mesh)

              var mesh_instance := MeshInstance3D.new()
              mesh_instance.mesh = BoxMesh.new()
              var shader := Shader.new()
              shader.code = """
          shader_type spatial;
          render_mode cull_back;
          void fragment() {
              ALBEDO = vec3(0.35, 0.7, 0.25);
              ROUGHNESS = 0.8;
              MESH_BLEND = 0.75;
              MESH_BLEND_GROUP = 1u;
          }
          """
              var material := ShaderMaterial.new()
              material.shader = shader
              mesh_instance.material_override = material
              add_child(mesh_instance)

              for mode in [0, 1, 2]:
                  env.ssao_algorithm = mode
                  print("SSAO_MODE_BEGIN=", mode)
                  for frame in range(10):
                      await get_tree().process_frame
                  print("SSAO_MODE_OK=", mode)

              get_tree().quit()
          EOF

          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$LVP_ICD"
          vulkaninfo --summary | tee vulkan-summary.txt

          set +e
          timeout 120s xvfb-run -a env VK_ICD_FILENAMES="$LVP_ICD" \
            "$BIN" --path runtime-test --rendering-method forward_plus --rendering-driver vulkan \
            --verbose 2>&1 | tee linux-x86_64-vulkan-runtime.log
          runtime_status=${PIPESTATUS[0]}
          set -e
          test "$runtime_status" -eq 0

          grep -Fq "Vulkan" linux-x86_64-vulkan-runtime.log
          grep -Fq "SSAO_MODE_OK=0" linux-x86_64-vulkan-runtime.log
          grep -Fq "SSAO_MODE_OK=1" linux-x86_64-vulkan-runtime.log
          grep -Fq "SSAO_MODE_OK=2" linux-x86_64-vulkan-runtime.log

          if grep -E -q \
            'p_blend_state\.attachments\.size\(\) < pass\.color_attachments\.size\(\)|Mismatch fragment shader output mask|Invalid color pass flag combination|pipeline\.is_null\(\)|Invalid Task ID|Attempted to free invalid ID|Error compiling (Fragment|Vertex|Compute) shader|Failed parse|SCRIPT ERROR|Parse Error' \
            linux-x86_64-vulkan-runtime.log; then
            echo "::error::Vulkan runtime validation found a renderer/SSAO failure"
            grep -E -n -B3 -A8 \
              'p_blend_state\.attachments\.size\(\) < pass\.color_attachments\.size\(\)|Mismatch fragment shader output mask|Invalid color pass flag combination|pipeline\.is_null\(\)|Invalid Task ID|Attempted to free invalid ID|Error compiling (Fragment|Vertex|Compute) shader|Failed parse|SCRIPT ERROR|Parse Error' \
              linux-x86_64-vulkan-runtime.log || true
            exit 1
          fi

      - name: Package Linux x86_64 editor
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          install -m 0755 "$BIN" package/godot-vib-4.7.2-linux-x86_64
          cp linux-x86_64-version.txt package/
          cp linux-x86_64-vulkan-runtime.log package/
          printf '%s\n' "${GITHUB_SHA}" > package/commit.txt
          tar -C package -cJf godot-vib-4.7.2-linux-x86_64.tar.xz .
          sha256sum godot-vib-4.7.2-linux-x86_64.tar.xz > godot-vib-4.7.2-linux-x86_64.tar.xz.sha256

      - name: Upload Linux x86_64 editor
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-linux-x86_64-${{ github.sha }}
          path: |
            godot-vib-4.7.2-linux-x86_64.tar.xz
            godot-vib-4.7.2-linux-x86_64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: godot-vib-linux-x86_64-validation-${{ github.sha }}
          path: |
            linux-x86_64-build.log
            linux-x86_64-vulkan-runtime.log
            linux-x86_64-version.txt
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 14

# Runtime validation marker: Standard + Visibility Bitmask Uni/Bi + MSAA revision 103
