name: Fix Mesh Blend sampler enum namespace

on:
  pull_request:
    branches:
      - "4.7"
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'opt/4.7.2-renderer-depth-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update enum namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('servers/rendering/renderer_rd/effects/mesh_blend.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'material_storage->sampler_rd_get_default(RSE::CANVAS_ITEM_TEXTURE_FILTER_NEAREST, RSE::CANVAS_ITEM_TEXTURE_REPEAT_DISABLED)'
          new = 'material_storage->sampler_rd_get_default(RS::CANVAS_ITEM_TEXTURE_FILTER_NEAREST, RS::CANVAS_ITEM_TEXTURE_REPEAT_DISABLED)'
          if old in text:
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one old sampler expression, found {text.count(old)}')
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('Mesh Blend sampler expression not found')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/pr_fix_mesh_blend_sampler_enum.yml').unlink()
          PY

          git diff --check
          grep -n 'sampler_rd_get_default(RS::CANVAS_ITEM_TEXTURE_FILTER_NEAREST' servers/rendering/renderer_rd/effects/mesh_blend.cpp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Mesh Blend sampler enum namespace for Godot 4.7.2'
          git push origin HEAD
