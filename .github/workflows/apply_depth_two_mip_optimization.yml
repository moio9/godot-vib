name: Apply two-mip depth optimization

on:
  push:
    branches:
      - "opt/renderer-depth-meshblend"
    paths:
      - "misc/scripts/apply_depth_two_mip_optimization.py"
      - ".github/workflows/apply_depth_two_mip_optimization.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[two-mip-opt-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v6
        with:
          ref: opt/renderer-depth-meshblend
          fetch-depth: 0

      - name: Apply guarded source transformations
        run: python3 misc/scripts/apply_depth_two_mip_optimization.py

      - name: Validate patch
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              "servers/rendering/renderer_rd/effects/ss_effects.cpp",
              "servers/rendering/renderer_rd/effects/ss_effects.h",
              "servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl",
          }
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).split())
          if actual != expected:
              raise SystemExit(f"Unexpected changed files: actual={sorted(actual)}, expected={sorted(expected)}")
          PY

      - name: Commit optimized depth pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            servers/rendering/renderer_rd/effects/ss_effects.cpp \
            servers/rendering/renderer_rd/effects/ss_effects.h \
            servers/rendering/renderer_rd/shaders/effects/ss_effects_downsample.glsl
          git commit -m "Generate only required depth mips for mixed SSAO and SSIL resolutions [two-mip-opt-applied]"
          git push origin HEAD:opt/renderer-depth-meshblend
