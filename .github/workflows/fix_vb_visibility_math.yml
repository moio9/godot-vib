name: Fix Visibility Bitmask math

on:
  push:
    branches:
      - renderer-batch2-stable
    paths:
      - .github/workflows/fix_vb_visibility_math.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: renderer-batch2-stable
          fetch-depth: 0

      - name: Repair Visibility Bitmask math
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("servers/rendering/renderer_rd/shaders/effects/ssao.glsl")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, got {text.count(old)}")
              text = text.replace(old, new, 1)

          # Match the GTAO/Visibility-Bitmask slice orientation used by the reference implementation.
          replace_once(
              "float normal_angle = sign(dot(projected_normal, tangent)) * acos(cos_n);",
              "float normal_angle = -sign(dot(projected_normal, tangent)) * acos(cos_n);",
              "normal angle sign",
          )

          # Activate sectors whose centers are covered by the sample interval (round criterion).
          pattern = re.compile(r"uint vb_update_sectors\(float p_min_horizon, float p_max_horizon, uint p_mask\) \{.*?\n\}", re.S)
          replacement = "\n".join([
              "uint vb_update_sectors(float p_min_horizon, float p_max_horizon, uint p_mask) {",
              "\tfloat lo = clamp(min(p_min_horizon, p_max_horizon), 0.0, 1.0);",
              "\tfloat hi = clamp(max(p_min_horizon, p_max_horizon), 0.0, 1.0);",
              "\tfloat sector_count = float(VB_SECTOR_COUNT);",
              "\tuint start = uint(clamp(floor(lo * sector_count + 0.5), 0.0, sector_count));",
              "\tuint end = uint(clamp(floor(hi * sector_count + 0.5), 0.0, sector_count));",
              "\tif (end <= start) {",
              "\t\treturn p_mask;",
              "\t}",
              "\tuint count = end - start;",
              "\tuint bits;",
              "\tif (count >= VB_SECTOR_COUNT) {",
              "\t\tbits = 0xFFFFFFFFu;",
              "\t} else {",
              "\t\tbits = (1u << count) - 1u;",
              "\t}",
              "\treturn p_mask | (bits << start);",
              "}",
          ])
          text, matches = pattern.subn(replacement, text, count=1)
          if matches != 1:
              raise RuntimeError(f"sector update: expected one function, got {matches}")

          # Use a thin virtual surface. With the common radius=2 this is thickness=0.1,
          # matching the thin-object example from the paper much better than the old 0.24.
          replace_once(
              "float thickness = max(0.01, viewspace_radius * 0.12);",
              "float thickness = max(0.01, viewspace_radius * 0.05);",
              "virtual thickness",
          )

          # A slice is an unoriented plane. Both Bi and Uni therefore distribute slice planes
          # over PI. Uni chooses only one of the two ray directions of that plane.
          replace_once(
              "float angle_span = bidirectional ? VB_PI : VB_TAU;",
              "float angle_span = VB_PI;",
              "slice angular span",
          )

          # Match standard SSAO's screen-border radius reduction to avoid bright/popping edges.
          border_old = "\tpixel_lookup_radius = max(pixel_lookup_radius, 1.0);\n"
          border_new = "\n".join([
              "\tpixel_lookup_radius = max(pixel_lookup_radius, 1.0);",
              "\tif (p_quality_level >= SSAO_REDUCE_RADIUS_NEAR_SCREEN_BORDER_ENABLE_AT_QUALITY_PRESET) {",
              "\t\tfloat near_screen_border = min(min(normalized_screen_pos.x, 1.0 - normalized_screen_pos.x), min(normalized_screen_pos.y, 1.0 - normalized_screen_pos.y));",
              "\t\tnear_screen_border = clamp(10.0 * near_screen_border + 0.6, 0.0, 1.0);",
              "\t\tpixel_lookup_radius *= near_screen_border;",
              "\t}",
              "",
          ])
          replace_once(border_old, border_new, "screen border radius")

          # Choose the one sampled side for Uni in the same slice parameterization used by Bi.
          side_old = "\t\tuint occluded_sectors = 0u;\n\t\tfloat radial_jitter = fract(jitter + float(slice) * 0.61803398875);"
          side_new = "\n".join([
              "\t\tuint occluded_sectors = 0u;",
              "\t\tfloat sampled_side = 1.0;",
              "\t\tif (!bidirectional) {",
              "\t\t\tfloat side_noise = fract(jitter + float(slice) * 0.7548776662466927);",
              "\t\t\tsampled_side = side_noise < 0.5 ? -1.0 : 1.0;",
              "\t\t}",
              "\t\tfloat radial_jitter = fract(jitter + float(slice) * 0.61803398875);",
          ])
          replace_once(side_old, side_new, "Uni side selection")

          trace_old = "\n".join([
              "\t\t\tvec2 uv_offset = omega * sample_pixels * params.half_screen_pixel_size;",
              "\t\t\tvb_trace_sample(occluded_sectors, normalized_screen_pos + uv_offset, mip_level, pix_center_pos, view_dir, normal_angle, 1.0, thickness, viewspace_radius);",
              "\t\t\tif (bidirectional) {",
              "\t\t\t\tvb_trace_sample(occluded_sectors, normalized_screen_pos - uv_offset, mip_level, pix_center_pos, view_dir, normal_angle, -1.0, thickness, viewspace_radius);",
              "\t\t\t}",
          ])
          trace_new = "\n".join([
              "\t\t\tvec2 uv_offset = omega * sample_pixels * params.half_screen_pixel_size;",
              "\t\t\tif (bidirectional) {",
              "\t\t\t\tvb_trace_sample(occluded_sectors, normalized_screen_pos + uv_offset, mip_level, pix_center_pos, view_dir, normal_angle, 1.0, thickness, viewspace_radius);",
              "\t\t\t\tvb_trace_sample(occluded_sectors, normalized_screen_pos - uv_offset, mip_level, pix_center_pos, view_dir, normal_angle, -1.0, thickness, viewspace_radius);",
              "\t\t\t} else {",
              "\t\t\t\tvb_trace_sample(occluded_sectors, normalized_screen_pos + sampled_side * uv_offset, mip_level, pix_center_pos, view_dir, normal_angle, sampled_side, thickness, viewspace_radius);",
              "\t\t\t}",
          ])
          replace_once(trace_old, trace_new, "Uni/Bi ray tracing")

          replace_once(
              "\t\tvisibility_sum += 1.0 - float(bitCount(occluded_sectors)) / float(VB_SECTOR_COUNT);",
              "\n".join([
                  "\t\tfloat occluded_fraction = float(bitCount(occluded_sectors)) / float(VB_SECTOR_COUNT);",
                  "\t\tif (!bidirectional) {",
                  "\t\t\toccluded_fraction = min(1.0, occluded_fraction * 2.0);",
                  "\t\t}",
                  "\t\tvisibility_sum += 1.0 - occluded_fraction;",
              ]),
              "Uni estimator normalization",
          )

          if text == original:
              raise RuntimeError("No shader changes were made")
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          grep -Fq 'float normal_angle = -sign(dot(projected_normal, tangent)) * acos(cos_n);' servers/rendering/renderer_rd/shaders/effects/ssao.glsl
          grep -Fq 'floor(lo * sector_count + 0.5)' servers/rendering/renderer_rd/shaders/effects/ssao.glsl
          grep -Fq 'float angle_span = VB_PI;' servers/rendering/renderer_rd/shaders/effects/ssao.glsl
          grep -Fq 'sampled_side = side_noise < 0.5 ? -1.0 : 1.0;' servers/rendering/renderer_rd/shaders/effects/ssao.glsl
          grep -Fq 'occluded_fraction = min(1.0, occluded_fraction * 2.0);' servers/rendering/renderer_rd/shaders/effects/ssao.glsl

      - name: Commit repaired shader and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix_vb_visibility_math.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Visibility Bitmask slice and sector math'
          git push origin HEAD:renderer-batch2-stable
